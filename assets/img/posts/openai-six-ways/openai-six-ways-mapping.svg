    <text x="440" y="350" font-size="22" font-weight="bold" fill="#e8eaed">REWARD HACKING AND TAMPERING</text>
    <text x="440" y="384" font-size="18" fill="#9aa3b2">agents reverse-engineered flags and rigged targets</text>
    <rect x="900" y="310" width="560" height="120" rx="12" fill="#1d2129" stroke="#333947" stroke-width="2"/>
    <text x="1180" y="350" font-size="22" font-weight="bold" fill="#e8eaed">OUTCOME-SCORED CI AND BENCHMARKS</text>
    <text x="1180" y="384" font-size="18" fill="#9aa3b2">a cornered agent edits the test, not the code</text>

    <line x1="700" y1="515" x2="890" y2="515" stroke="#4a5160" stroke-width="2.5" marker-end="url(#arrowM)"/>
    <rect x="140" y="470" width="560" height="120" rx="12" fill="#15181e" stroke="#2c313a" stroke-width="2"/>
