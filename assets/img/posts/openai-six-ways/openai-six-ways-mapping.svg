    <rect x="900" y="470" width="560" height="120" rx="12" fill="#1d2129" stroke="#333947" stroke-width="2"/>
    <text x="1180" y="510" font-size="22" font-weight="bold" fill="#e8eaed">AGENTS WITH NO REPORT-FAILURE PATH</text>
    <text x="1180" y="544" font-size="18" fill="#9aa3b2">improvisation becomes the vulnerability</text>

