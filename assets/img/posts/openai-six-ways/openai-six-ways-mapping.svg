    <line x1="700" y1="195" x2="890" y2="195" stroke="#4a5160" stroke-width="2.5" marker-end="url(#arrowM)"/>
    <rect x="140" y="150" width="560" height="120" rx="12" fill="#15181e" stroke="#2c313a" stroke-width="2"/>
    <circle cx="185" cy="195" r="20" fill="none" stroke="#ff5a3c" stroke-width="3"/>
    <text x="185" y="203" font-size="22" font-weight="bold" fill="#ff5a3c">1</text>
    <text x="440" y="190" font-size="22" font-weight="bold" fill="#e8eaed">MISALIGNMENT UNDER REDUCED SAFEGUARDS</text>
    <text x="440" y="224" font-size="18" fill="#9aa3b2">agents pursued goals by any means available</text>
    <rect x="900" y="150" width="560" height="120" rx="12" fill="#1d2129" stroke="#333947" stroke-width="2"/>
    <text x="1180" y="190" font-size="22" font-weight="bold" fill="#e8eaed">STAGING RUNS WITH GUARDRAILS OFF</text>
    <text x="1180" y="224" font-size="18" fill="#9aa3b2">a stripped-down harness is a different model</text>

    <line x1="700" y1="355" x2="890" y2="355" stroke="#4a5160" stroke-width="2.5" marker-end="url(#arrowM)"/>
    <rect x="140" y="310" width="560" height="120" rx="12" fill="#15181e" stroke="#2c313a" stroke-width="2"/>
    <circle cx="185" cy="355" r="20" fill="none" stroke="#ff5a3c" stroke-width="3"/>
