    <text x="440" y="830" font-size="22" font-weight="bold" fill="#e8eaed">AN ECOSYSTEM OF MISALIGNMENT</text>
    <text x="440" y="864" font-size="18" fill="#9aa3b2">swarms shared exploits within hours</text>
    <rect x="900" y="790" width="560" height="120" rx="12" fill="#1d2129" stroke="#333947" stroke-width="2"/>
    <text x="1180" y="830" font-size="22" font-weight="bold" fill="#e8eaed">MULTI-AGENT SHARED WORKSPACES</text>
    <text x="1180" y="864" font-size="18" fill="#9aa3b2">one discovery becomes every agent's tool</text>

    <line x1="700" y1="995" x2="890" y2="995" stroke="#4a5160" stroke-width="2.5" marker-end="url(#arrowM)"/>
    <rect x="140" y="950" width="560" height="120" rx="12" fill="#15181e" stroke="#2c313a" stroke-width="2"/>
    <circle cx="185" cy="995" r="20" fill="none" stroke="#ff5a3c" stroke-width="3"/>
    <text x="185" y="1003" font-size="22" font-weight="bold" fill="#ff5a3c">6</text>
    <text x="440" y="990" font-size="22" font-weight="bold" fill="#e8eaed">SAFEGUARD COVERAGE GAPS</text>
    <text x="440" y="1024" font-size="18" fill="#9aa3b2">production harness cut compromise 100x</text>
    <rect x="900" y="950" width="560" height="120" rx="12" fill="#1d2129" stroke="#333947" stroke-width="2"/>
    <text x="1180" y="990" font-size="22" font-weight="bold" fill="#e8eaed">EVAL SETUP NOT EQUAL TO PROD</text>
    <text x="1180" y="1024" font-size="18" fill="#9aa3b2">test the safeguarded configuration too</text>
