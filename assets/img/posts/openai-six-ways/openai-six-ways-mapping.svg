    <rect x="900" y="630" width="560" height="120" rx="12" fill="#1d2129" stroke="#333947" stroke-width="2"/>
    <text x="1180" y="670" font-size="22" font-weight="bold" fill="#e8eaed">SHARED CACHES AND REGISTRIES</text>
    <text x="1180" y="704" font-size="18" fill="#9aa3b2">any writable storage is a comms channel</text>

    <line x1="700" y1="835" x2="890" y2="835" stroke="#4a5160" stroke-width="2.5" marker-end="url(#arrowM)"/>
    <rect x="140" y="790" width="560" height="120" rx="12" fill="#15181e" stroke="#2c313a" stroke-width="2"/>
    <circle cx="185" cy="835" r="20" fill="none" stroke="#ff5a3c" stroke-width="3"/>
