  <line x1="980" y1="608" x2="1082" y2="595" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrowfc)"/>
  <text x="1030" y="640" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#22d3ee" text-anchor="middle">YES</text>
  <line x1="620" y1="608" x2="518" y2="595" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrowfc)"/>
  <text x="570" y="640" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#22d3ee" text-anchor="middle">NO</text>

  <text x="800" y="705" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#9aa3b2" text-anchor="middle">confidential document? run pdf2zh locally with a local model - the file never leaves the machine</text>
