  <line x1="620" y1="248" x2="518" y2="248" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrowfc)"/>
  <text x="570" y="232" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#22d3ee" text-anchor="middle">AFTER</text>
