  <line x1="980" y1="488" x2="1082" y2="488" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrowfc)"/>
  <text x="1030" y="472" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#22d3ee" text-anchor="middle">YES</text>
  <line x1="800" y1="521" x2="800" y2="570" stroke="#4a5160" stroke-width="4" marker-end="url(#arrowf)"/>
  <text x="830" y="555" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#9aa3b2">NO</text>

  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="620" y="575" width="360" height="66" rx="12" fill="#15181e" stroke="#2c313a" stroke-width="3"/>
    <text x="800" y="616" font-size="22" font-weight="bold" fill="#e8eaed">QUICK AND FREE?</text>

    <rect x="1090" y="545" width="380" height="86" rx="12" fill="#15181e" stroke="#22d3ee" stroke-width="3"/>
    <text x="1280" y="580" font-size="22" font-weight="bold" fill="#22d3ee">GOOGLE TRANSLATE</text>
    <text x="1280" y="610" font-size="18" fill="#9aa3b2">Documents tab - 10 MB, 300 pages</text>

    <rect x="130" y="545" width="380" height="86" rx="12" fill="#15181e" stroke="#22d3ee" stroke-width="3"/>
    <text x="320" y="580" font-size="22" font-weight="bold" fill="#22d3ee">DEEPL</text>
    <text x="320" y="610" font-size="18" fill="#9aa3b2">Translate files tab - best prose quality</text>
