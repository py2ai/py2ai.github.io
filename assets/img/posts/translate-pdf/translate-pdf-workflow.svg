    <text x="1280" y="360" font-size="22" font-weight="bold" fill="#22d3ee">PDF2ZH</text>
    <text x="1280" y="390" font-size="18" fill="#9aa3b2">pdf2zh document.pdf - mono + dual output</text>
  </g>

  <line x1="980" y1="368" x2="1082" y2="368" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrowfc)"/>
  <text x="1030" y="352" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#22d3ee" text-anchor="middle">YES</text>
  <line x1="800" y1="401" x2="800" y2="450" stroke="#4a5160" stroke-width="4" marker-end="url(#arrowf)"/>
  <text x="830" y="435" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#9aa3b2">NO</text>

