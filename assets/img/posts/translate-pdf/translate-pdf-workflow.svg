    <text x="800" y="144" font-size="26" font-weight="bold" fill="#a78bfa">YOUR PDF</text>
  </g>

  <line x1="800" y1="170" x2="800" y2="210" stroke="#4a5160" stroke-width="4" marker-end="url(#arrowf)"/>

