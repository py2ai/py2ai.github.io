      <path d="M0,0 L10,5 L0,10 z" fill="#4a5160"/>
    </marker>
    <marker id="arrowfc" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="760" fill="none"/>

  <text x="800" y="60" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#e8eaed" text-anchor="middle">WHICH TOOL FOR YOUR PDF</text>

  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
