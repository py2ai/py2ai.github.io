<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <rect x="0" y="0" width="1600" height="760" fill="none"/>

  <text x="800" y="64" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#e8eaed" text-anchor="middle">WHY TRANSLATION BREAKS PDFs</text>

  <g>
    <rect x="120" y="130" width="600" height="480" rx="16" fill="#15181e" stroke="#2c313a" stroke-width="3"/>
    <text x="420" y="180" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#e8eaed" text-anchor="middle">WHAT A PDF REALLY IS</text>
    <rect x="200" y="220" width="280" height="330" rx="8" fill="#1d2129" stroke="#333947" stroke-width="2"/>
    <line x1="230" y1="250" x2="400" y2="250" stroke="#4a5160" stroke-width="5" stroke-linecap="round"/>
    <line x1="230" y1="280" x2="440" y2="280" stroke="#4a5160" stroke-width="5" stroke-linecap="round"/>
    <line x1="230" y1="310" x2="380" y2="310" stroke="#4a5160" stroke-width="5" stroke-linecap="round"/>
    <line x1="520" y1="250" x2="650" y2="250" stroke="#4a5160" stroke-width="5" stroke-linecap="round"/>
    <line x1="520" y1="280" x2="640" y2="280" stroke="#4a5160" stroke-width="5" stroke-linecap="round"/>
    <rect x="230" y="360" width="140" height="90" rx="6" fill="#2c313a"/>
    <line x1="520" y1="370" x2="660" y2="370" stroke="#4a5160" stroke-width="5" stroke-linecap="round"/>
    <line x1="520" y1="398" x2="650" y2="398" stroke="#4a5160" stroke-width="5" stroke-linecap="round"/>
    <line x1="520" y1="426" x2="620" y2="426" stroke="#4a5160" stroke-width="5" stroke-linecap="round"/>
    <line x1="230" y1="490" x2="660" y2="490" stroke="#4a5160" stroke-width="5" stroke-linecap="round"/>
    <text x="205" y="240" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#a78bfa">x, y</text>
    <line x1="180" y1="220" x2="180" y2="560" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="180" y1="560" x2="500" y2="560" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="420" y="655" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#9aa3b2" text-anchor="middle">a fixed drawing: glyphs at coordinates, no flow</text>
  </g>

  <g>
    <rect x="880" y="130" width="600" height="480" rx="16" fill="#15181e" stroke="#2c313a" stroke-width="3"/>
    <text x="1180" y="180" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#e8eaed" text-anchor="middle">WHAT NAIVE TRANSLATION DOES</text>
    <rect x="960" y="220" width="280" height="330" rx="8" fill="#1d2129" stroke="#333947" stroke-width="2"/>
    <line x1="930" y1="250" x2="1240" y2="250" stroke="#ff5a3c" stroke-width="5" stroke-linecap="round"/>
    <line x1="990" y1="280" x2="1350" y2="280" stroke="#ff5a3c" stroke-width="5" stroke-linecap="round"/>
    <line x1="1000" y1="310" x2="1240" y2="310" stroke="#ff5a3c" stroke-width="5" stroke-linecap="round"/>
    <line x1="1250" y1="255" x2="1560" y2="255" stroke="#ff5a3c" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    <rect x="960" y="360" width="140" height="90" rx="6" fill="#2c313a"/>
    <line x1="930" y1="375" x2="1120" y2="375" stroke="#ff5a3c" stroke-width="5" stroke-linecap="round"/>
    <line x1="950" y1="400" x2="1080" y2="400" stroke="#ff5a3c" stroke-width="5" stroke-linecap="round"/>
    <line x1="1250" y1="370" x2="1560" y2="370" stroke="#ff5a3c" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    <line x1="990" y1="490" x2="1360" y2="490" stroke="#ff5a3c" stroke-width="5" stroke-linecap="round"/>
    <line x1="990" y1="518" x2="1300" y2="518" stroke="#ff5a3c" stroke-width="5" stroke-linecap="round"/>
    <text x="1180" y="655" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#9aa3b2" text-anchor="middle">new words, new lengths, old boxes: overlap and overflow</text>
  </g>

  <text x="800" y="710" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#e8eaed" text-anchor="middle">scanned page: worse - the text is pixels, one big image, nothing to extract</text>
</svg>
