<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <rect x="0" y="0" width="1600" height="760" fill="none"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="400" y="70" font-size="34" font-weight="bold" fill="#e8eaed" text-anchor="middle">Memory bandwidth (GB/s)</text>
    <line x1="120" y1="560" x2="680" y2="560" stroke="#3a3f4a" stroke-width="3"/>
    <rect x="180" y="120" width="150" height="440" fill="#76b900" opacity="0.85"/>
    <rect x="440" y="163" width="150" height="397" fill="#ff5a3c" opacity="0.85"/>
    <text x="255" y="100" font-size="30" font-weight="bold" fill="#e8eaed" text-anchor="middle">273</text>
    <text x="515" y="143" font-size="30" font-weight="bold" fill="#e8eaed" text-anchor="middle">256</text>
    <text x="255" y="605" font-size="24" fill="#9aa3b2" text-anchor="middle">DGX Spark</text>
    <text x="515" y="605" font-size="24" fill="#9aa3b2" text-anchor="middle">Ryzen AI Halo</text>

    <text x="1160" y="70" font-size="34" font-weight="bold" fill="#e8eaed" text-anchor="middle">Retail price (USD)</text>
    <line x1="880" y1="560" x2="1440" y2="560" stroke="#3a3f4a" stroke-width="3"/>
    <rect x="940" y="209" width="150" height="351" fill="#76b900" opacity="0.85"/>
    <rect x="1200" y="272" width="150" height="288" fill="#ff5a3c" opacity="0.85"/>
    <text x="1015" y="189" font-size="30" font-weight="bold" fill="#e8eaed" text-anchor="middle">4,699</text>
    <text x="1275" y="252" font-size="30" font-weight="bold" fill="#e8eaed" text-anchor="middle">3,999</text>
    <text x="1015" y="605" font-size="24" fill="#9aa3b2" text-anchor="middle">DGX Spark</text>
    <text x="1275" y="605" font-size="24" fill="#9aa3b2" text-anchor="middle">Ryzen AI Halo</text>

    <g text-anchor="middle">
      <text x="800" y="680" font-size="26" fill="#c8cdd6">Same 128 GB unified memory class - 700 dollars and one seventh of a terabyte of storage apart</text>
      <text x="800" y="720" font-size="22" fill="#7a828f">Spark: 4 TB NVMe, ConnectX-7 clustering, DGX OS only - Halo: 2 TB NVMe, 10 GbE, Windows 11 Pro or Linux</text>
