<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <rect x="0" y="0" width="1600" height="760" fill="none"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="800" y="60" font-size="34" font-weight="bold" fill="#e8eaed" text-anchor="middle">First hour on each machine</text>

    <g>
      <text x="240" y="150" font-size="28" font-weight="bold" fill="#76b900" text-anchor="middle">NVIDIA DGX SPARK</text>
      <rect x="60" y="190" width="330" height="110" rx="14" fill="none" stroke="#3a3f4a" stroke-width="3"/>
      <text x="225" y="238" font-size="26" fill="#e8eaed" text-anchor="middle">Boot DGX OS</text>
      <text x="225" y="272" font-size="21" fill="#9aa3b2" text-anchor="middle">drivers and stack preinstalled</text>
      <line x1="390" y1="245" x2="440" y2="245" stroke="#4a5160" stroke-width="4" marker-end="url(#arr)"/>
      <rect x="445" y="190" width="330" height="110" rx="14" fill="none" stroke="#3a3f4a" stroke-width="3"/>
      <text x="610" y="238" font-size="26" fill="#e8eaed" text-anchor="middle">Open a playbook</text>
      <text x="610" y="272" font-size="21" fill="#9aa3b2" text-anchor="middle">curated NVIDIA recipes</text>
      <line x1="775" y1="245" x2="825" y2="245" stroke="#4a5160" stroke-width="4" marker-end="url(#arr)"/>
      <rect x="830" y="190" width="330" height="110" rx="14" fill="none" stroke="#3a3f4a" stroke-width="3"/>
      <text x="995" y="238" font-size="26" fill="#e8eaed" text-anchor="middle">Launch NIM container</text>
      <text x="995" y="272" font-size="21" fill="#9aa3b2" text-anchor="middle">vLLM or prebuilt microservice</text>
      <line x1="1160" y1="245" x2="1210" y2="245" stroke="#4a5160" stroke-width="4" marker-end="url(#arr)"/>
      <rect x="1215" y="190" width="330" height="110" rx="14" fill="none" stroke="#76b900" stroke-width="3"/>
      <text x="1380" y="238" font-size="26" fill="#e8eaed" text-anchor="middle">OpenAI-style endpoint</text>
      <text x="1380" y="272" font-size="21" fill="#9aa3b2" text-anchor="middle">serve 20B-class in minutes</text>
    </g>

    <g>
      <text x="240" y="430" font-size="28" font-weight="bold" fill="#ff5a3c" text-anchor="middle">AMD RYZEN AI HALO</text>
      <rect x="60" y="470" width="330" height="110" rx="14" fill="none" stroke="#3a3f4a" stroke-width="3"/>
      <text x="225" y="518" font-size="26" fill="#e8eaed" text-anchor="middle">Windows 11 or Linux</text>
      <text x="225" y="552" font-size="21" fill="#9aa3b2" text-anchor="middle">your daily driver stays installed</text>
      <line x1="390" y1="525" x2="440" y2="525" stroke="#4a5160" stroke-width="4" marker-end="url(#arr)"/>
      <rect x="445" y="470" width="330" height="110" rx="14" fill="none" stroke="#3a3f4a" stroke-width="3"/>
      <text x="610" y="518" font-size="26" fill="#e8eaed" text-anchor="middle">Developer Center</text>
      <text x="610" y="552" font-size="21" fill="#9aa3b2" text-anchor="middle">preloaded tools and playbooks</text>
      <line x1="775" y1="525" x2="825" y2="525" stroke="#4a5160" stroke-width="4" marker-end="url(#arr)"/>
      <rect x="830" y="470" width="330" height="110" rx="14" fill="none" stroke="#3a3f4a" stroke-width="3"/>
      <text x="995" y="518" font-size="26" fill="#e8eaed" text-anchor="middle">Ollama or LM Studio</text>
      <text x="995" y="552" font-size="21" fill="#9aa3b2" text-anchor="middle">llama.cpp and ComfyUI ready</text>
      <line x1="1160" y1="525" x2="1210" y2="525" stroke="#4a5160" stroke-width="4" marker-end="url(#arr)"/>
      <rect x="1215" y="470" width="330" height="110" rx="14" fill="none" stroke="#ff5a3c" stroke-width="3"/>
      <text x="1380" y="518" font-size="26" fill="#e8eaed" text-anchor="middle">OpenAI-style endpoint</text>
      <text x="1380" y="552" font-size="21" fill="#9aa3b2" text-anchor="middle">4-bit 30B MoE is a great start</text>
    </g>

    <text x="800" y="680" font-size="24" fill="#7a828f" text-anchor="middle">Both roads end in the same place: a local endpoint your existing tools reach with one base URL change</text>
  </g>

  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5160"/>
    </marker>
  </defs>
</svg>
