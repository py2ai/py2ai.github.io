<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <rect x="0" y="0" width="1600" height="760" fill="none"/>

  <text x="800" y="70" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#e8eaed" text-anchor="middle">THE SAME PROPHECY SINCE 1952</text>
  <text x="800" y="110" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#9aa3b2" text-anchor="middle">every abstraction wave was supposed to end programming</text>

  <line x1="80" y1="420" x2="1520" y2="420" stroke="#3a3f4a" stroke-width="5" stroke-linecap="round"/>

  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <circle cx="170" cy="420" r="9" fill="#ff5a3c"/>
    <rect x="80" y="200" width="200" height="160" rx="12" fill="#15181e" stroke="#2c313a" stroke-width="3"/>
    <text x="180" y="240" font-size="28" font-weight="bold" fill="#e8eaed">1952</text>
    <text x="180" y="272" font-size="18" fill="#9aa3b2">A-0 compiler</text>
    <text x="180" y="296" font-size="18" fill="#9aa3b2">ends manual</text>
    <text x="180" y="318" font-size="18" fill="#9aa3b2">machine code</text>

    <circle cx="430" cy="420" r="9" fill="#ff5a3c"/>
    <rect x="330" y="200" width="200" height="160" rx="12" fill="#15181e" stroke="#2c313a" stroke-width="3"/>
    <text x="430" y="240" font-size="28" font-weight="bold" fill="#e8eaed">1954</text>
    <text x="430" y="272" font-size="18" fill="#9aa3b2">Fortran ends</text>
    <text x="430" y="296" font-size="18" fill="#9aa3b2">the specialist;</text>
    <text x="430" y="318" font-size="18" fill="#9aa3b2">demand explodes</text>

    <circle cx="690" cy="420" r="9" fill="#ff5a3c"/>
    <rect x="590" y="200" width="200" height="160" rx="12" fill="#15181e" stroke="#2c313a" stroke-width="3"/>
    <text x="690" y="240" font-size="28" font-weight="bold" fill="#e8eaed">1959</text>
    <text x="690" y="272" font-size="18" fill="#9aa3b2">COBOL lets</text>
    <text x="690" y="296" font-size="18" fill="#9aa3b2">managers program;</text>
    <text x="690" y="318" font-size="18" fill="#9aa3b2">runs banks 60 years</text>

    <circle cx="950" cy="420" r="9" fill="#ff5a3c"/>
    <rect x="850" y="200" width="200" height="160" rx="12" fill="#15181e" stroke="#2c313a" stroke-width="3"/>
    <text x="950" y="240" font-size="28" font-weight="bold" fill="#e8eaed">1982</text>
    <text x="950" y="272" font-size="18" fill="#9aa3b2">Application</text>
    <text x="950" y="296" font-size="18" fill="#9aa3b2">Development</text>
    <text x="950" y="318" font-size="18" fill="#9aa3b2">Without Programmers</text>

    <circle cx="1210" cy="420" r="9" fill="#ff5a3c"/>
    <rect x="1110" y="200" width="200" height="160" rx="12" fill="#15181e" stroke="#2c313a" stroke-width="3"/>
    <text x="1210" y="240" font-size="28" font-weight="bold" fill="#e8eaed">2025</text>
    <text x="1210" y="272" font-size="18" fill="#9aa3b2">90% of code</text>
    <text x="1210" y="296" font-size="18" fill="#9aa3b2">in 6 months;</text>
    <text x="1210" y="318" font-size="18" fill="#9aa3b2">deadline passes</text>

    <circle cx="1450" cy="420" r="9" fill="#ff5a3c"/>
    <rect x="1350" y="200" width="200" height="160" rx="12" fill="#15181e" stroke="#2c313a" stroke-width="3"/>
    <text x="1450" y="240" font-size="28" font-weight="bold" fill="#e8eaed">2026</text>
    <text x="1450" y="272" font-size="18" fill="#9aa3b2">profession</text>
    <text x="1450" y="296" font-size="18" fill="#9aa3b2">vanishes by</text>
    <text x="1450" y="318" font-size="18" fill="#9aa3b2">year end</text>
  </g>

  <g transform="rotate(-8 800 500)">
    <rect x="620" y="460" width="360" height="84" rx="10" fill="none" stroke="#ff5a3c" stroke-width="6"/>
    <text x="800" y="516" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ff5a3c" text-anchor="middle">STILL HERE</text>
  </g>

  <text x="800" y="640" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#9aa3b2" text-anchor="middle">every wave automated coding - software kept growing</text>
  <text x="800" y="678" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#e8eaed" text-anchor="middle">what changed now is not the coder, it is the artifact</text>
</svg>
