<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" fill="none"/>

  <text x="800" y="80" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#e8eaed" text-anchor="middle">THE END OF THE SOFTWARE ARTIFACT</text>
  <text x="800" y="122" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#9aa3b2" text-anchor="middle">code is generated at runtime, used once, discarded</text>

  <g>
    <rect x="150" y="220" width="480" height="480" rx="18" fill="#15181e" stroke="#2c313a" stroke-width="3" stroke-dasharray="12 8"/>
    <rect x="330" y="280" width="120" height="150" rx="8" fill="#1d2129" stroke="#333947" stroke-width="2"/>
    <polygon points="410,280 450,320 410,320" fill="#2c313a"/>
    <line x1="350" y1="345" x2="430" y2="345" stroke="#4a5160" stroke-width="4" stroke-linecap="round"/>
    <line x1="350" y1="370" x2="430" y2="370" stroke="#4a5160" stroke-width="4" stroke-linecap="round"/>
    <line x1="350" y1="395" x2="415" y2="395" stroke="#4a5160" stroke-width="4" stroke-linecap="round"/>
    <text x="390" y="490" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#e8eaed" text-anchor="middle">SOFTWARE</text>
    <text x="390" y="530" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#9aa3b2" text-anchor="middle">frozen decision logic in source code</text>
    <text x="390" y="566" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#ff5a3c" text-anchor="middle" font-weight="bold">1952 - 2026</text>
    <text x="390" y="620" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#9aa3b2" text-anchor="middle">write, ship, install, maintain</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <line x1="640" y1="430" x2="940" y2="430" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
    <polygon points="940,418 968,430 940,442" fill="#a78bfa"/>
    <text x="800" y="400" font-size="26" font-weight="bold" fill="#a78bfa">INTENT</text>
    <text x="800" y="482" font-size="26" font-weight="bold" fill="#22d3ee">OUTCOME</text>
  </g>

  <g>
    <rect x="970" y="220" width="480" height="480" rx="18" fill="#15181e" stroke="#2c313a" stroke-width="3"/>
    <circle cx="1210" cy="390" r="70" fill="#1d2129" stroke="#22d3ee" stroke-width="4"/>
    <circle cx="1210" cy="390" r="24" fill="#22d3ee"/>
    <g stroke="#4a5160" stroke-width="3" fill="none" stroke-dasharray="6 6">
      <circle cx="1210" cy="390" r="115"/>
    </g>
    <circle cx="1210" cy="275" r="10" fill="#a78bfa"/>
    <circle cx="1315" cy="430" r="10" fill="#a78bfa"/>
    <circle cx="1150" cy="490" r="10" fill="#a78bfa"/>
    <circle cx="1105" cy="340" r="10" fill="#a78bfa"/>
    <text x="1210" y="545" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#e8eaed" text-anchor="middle">AGENT</text>
    <text x="1210" y="585" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#9aa3b2" text-anchor="middle">model, tools, memory, policy</text>
    <line x1="1120" y1="620" x2="1300" y2="620" stroke="#4a5160" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <line x1="1140" y1="645" x2="1280" y2="645" stroke="#4a5160" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
    <line x1="1160" y1="670" x2="1260" y2="670" stroke="#4a5160" stroke-width="4" stroke-linecap="round" opacity="0.2"/>
    <text x="1210" y="700" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#9aa3b2" text-anchor="middle">ephemeral code: lives for seconds</text>
  </g>
</svg>
