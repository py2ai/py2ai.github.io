<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <marker id="arrowgray" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5160"/>
    </marker>
    <marker id="arrowcyan" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="760" fill="none"/>

  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="70" font-size="30" font-weight="bold" fill="#e8eaed">SOFTWARE 1.0 AND 2.0: CODE IS THE PRODUCT</text>
    <text x="800" y="106" font-size="22" fill="#9aa3b2">licenses, then seats - the artifact is what you buy</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">
    <rect x="90" y="170" width="220" height="90" rx="14" fill="#15181e" stroke="#2c313a" stroke-width="3"/>
    <text x="200" y="210" fill="#e8eaed">HUMAN</text>
    <text x="200" y="240" fill="#9aa3b2" font-size="20" font-weight="normal">writes code</text>

    <rect x="390" y="170" width="220" height="90" rx="14" fill="#15181e" stroke="#2c313a" stroke-width="3"/>
    <text x="500" y="210" fill="#e8eaed">AI ASSIST</text>
    <text x="500" y="240" fill="#9aa3b2" font-size="20" font-weight="normal">autocomplete</text>

    <rect x="690" y="170" width="220" height="90" rx="14" fill="#15181e" stroke="#2c313a" stroke-width="3"/>
    <text x="800" y="210" fill="#e8eaed">SOFTWARE</text>
    <text x="800" y="240" fill="#9aa3b2" font-size="20" font-weight="normal">durable artifact</text>

    <rect x="990" y="170" width="220" height="90" rx="14" fill="#15181e" stroke="#2c313a" stroke-width="3"/>
    <text x="1100" y="210" fill="#e8eaed">SHIP</text>
    <text x="1100" y="240" fill="#9aa3b2" font-size="20" font-weight="normal">license or seat</text>

    <rect x="1290" y="170" width="220" height="90" rx="14" fill="#15181e" stroke="#2c313a" stroke-width="3"/>
    <text x="1400" y="210" fill="#e8eaed">RESULT</text>
    <text x="1400" y="240" fill="#9aa3b2" font-size="20" font-weight="normal">eventually</text>
  </g>

  <g stroke="#4a5160" stroke-width="4" marker-end="url(#arrowgray)">
    <line x1="310" y1="215" x2="382" y2="215"/>
    <line x1="610" y1="215" x2="682" y2="215"/>
    <line x1="910" y1="215" x2="982" y2="215"/>
    <line x1="1210" y1="215" x2="1282" y2="215"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="330" font-size="26" fill="#a78bfa" font-weight="bold">the middle steps collapse</text>
    <line x1="1180" y1="280" x2="1000" y2="392" stroke="#a78bfa" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrowgray)"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="470" font-size="30" font-weight="bold" fill="#e8eaed">SOFTWARE 3.0: THE AGENT IS THE PRODUCT</text>
    <text x="800" y="506" font-size="22" fill="#9aa3b2">Agent-as-a-Service - billing follows outcomes, not access</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">
    <rect x="240" y="570" width="280" height="100" rx="14" fill="#15181e" stroke="#a78bfa" stroke-width="3"/>
    <text x="380" y="612" fill="#a78bfa">INTENT</text>
    <text x="380" y="646" fill="#9aa3b2" font-size="20" font-weight="normal">specify the goal</text>

    <rect x="660" y="570" width="280" height="100" rx="14" fill="#15181e" stroke="#22d3ee" stroke-width="3"/>
    <text x="800" y="612" fill="#22d3ee">AGENT</text>
    <text x="800" y="646" fill="#9aa3b2" font-size="20" font-weight="normal">plans, builds, runs</text>

    <rect x="1080" y="570" width="280" height="100" rx="14" fill="#15181e" stroke="#22d3ee" stroke-width="3"/>
    <text x="1220" y="612" fill="#e8eaed">RESULT</text>
    <text x="1220" y="646" fill="#9aa3b2" font-size="20" font-weight="normal">verified, billed</text>
  </g>

  <g stroke="#22d3ee" stroke-width="5" marker-end="url(#arrowcyan)">
    <line x1="520" y1="620" x2="652" y2="620"/>
    <line x1="940" y1="620" x2="1072" y2="620"/>
  </g>
</svg>
