<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Inter, system-ui, -apple-system, sans-serif">
<style>
  :root { --bg:#fff; --surface:#f8fafc; --border:#e2e8f0; --text:#1e293b; --text2:#64748b; --accent:#2563eb; --accent-soft:#dbeafe; --green:#059669; --purple:#7c3aed; --orange:#ea580c; }
  text { fill: #1e293b; }
  .title { font-size:20px; font-weight:700; fill:#1e293b; }
  .subtitle { font-size:13px; font-weight:600; fill:#475569; }
  .label { font-size:12px; font-weight:600; fill:#1e293b; }
  .small { font-size:10px; fill:#64748b; }
  .annot { font-size:9px; fill:#94a3b8; }
  .phase-label { font-size:15px; font-weight:700; }
</style>
<defs>
  <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
  <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#059669"/></marker>
  <marker id="arrow-green-dash" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#059669"/></marker>
  <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/></marker>
  <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ea580c"/></marker>
  <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/></filter>
</defs>
<rect width="1200" height="820" fill="#ffffff"/>
<text x="600" y="32" text-anchor="middle" class="title">LLM Inference: Prompt (Prefill) vs Decode (Autoregressive)</text>
<text x="600" y="50" text-anchor="middle" class="small">Two distinct computational phases with fundamentally different performance characteristics</text>
<rect x="40" y="70" width="540" height="410" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="310" y="95" text-anchor="middle" class="phase-label" fill="#2563eb">Phase 1: Prompt / Prefill</text>
<text x="310" y="112" text-anchor="middle" class="small">All input tokens processed in parallel | Compute-bound</text>
<rect x="80" y="140" width="80" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="120" y="163" text-anchor="middle" class="label">The</text>
<rect x="176" y="140" width="80" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="216" y="163" text-anchor="middle" class="label">cat</text>
<rect x="272" y="140" width="80" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="312" y="163" text-anchor="middle" class="label">sat</text>
<rect x="368" y="140" width="80" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="408" y="163" text-anchor="middle" class="label">on</text>
<rect x="464" y="140" width="80" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="504" y="163" text-anchor="middle" class="label">the</text>
<line x1="120" y1="176" x2="120" y2="200" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<line x1="216" y1="176" x2="216" y2="200" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<line x1="312" y1="176" x2="312" y2="200" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<line x1="408" y1="176" x2="408" y2="200" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<line x1="504" y1="176" x2="504" y2="200" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="310" y="194" text-anchor="middle" class="annot">parallel embedding</text>
<rect x="80" y="200" width="460" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="310" y="222" text-anchor="middle" class="label">Transformer Layers (Self-Attention + FFN)</text>
<text x="310" y="240" text-anchor="middle" class="small">Matrix-Matrix multiplication | All tokens attend to each other</text>
<text x="310" y="256" text-anchor="middle" class="annot">High arithmetic intensity | GPU compute cores fully utilized</text>
<line x1="310" y1="264" x2="310" y2="296" stroke="#059669" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrow-green-dash)"/>
<text x="320" y="284" class="small" fill="#059669">write K,V</text>
<ellipse cx="310" cy="296" rx="160" ry="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="150" y="296" width="320" height="44" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<ellipse cx="310" cy="340" rx="160" ry="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<ellipse cx="310" cy="296" rx="160" ry="14" fill="none" stroke="#059669" stroke-width="1.5"/>
<text x="310" y="320" text-anchor="middle" class="label" fill="#059669">KV Cache (Populated)</text>
<text x="310" y="336" text-anchor="middle" class="small">Keys and Values for all 5 prompt tokens</text>
<line x1="310" y1="354" x2="310" y2="384" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="250" y="354" width="120" height="36" rx="6" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="310" y="377" text-anchor="middle" class="label" fill="#ffffff">"mat" (token 6)</text>
<rect x="64" y="410" width="492" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
<text x="310" y="430" text-anchor="middle" class="label" fill="#92400e">Key Insight: Prefill is COMPUTE-BOUND</text>
<text x="310" y="446" text-anchor="middle" class="small" fill="#92400e">All prompt tokens are processed together in one forward pass.</text>
<text x="310" y="460" text-anchor="middle" class="small" fill="#92400e">Large matrix multiplications saturate GPU compute units.</text>
<rect x="620" y="70" width="540" height="410" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="890" y="95" text-anchor="middle" class="phase-label" fill="#ea580c">Phase 2: Decode (Autoregressive)</text>
<text x="890" y="112" text-anchor="middle" class="small">One token at a time | Memory-bandwidth-bound</text>
<rect x="830" y="140" width="120" height="36" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
<text x="890" y="163" text-anchor="middle" class="label">"mat" (prev)</text>
<line x1="890" y1="176" x2="890" y2="200" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
<text x="900" y="194" class="annot">single token</text>
<rect x="660" y="200" width="460" height="64" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
<text x="890" y="222" text-anchor="middle" class="label">Transformer Layers (Single-Token Forward)</text>
<text x="890" y="240" text-anchor="middle" class="small">Matrix-Vector multiplication | One token attends to all cached K,V</text>
<text x="890" y="256" text-anchor="middle" class="annot">Low arithmetic intensity | GPU mostly waits on memory</text>
<line x1="890" y1="264" x2="890" y2="296" stroke="#059669" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrow-green-dash)"/>
<text x="900" y="284" class="small" fill="#059669">append K,V</text>
<ellipse cx="890" cy="296" rx="160" ry="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="730" y="296" width="320" height="44" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<ellipse cx="890" cy="340" rx="160" ry="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<ellipse cx="890" cy="296" rx="160" ry="14" fill="none" stroke="#059669" stroke-width="1.5"/>
<text x="890" y="320" text-anchor="middle" class="label" fill="#059669">KV Cache (Growing)</text>
<text x="890" y="336" text-anchor="middle" class="small">Read all previous K,V + append new token</text>
<line x1="890" y1="354" x2="890" y2="384" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
<text x="900" y="374" class="small" fill="#7c3aed">logits</text>
<rect x="770" y="354" width="240" height="36" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="890" y="377" text-anchor="middle" class="label" fill="#7c3aed">Sampling Strategy</text>
<path d="M 770 372 Q 660 372 660 158 Q 660 130 830 158" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
<text x="635" y="195" class="annot" fill="#7c3aed">autoregressive loop</text>
<text x="635" y="208" class="annot" fill="#7c3aed">(repeat until EOS)</text>
<rect x="644" y="410" width="492" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
<text x="890" y="430" text-anchor="middle" class="label" fill="#92400e">Key Insight: Decode is MEMORY-BANDWIDTH-BOUND</text>
<text x="890" y="446" text-anchor="middle" class="small" fill="#92400e">Each step loads the entire KV cache from GPU HBM for just ONE token.</text>
<text x="890" y="460" text-anchor="middle" class="small" fill="#92400e">Memory traffic per token grows linearly with context length.</text>
<rect x="40" y="500" width="1120" height="290" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="600" y="525" text-anchor="middle" class="phase-label" fill="#1e293b">Decode Strategies: Choosing the Next Token</text>
<text x="600" y="542" text-anchor="middle" class="small">The model outputs a probability distribution (logits -> softmax) over the vocabulary for each step</text>
<rect x="60" y="560" width="200" height="130" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<rect x="60" y="560" width="200" height="28" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<rect x="60" y="580" width="200" height="8" fill="#dbeafe"/>
<text x="160" y="579" text-anchor="middle" class="label" fill="#2563eb">Greedy</text>
<text x="160" y="610" text-anchor="middle" class="small">Pick argmax(highest prob)</text>
<rect x="110" y="666" width="100" height="18" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
<text x="160" y="679" text-anchor="middle" class="annot" fill="#2563eb">Deterministic</text>
<rect x="276" y="560" width="200" height="130" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<rect x="276" y="560" width="200" height="28" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<rect x="276" y="580" width="200" height="8" fill="#d1fae5"/>
<text x="376" y="579" text-anchor="middle" class="label" fill="#059669">Temperature</text>
<text x="376" y="610" text-anchor="middle" class="small">Divide logits by T</text>
<text x="376" y="626" text-anchor="middle" class="small">T&gt;1: more random</text>
<text x="376" y="642" text-anchor="middle" class="small">T&lt;1: more focused</text>
<rect x="326" y="666" width="100" height="18" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
<text x="376" y="679" text-anchor="middle" class="annot" fill="#059669">Stochastic</text>
<rect x="492" y="560" width="200" height="130" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<rect x="492" y="560" width="200" height="28" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="492" y="580" width="200" height="8" fill="#ede9fe"/>
<text x="592" y="579" text-anchor="middle" class="label" fill="#7c3aed">Top-k</text>
<text x="592" y="610" text-anchor="middle" class="small">Keep k highest-prob</text>
<text x="592" y="626" text-anchor="middle" class="small">tokens, sample</text>
<text x="592" y="642" text-anchor="middle" class="small">from renormalized</text>
<rect x="542" y="666" width="100" height="18" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<text x="592" y="679" text-anchor="middle" class="annot" fill="#7c3aed">Truncated</text>
<rect x="708" y="560" width="200" height="130" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
<rect x="708" y="560" width="200" height="28" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
<rect x="708" y="580" width="200" height="8" fill="#fed7aa"/>
<text x="808" y="579" text-anchor="middle" class="label" fill="#ea580c">Top-p (Nucleus)</text>
<text x="808" y="610" text-anchor="middle" class="small">Keep smallest set</text>
<text x="808" y="626" text-anchor="middle" class="small">whose cumulative</text>
<text x="808" y="642" text-anchor="middle" class="small">prob >= p</text>
<rect x="758" y="666" width="100" height="18" rx="9" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
<text x="808" y="679" text-anchor="middle" class="annot" fill="#ea580c">Adaptive</text>
<rect x="924" y="560" width="200" height="130" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
<rect x="924" y="560" width="200" height="28" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<rect x="924" y="580" width="200" height="8" fill="#fee2e2"/>
<text x="1024" y="579" text-anchor="middle" class="label" fill="#dc2626">Beam Search</text>
<text x="1024" y="610" text-anchor="middle" class="small">Track B parallel</text>
<text x="1024" y="626" text-anchor="middle" class="small">sequences, keep</text>
<text x="1024" y="642" text-anchor="middle" class="small">top-B at each step</text>
<rect x="974" y="666" width="100" height="18" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<text x="1024" y="679" text-anchor="middle" class="annot" fill="#dc2626">Multi-path</text>
<text x="60" y="710" class="label">Trade-off Summary:</text>
<circle cx="68" cy="730" r="3" fill="#2563eb"/>
<text x="80" y="734" class="small">Greedy = most likely output, but can be repetitive and generic</text>
<circle cx="68" cy="748" r="3" fill="#059669"/>
<text x="80" y="752" class="small">Temperature/Top-k/Top-p = creativity vs coherence trade-off</text>
<circle cx="68" cy="766" r="3" fill="#dc2626"/>
<text x="80" y="770" class="small">Beam Search = best for translation/summarization, slower and memory-heavy</text>
<text x="40" y="805" class="small" font-weight="600">Legend:</text>
<line x1="100" y1="801" x2="120" y2="801" stroke="#2563eb" stroke-width="2"/>
<text x="126" y="805" class="small">Data flow</text>
<line x1="205" y1="801" x2="225" y2="801" stroke="#059669" stroke-width="2"/>
<text x="231" y="805" class="small">Memory read/write</text>
<line x1="366" y1="801" x2="386" y2="801" stroke="#7c3aed" stroke-width="2"/>
<text x="392" y="805" class="small">Transform / loop</text>
<line x1="520" y1="801" x2="540" y2="801" stroke="#ea580c" stroke-width="2"/>
<text x="546" y="805" class="small">Control / single token</text>
</svg>