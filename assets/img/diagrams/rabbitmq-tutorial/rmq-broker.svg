<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="400" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">RabbitMQ Broker: The Core Flow</text>
<rect x="60" y="80" width="130" height="50" rx="8" fill="#1e40af"/>
<text x="125" y="110" text-anchor="middle" class="node-title-w">Producer</text>
<text x="125" y="128" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">publish</text>
<line x1="190" y1="105" x2="250" y2="105" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-accent)"/>
<text x="220" y="97" text-anchor="middle" class="item-sub">msg</text>
<rect x="250" y="80" width="160" height="50" rx="8" fill="#2563eb"/>
<text x="330" y="110" text-anchor="middle" class="node-title-w">Exchange</text>
<text x="330" y="128" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">routes by binding</text>
<line x1="410" y1="90" x2="470" y2="90" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="410" y1="105" x2="470" y2="105" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="410" y1="120" x2="470" y2="120" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="470" y="75" width="150" height="32" rx="8" fill="#1e40af"/>
<text x="545" y="96" text-anchor="middle" class="node-title-w">Queue A</text>
<rect x="470" y="107" width="150" height="32" rx="8" fill="#2563eb"/>
<text x="545" y="128" text-anchor="middle" class="node-title-w">Queue B</text>
<line x1="620" y1="90" x2="680" y2="90" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="620" y1="123" x2="680" y2="123" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="680" y="75" width="150" height="32" rx="8" fill="#16a34a"/>
<text x="755" y="96" text-anchor="middle" class="node-title-w">Consumer A</text>
<rect x="680" y="107" width="150" height="32" rx="8" fill="#16a34a"/>
<text x="755" y="128" text-anchor="middle" class="node-title-w">Consumer B</text>
<rect x="40" y="180" width="820" height="60" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="206" text-anchor="middle" class="band-label">The binding rule</text>
<text x="430" y="232" text-anchor="middle" class="item-sub">exchange.type + routing_key + binding_key -&gt; which queue(s) receive the message</text>
<rect x="40" y="256" width="820" height="100" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="282" text-anchor="middle" class="band-label">Key difference from Kafka</text>
<text x="430" y="308" text-anchor="middle" class="item-sub">Kafka: pull (consumer reads offset from a log). RabbitMQ: push (broker delivers to consumer).</text>
<text x="430" y="326" text-anchor="middle" class="item-sub">RabbitMQ: smart broker, flexible routing. Kafka: dumb broker, smart consumer, replay-able log.</text>
</svg>
