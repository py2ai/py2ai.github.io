<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">Packer Build Pipeline: Immutable Artifacts</text>
<rect x="40" y="80" width="130" height="60" rx="8" fill="#1e40af"/>
<text x="105" y="110" text-anchor="middle" class="node-title-w">Source</text>
<text x="105" y="128" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">base AMI/image</text>
<line x1="170" y1="110" x2="230" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="200" y="102" text-anchor="middle" class="item-sub">launch</text>
<rect x="230" y="80" width="130" height="60" rx="8" fill="#2563eb"/>
<text x="295" y="110" text-anchor="middle" class="node-title-w">Builder</text>
<text x="295" y="128" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">provision</text>
<line x1="360" y1="110" x2="420" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="390" y="102" text-anchor="middle" class="item-sub">customize</text>
<rect x="420" y="80" width="150" height="60" rx="8" fill="#1e40af"/>
<text x="495" y="110" text-anchor="middle" class="node-title-w">Provisioner</text>
<text x="495" y="128" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">install/config</text>
<line x1="570" y1="110" x2="630" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="102" text-anchor="middle" class="item-sub">snapshot</text>
<rect x="630" y="80" width="150" height="60" rx="8" fill="#16a34a"/>
<text x="705" y="110" text-anchor="middle" class="node-title-w">Artifact</text>
<text x="705" y="128" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">AMI / box / image</text>
<rect x="40" y="180" width="820" height="100" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="206" text-anchor="middle" class="band-label">Immutable infrastructure</text>
<text x="430" y="232" text-anchor="middle" class="item-sub">Build a golden image once -&gt; deploy N copies -&gt; never modify running servers.</text>
<text x="430" y="252" text-anchor="middle" class="item-sub">Update = build a new image + redeploy (blue/green), not SSH + patch in place.</text>
<text x="430" y="272" text-anchor="middle" class="item-sub">Same image dev/staging/prod = eliminates drift.</text>
<rect x="40" y="300" width="820" height="90" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="326" text-anchor="middle" class="band-label">Packer vs Docker</text>
<text x="430" y="352" text-anchor="middle" class="item-sub">Docker: app + deps in a container image, shares kernel, runs on a host.</text>
<text x="430" y="372" text-anchor="middle" class="item-sub">Packer: full OS image (AMI, VM), boots independently, includes the kernel.</text>
</svg>
