<rect x="560" y="294" width="260" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="690" y="315" text-anchor="middle" class="item-sub">Puppet shops</text>
<rect x="40" y="334" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="338" width="170" height="32" rx="8" fill="#1e40af"/>
<text x="139" y="359" text-anchor="middle" class="node-title-w">windows-restart</text>
<rect x="240" y="338" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
