<rect x="40" y="290" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="294" width="170" height="32" rx="8" fill="#1e40af"/>
<text x="139" y="315" text-anchor="middle" class="node-title-w">puppet</text>
<rect x="240" y="294" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
