<rect x="40" y="378" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="382" width="170" height="32" rx="8" fill="#1e40af"/>
<text x="139" y="403" text-anchor="middle" class="node-title-w">breakpoint</text>
<rect x="240" y="382" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="395" y="403" text-anchor="middle" class="item">pause for manual debugging</text>
<rect x="560" y="382" width="260" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="690" y="403" text-anchor="middle" class="item-sub">interactive SSH into the build</text>
<rect x="40" y="432" width="780" height="0" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
