<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" font-family="Inter, system-ui, -apple-system, sans-serif">
<style>
  text { fill: #1e293b; }
  .title { font-size:20px; font-weight:700; fill:#1e293b; }
  .section { font-size:15px; font-weight:700; }
  .label { font-size:12px; font-weight:600; fill:#1e293b; }
  .small { font-size:10px; fill:#64748b; }
  .annot { font-size:9px; fill:#94a3b8; }
  .mono { font-size:11px; font-family:JetBrains Mono, Fira Code, monospace; fill:#1e293b; }
</style>
<defs>
  <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
  <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#059669"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/></filter>
</defs>
<rect width="1200" height="1000" fill="#ffffff"/>
<text x="600" y="30" text-anchor="middle" class="title">LLM Training Pipeline: From Random Weights to Helpful Assistant</text>
<text x="600" y="48" text-anchor="middle" class="small">Three stages that transform a next-token predictor into a conversational AI: Pretraining, SFT, and RLHF/DPO</text>

<text x="40" y="80" class="section" fill="#2563eb">Stage 1: Pretraining</text>
<text x="40" y="96" class="small">Learn language, facts, and reasoning from trillions of tokens</text>
<rect x="40" y="106" width="340" height="480" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<rect x="40" y="106" width="340" height="30" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
<rect x="40" y="128" width="340" height="8" fill="#dbeafe"/>
<text x="210" y="126" text-anchor="middle" class="label" fill="#2563eb">Next-Token Prediction</text>
<text x="56" y="148" class="label" fill="#1e293b">Training Data:</text>
<text x="56" y="162" class="small">Trillions of tokens from:</text>
<text x="64" y="178" class="annot">Web pages (Common Crawl)</text>
<text x="64" y="192" class="annot">Books (Books3, Gutenberg)</text>
<text x="64" y="206" class="annot">Code (GitHub, Stack Overflow)</text>
<text x="64" y="220" class="annot">Wikipedia, scientific papers</text>
<text x="64" y="234" class="annot">News, forums, social media</text>
<line x1="56" y1="252" x2="364" y2="252" stroke="#cbd5e1" stroke-width="1"/>
<text x="56" y="264" class="label" fill="#1e293b">Objective:</text>
<text x="56" y="280" class="mono">L = -sum log P(token_i | tokens_0..i-1)</text>
<text x="56" y="294" class="annot">Cross-entropy loss on next token</text>
<text x="56" y="308" class="annot">The model learns to predict the next token</text>
<line x1="56" y1="318" x2="364" y2="318" stroke="#cbd5e1" stroke-width="1"/>
<text x="56" y="330" class="label" fill="#1e293b">Training Details:</text>
<text x="64" y="346" class="annot" font-weight="600">Tokens processed:</text>
<text x="180" y="346" class="annot">~15 trillion (Llama-3)</text>
<text x="64" y="360" class="annot" font-weight="600">GPU hours:</text>
<text x="180" y="360" class="annot">~6,000 H100-days (7B)</text>
<text x="64" y="374" class="annot" font-weight="600">Learning rate:</text>
<text x="180" y="374" class="annot">~3e-4 (with warmup)</text>
<text x="64" y="388" class="annot" font-weight="600">Batch size:</text>
<text x="180" y="388" class="annot">~4M tokens</text>
<text x="64" y="402" class="annot" font-weight="600">Context length:</text>
<text x="180" y="402" class="annot">4K-8K tokens</text>
<text x="64" y="416" class="annot" font-weight="600">Optimizer:</text>
<text x="180" y="416" class="annot">AdamW</text>
<text x="64" y="430" class="annot" font-weight="600">Precision:</text>
<text x="180" y="430" class="annot">BF16 mixed</text>
<line x1="56" y1="446" x2="364" y2="446" stroke="#cbd5e1" stroke-width="1"/>
<text x="56" y="458" class="label" fill="#2563eb">Output: Base Model</text>
<text x="56" y="472" class="small">Can predict text but cannot follow</text>
<text x="56" y="484" class="small">instructions or hold conversations</text>
<text x="56" y="498" class="annot">Example: Llama-3-8B-Base</text>

<text x="420" y="80" class="section" fill="#059669">Stage 2: Supervised Fine-Tuning (SFT)</text>
<text x="420" y="96" class="small">Teach the model to follow instructions and hold conversations</text>
<rect x="420" y="106" width="340" height="480" rx="10" fill="#f8fafc" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<rect x="420" y="106" width="340" height="30" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
<rect x="420" y="128" width="340" height="8" fill="#d1fae5"/>
<text x="590" y="126" text-anchor="middle" class="label" fill="#059669">Instruction-Response Learning</text>
<text x="436" y="148" class="label" fill="#1e293b">Training Data:</text>
<text x="436" y="162" class="small">High-quality instruction pairs:</text>
<rect x="436" y="172" width="312" height="80" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
<text x="444" y="186" class="annot" font-weight="600" fill="#059669">Human:</text>
<text x="444" y="200" class="small">Explain what a database index is</text>
<text x="444" y="216" class="annot" font-weight="600" fill="#7c3aed">Assistant:</text>
<text x="444" y="230" class="small">A database index is a data structure</text>
<text x="444" y="242" class="small">that improves query speed by...</text>
<text x="436" y="266" class="annot">Sources: human-written, synthetic,</text>
<text x="436" y="278" class="annot">distilled from larger models</text>
<line x1="436" y1="290" x2="764" y2="290" stroke="#cbd5e1" stroke-width="1"/>
<text x="436" y="304" class="label" fill="#1e293b">Objective:</text>
<text x="436" y="320" class="mono">L = -sum log P(response | prompt)</text>
<text x="436" y="334" class="annot">Same cross-entropy loss, but only on</text>
<text x="436" y="348" class="annot">response tokens (prompt is masked)</text>
<line x1="436" y1="360" x2="764" y2="360" stroke="#cbd5e1" stroke-width="1"/>
<text x="436" y="372" class="label" fill="#1e293b">Training Details:</text>
<text x="444" y="388" class="annot" font-weight="600">Examples:</text>
<text x="560" y="388" class="annot">~100K-10M pairs</text>
<text x="444" y="402" class="annot" font-weight="600">GPU hours:</text>
<text x="560" y="402" class="annot">~100-500 H100-hours</text>
<text x="444" y="416" class="annot" font-weight="600">Learning rate:</text>
<text x="560" y="416" class="annot">~2e-5 (10x lower)</text>
<text x="444" y="430" class="annot" font-weight="600">Batch size:</text>
<text x="560" y="430" class="annot">~64-256 sequences</text>
<text x="444" y="444" class="annot" font-weight="600">Epochs:</text>
<text x="560" y="444" class="annot">1-3 (avoid overfitting)</text>
<text x="444" y="458" class="annot" font-weight="600">Context length:</text>
<text x="560" y="458" class="annot">4K-8K tokens</text>
<text x="444" y="472" class="annot" font-weight="600">Format:</text>
<text x="560" y="472" class="annot">ChatML / [INST] template</text>
<line x1="436" y1="486" x2="764" y2="486" stroke="#cbd5e1" stroke-width="1"/>
<text x="436" y="498" class="label" fill="#059669">Output: SFT Model (Instruct)</text>
<text x="436" y="512" class="small">Follows instructions and generates</text>
<text x="436" y="524" class="small">helpful responses, but may be unsafe</text>
<text x="436" y="538" class="annot">Example: Llama-3-8B-Instruct</text>

<text x="800" y="80" class="section" fill="#7c3aed">Stage 3: RLHF / DPO (Alignment)</text>
<text x="800" y="96" class="small">Align with human preferences: helpful, harmless, honest</text>
<rect x="800" y="106" width="340" height="480" rx="10" fill="#f8fafc" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<rect x="800" y="106" width="340" height="30" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<rect x="800" y="128" width="340" height="8" fill="#ede9fe"/>
<text x="970" y="126" text-anchor="middle" class="label" fill="#7c3aed">Preference Optimization</text>
<text x="816" y="148" class="label" fill="#1e293b">Two Approaches:</text>
<rect x="812" y="158" width="152" height="200" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="888" y="174" text-anchor="middle" class="label" fill="#7c3aed">RLHF</text>
<text x="888" y="188" text-anchor="middle" class="annot">Reinforcement Learning</text>
<text x="888" y="200" text-anchor="middle" class="annot">from Human Feedback</text>
<text x="820" y="218" class="annot" font-weight="600">1. Train Reward Model</text>
<text x="820" y="230" class="annot">Raters compare pairs,</text>
<text x="820" y="242" class="annot">choose the better one.</text>
<text x="820" y="254" class="annot">Train RM to score them.</text>
<text x="820" y="274" class="annot" font-weight="600">2. PPO Optimization</text>
<text x="820" y="286" class="annot">Maximize reward while</text>
<text x="820" y="298" class="annot">staying close to SFT</text>
<text x="820" y="310" class="annot">model (KL penalty).</text>
<text x="820" y="330" class="annot" font-weight="600">Used by:</text>
<text x="820" y="342" class="annot">GPT-4, Claude 2</text>
<rect x="972" y="158" width="152" height="200" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="1048" y="174" text-anchor="middle" class="label" fill="#92400e">DPO</text>
<text x="1048" y="188" text-anchor="middle" class="annot">Direct Preference</text>
<text x="1048" y="200" text-anchor="middle" class="annot">Optimization</text>
<text x="980" y="218" class="annot" font-weight="600">No Reward Model Needed</text>
<text x="980" y="230" class="annot">Skips RM training.</text>
<text x="980" y="242" class="annot">Directly optimize policy</text>
<text x="980" y="254" class="annot">using preference pairs.</text>
<text x="980" y="274" class="annot" font-weight="600">Simpler Loss Function</text>
<text x="980" y="286" class="annot">Binary classification:</text>
<text x="980" y="298" class="annot">increase log-prob of</text>
<text x="980" y="310" class="annot">decrease rejected.</text>
<text x="980" y="330" class="annot" font-weight="600">Used by:</text>
<text x="980" y="342" class="annot">Llama-3, Mistral</text>
<line x1="816" y1="372" x2="1124" y2="372" stroke="#cbd5e1" stroke-width="1"/>
<text x="816" y="384" class="label" fill="#1e293b">Training Data:</text>
<text x="816" y="398" class="small">Preference pairs: (prompt, chosen, rejected)</text>
<text x="816" y="412" class="annot">~100K-1M comparisons from human raters</text>
<text x="816" y="426" class="annot">or AI feedback (Constitutional AI)</text>
<line x1="816" y1="436" x2="1124" y2="436" stroke="#cbd5e1" stroke-width="1"/>
<text x="816" y="448" class="label" fill="#1e293b">Objective (DPO):</text>
<text x="816" y="464" class="mono">L = -log sigmoid(beta * (</text>
<text x="816" y="478" class="mono">  log_pi(chosen) - log_pi_ref(chosen)</text>
<text x="816" y="492" class="mono">  - log_pi(rejected) + log_pi_ref(rejected)</text>
<text x="816" y="506" class="mono">))</text>
<line x1="816" y1="516" x2="1124" y2="516" stroke="#cbd5e1" stroke-width="1"/>
<text x="816" y="528" class="label" fill="#7c3aed">Output: Aligned Model (Chat)</text>
<text x="816" y="542" class="small">Helpful, harmless, honest assistant</text>
<text x="816" y="554" class="small">Ready for production deployment</text>
<text x="816" y="568" class="annot">Example: Llama-3-8B-Instruct (final)</text>

<line x1="382" y1="346" x2="416" y2="346" stroke="#2563eb" stroke-width="3" marker-end="url(#arr-blue)"/>
<line x1="762" y1="346" x2="796" y2="346" stroke="#059669" stroke-width="3" marker-end="url(#arr-green)"/>
<text x="400" y="336" text-anchor="middle" class="annot" fill="#2563eb">base</text>
<text x="400" y="358" text-anchor="middle" class="annot" fill="#2563eb">model</text>
<text x="780" y="336" text-anchor="middle" class="annot" fill="#059669">SFT</text>
<text x="780" y="358" text-anchor="middle" class="annot" fill="#059669">model</text>

<text x="40" y="620" class="section" fill="#dc2626">Comparison: What Each Stage Adds</text>
<rect x="40" y="636" width="1080" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<text x="130" y="655" text-anchor="middle" class="label" fill="#dc2626">Aspect</text>
<text x="370" y="655" text-anchor="middle" class="label" fill="#dc2626">Pretraining</text>
<text x="670" y="655" text-anchor="middle" class="label" fill="#dc2626">SFT</text>
<text x="970" y="655" text-anchor="middle" class="label" fill="#dc2626">RLHF / DPO</text>
<rect x="40" y="664" width="1080" height="28" fill="#f8fafc" opacity="0.5"/>
<text x="50" y="683" class="small" font-weight="600">Goal</text>
<text x="230" y="683" class="small">Learn language &amp; knowledge</text>
<text x="530" y="683" class="small">Follow instructions</text>
<text x="830" y="683" class="small">Align with preferences</text>
<line x1="40" y1="692" x2="1120" y2="692" stroke="#e2e8f0" stroke-width="0.5"/>
<text x="50" y="711" class="small" font-weight="600">Data volume</text>
<text x="230" y="711" class="small">~15 trillion tokens</text>
<text x="530" y="711" class="small">~100K-10M examples</text>
<text x="830" y="711" class="small">~100K-1M preferences</text>
<line x1="40" y1="720" x2="1120" y2="720" stroke="#e2e8f0" stroke-width="0.5"/>
<rect x="40" y="720" width="1080" height="28" fill="#f8fafc" opacity="0.5"/>
<text x="50" y="739" class="small" font-weight="600">Compute</text>
<text x="230" y="739" class="small">~90% of total</text>
<text x="530" y="739" class="small">~5% of total</text>
<text x="830" y="739" class="small">~5% of total</text>
<line x1="40" y1="748" x2="1120" y2="748" stroke="#e2e8f0" stroke-width="0.5"/>
<text x="50" y="767" class="small" font-weight="600">Learning rate</text>
<text x="230" y="767" class="small">~3e-4</text>
<text x="530" y="767" class="small">~2e-5</text>
<text x="830" y="767" class="small">~5e-7</text>
<line x1="40" y1="776" x2="1120" y2="776" stroke="#e2e8f0" stroke-width="0.5"/>
<rect x="40" y="776" width="1080" height="28" fill="#f8fafc" opacity="0.5"/>
<text x="50" y="795" class="small" font-weight="600">Loss function</text>
<text x="230" y="795" class="small">Cross-entropy</text>
<text x="530" y="795" class="small">Cross-entropy (masked)</text>
<text x="830" y="795" class="small">PPO / DPO loss</text>
<line x1="40" y1="804" x2="1120" y2="804" stroke="#e2e8f0" stroke-width="0.5"/>
<text x="50" y="823" class="small" font-weight="600">Can chat?</text>
<text x="230" y="823" class="small">No (completes text)</text>
<text x="530" y="823" class="small">Yes (basic)</text>
<text x="830" y="823" class="small">Yes (aligned)</text>
<line x1="40" y1="832" x2="1120" y2="832" stroke="#e2e8f0" stroke-width="0.5"/>
<rect x="40" y="832" width="1080" height="28" fill="#f8fafc" opacity="0.5"/>
<text x="50" y="851" class="small" font-weight="600">Safety?</text>
<text x="230" y="851" class="small">No</text>
<text x="530" y="851" class="small">Minimal</text>
<text x="830" y="851" class="small">Yes (harmless)</text>
<line x1="40" y1="860" x2="1120" y2="860" stroke="#e2e8f0" stroke-width="0.5"/>
<text x="50" y="879" class="small" font-weight="600">Example model</text>
<text x="230" y="879" class="small">Llama-3-8B-Base</text>
<text x="530" y="879" class="small">Llama-3-8B-Instruct</text>
<text x="830" y="879" class="small">Llama-3-8B-Instruct (final)</text>

<text x="40" y="908" class="section" fill="#059669">Training Loss Over Time (Conceptual)</text>
<line x1="80" y1="924" x2="80" y2="964" stroke="#64748b" stroke-width="1"/>
<line x1="80" y1="964" x2="1120" y2="964" stroke="#64748b" stroke-width="1"/>
<path d="M 80 926 L 118 935 L 156 938 L 194 941 L 233 943 L 271 945 L 309 947 L 348 948 L 386 950 L 424 951 L 463 953 L 501 954 L 539 955 L 578 956 L 616 957 L 654 958 L 693 960 L 731 961 L 769 962 L 808 962" fill="none" stroke="#2563eb" stroke-width="2"/>
<text x="444" y="922" class="annot" fill="#2563eb" font-weight="600">Pretraining (90% compute)</text>
<path d="M 828 960 Q 880 952 932 954" fill="none" stroke="#059669" stroke-width="2"/>
<text x="838" y="938" class="annot" fill="#059669" font-weight="600">SFT</text>
<path d="M 953 954 Q 1026 950 1099 952" fill="none" stroke="#7c3aed" stroke-width="2"/>
<text x="963" y="938" class="annot" fill="#7c3aed" font-weight="600">RLHF/DPO</text>
<text x="72" y="944" text-anchor="end" class="annot" transform="rotate(-90 72 944)">Loss</text>
<rect x="40" y="972" width="1120" height="20" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
<text x="600" y="986" text-anchor="middle" class="small" font-weight="600" fill="#92400e">Key insight: Pretraining dominates compute (90%) and loss reduction. SFT and RLHF fine-tune behavior with minimal additional compute.</text>
</svg>
