<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2566eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="280" y="38" text-anchor="middle" class="title">Roles: Structure, Galaxy, Collections</text>
<rect x="40" y="70" width="380" height="250" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="230" y="96" text-anchor="middle" class="band-label">Role directory structure</text>
<text x="80" y="118" text-anchor="start" class="item">roles/</text>
<text x="95" y="140" text-anchor="start" class="item">nginx/</text>
<text x="110" y="162" text-anchor="start" class="item">tasks/main.yml</text>
<text x="110" y="184" text-anchor="start" class="item">handlers/main.yml</text>
<text x="110" y="206" text-anchor="start" class="item">templates/</text>
<text x="110" y="228" text-anchor="start" class="item">vars/main.yml</text>
<text x="110" y="250" text-anchor="start" class="item">defaults/main.yml</text>
<text x="110" y="272" text-anchor="start" class="item">meta/main.yml</text>
<text x="110" y="294" text-anchor="start" class="item">files/</text>
<rect x="460" y="70" width="400" height="250" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="660" y="96" text-anchor="middle" class="band-label">Reuse + distribution</text>
<rect x="480" y="116" width="360" height="40" rx="8" fill="#2566eb"/>
<text x="660" y="136" text-anchor="middle" class="node-title-w">ansible-galaxy</text>
<text x="660" y="154" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">community role hub</text>
<rect x="480" y="164" width="360" height="40" rx="8" fill="#1e40af"/>
<text x="660" y="184" text-anchor="middle" class="node-title-w">collections</text>
<text x="660" y="202" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">bundled roles+plugins</text>
<rect x="480" y="212" width="360" height="40" rx="8" fill="#2566eb"/>
<text x="660" y="232" text-anchor="middle" class="node-title-w">requirements.yml</text>
<text x="660" y="250" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">pin role versions</text>
<rect x="480" y="260" width="360" height="40" rx="8" fill="#1e40af"/>
<text x="660" y="280" text-anchor="middle" class="node-title-w">ansible-galaxy install</text>
<text x="660" y="298" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">download deps</text>
<rect x="40" y="340" width="820" height="40" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="430" y="362" text-anchor="middle" class="note">defaults &lt; inventory_vars &lt; group_vars &lt; host_vars &lt; play vars &lt; extra vars (precedence order)</text>
</svg>
