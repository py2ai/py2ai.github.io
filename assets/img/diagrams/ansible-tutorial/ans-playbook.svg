<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2566eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="280" y="38" text-anchor="middle" class="title">Playbook: Plays -&gt; Tasks -&gt; Modules</text>
<rect x="330" y="70" width="200" height="40" rx="8" fill="#1e40af"/>
<text x="430" y="96" text-anchor="middle" class="node-title-w">playbook.yml</text>
<line x1="430" y1="110" x2="250" y2="140" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="430" y1="110" x2="610" y2="140" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="200" y="142" width="200" height="40" rx="8" fill="#2566eb"/>
<text x="300" y="168" text-anchor="middle" class="node-title-w">play: webservers</text>
<rect x="560" y="142" width="200" height="40" rx="8" fill="#2566eb"/>
<text x="660" y="168" text-anchor="middle" class="node-title-w">play: databases</text>
<line x1="300" y1="182" x2="300" y2="210" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="660" y1="182" x2="660" y2="210" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="140" y="212" width="320" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="300" y="238" text-anchor="middle" class="item">task: install nginx (apt module)</text>
<rect x="500" y="212" width="320" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="660" y="238" text-anchor="middle" class="item">task: install postgres (apt module)</text>
<rect x="140" y="260" width="320" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="300" y="286" text-anchor="middle" class="item">task: copy config (template module)</text>
<rect x="500" y="260" width="320" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="660" y="286" text-anchor="middle" class="item">task: start service (service module)</text>
<rect x="140" y="308" width="320" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="300" y="334" text-anchor="middle" class="item">handler: restart nginx (notify)</text>
<rect x="500" y="308" width="320" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="660" y="334" text-anchor="middle" class="item">handler: restart postgres</text>
<rect x="40" y="372" width="820" height="30" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="430" y="392" text-anchor="middle" class="note">Handlers run only if notified by a task that changed something. Idempotent.</text>
</svg>
