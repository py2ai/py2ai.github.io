<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2566eb"/>
  </marker>
</defs>
<rect width="860" height="400" fill="#ffffff"/>
<text x="280" y="38" text-anchor="middle" class="title">Ansible Flow: Control Node -&gt; SSH -&gt; Hosts</text>
<rect x="80" y="80" width="160" height="60" rx="8" fill="#1e40af"/>
<text x="160" y="110" text-anchor="middle" class="node-title-w">Control Node</text>
<text x="160" y="128" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">runs ansible</text>
<line x1="240" y1="110" x2="300" y2="110" stroke="#2566eb" stroke-width="2" marker-end="url(#arrow-accent)"/>
<text x="270" y="102" text-anchor="middle" class="item-sub">SSH</text>
<rect x="300" y="70" width="140" height="50" rx="8" fill="#2566eb"/>
<text x="370" y="96" text-anchor="middle" class="node-title-w">web1</text>
<text x="370" y="114" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">managed host</text>
<rect x="300" y="130" width="140" height="50" rx="8" fill="#2566eb"/>
<text x="370" y="156" text-anchor="middle" class="node-title-w">web2</text>
<text x="370" y="174" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">managed host</text>
<rect x="300" y="190" width="140" height="50" rx="8" fill="#2566eb"/>
<text x="370" y="216" text-anchor="middle" class="node-title-w">db1</text>
<text x="370" y="234" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">managed host</text>
<line x1="240" y1="130" x2="300" y2="145" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="240" y1="150" x2="300" y2="205" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="270" width="820" height="80" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="296" text-anchor="middle" class="band-label">Agentless + idempotent</text>
<text x="430" y="322" text-anchor="middle" class="item-sub">No agent installed on managed hosts; Ansible uses SSH (or WinRM).</text>
<text x="430" y="340" text-anchor="middle" class="item-sub">Idempotent: running the same playbook twice produces the same result; only changes if needed.</text>
</svg>
