<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">WebSocket Frames: Opcodes, Ping/Pong, Close</text>
<rect x="40" y="70" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="74" width="150" height="32" rx="8" fill="#1e40af"/>
<text x="129" y="95" text-anchor="middle" class="node-title-w">Text frame</text>
<rect x="220" y="74" width="300" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="370" y="95" text-anchor="middle" class="item">opcode 0x1, UTF-8 payload</text>
<rect x="530" y="74" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="675" y="95" text-anchor="middle" class="item-sub">chat messages, JSON</text>
<rect x="40" y="114" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="118" width="150" height="32" rx="8" fill="#1e40af"/>
<text x="129" y="139" text-anchor="middle" class="node-title-w">Binary frame</text>
<rect x="220" y="118" width="300" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="370" y="139" text-anchor="middle" class="item">opcode 0x2, raw bytes</text>
<rect x="530" y="118" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="675" y="139" text-anchor="middle" class="item-sub">images, files, protobuf</text>
<rect x="40" y="158" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="162" width="150" height="32" rx="8" fill="#1e40af"/>
<text x="129" y="183" text-anchor="middle" class="node-title-w">Ping</text>
<rect x="220" y="162" width="300" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="370" y="183" text-anchor="middle" class="item">opcode 0x9, keep-alive</text>
<rect x="530" y="162" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="675" y="183" text-anchor="middle" class="item-sub">detect dead connections</text>
<rect x="40" y="202" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="206" width="150" height="32" rx="8" fill="#1e40af"/>
<text x="129" y="227" text-anchor="middle" class="node-title-w">Pong</text>
<rect x="220" y="206" width="300" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="370" y="227" text-anchor="middle" class="item">opcode 0xA, reply to ping</text>
<rect x="530" y="206" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="675" y="227" text-anchor="middle" class="item-sub">confirm liveness</text>
<rect x="40" y="246" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="250" width="150" height="32" rx="8" fill="#1e40af"/>
<text x="129" y="271" text-anchor="middle" class="node-title-w">Close</text>
<rect x="220" y="250" width="300" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="370" y="271" text-anchor="middle" class="item">opcode 0x8, optional code+reason</text>
<rect x="530" y="250" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="675" y="271" text-anchor="middle" class="item-sub">1000 normal, 1011 server error</text>
<rect x="40" y="290" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="294" width="150" height="32" rx="8" fill="#1e40af"/>
<text x="129" y="315" text-anchor="middle" class="node-title-w">Continuation</text>
<rect x="220" y="294" width="300" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="370" y="315" text-anchor="middle" class="item">opcode 0x0, fragmented message</text>
<rect x="530" y="294" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="675" y="315" text-anchor="middle" class="item-sub">split a large frame</text>
<rect x="40" y="334" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="338" width="150" height="32" rx="8" fill="#1e40af"/>
<text x="129" y="359" text-anchor="middle" class="node-title-w">Masking</text>
<rect x="220" y="338" width="300" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="370" y="359" text-anchor="middle" class="item">client frames masked (XOR key)</text>
<rect x="530" y="338" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="675" y="359" text-anchor="middle" class="item-sub">browser security</text>
<rect x="40" y="378" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="382" width="150" height="32" rx="8" fill="#1e40af"/>
<text x="129" y="403" text-anchor="middle" class="node-title-w">Fragmentation</text>
<rect x="220" y="382" width="300" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="370" y="403" text-anchor="middle" class="item">split big messages across frames</text>
<rect x="530" y="382" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="675" y="403" text-anchor="middle" class="item-sub">stream large payloads</text>
<rect x="40" y="432" width="780" height="0" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
</svg>
