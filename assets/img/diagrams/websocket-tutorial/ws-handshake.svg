<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">The Handshake: HTTP Upgrade -&gt; WebSocket</text>
<rect x="40" y="70" width="820" height="100" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="96" text-anchor="middle" class="band-label">Client request (HTTP, with upgrade headers)</text>
<rect x="60" y="110" width="760" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="440" y="134" text-anchor="start" class="item">GET /ws HTTP/1.1 | Upgrade: websocket | Connection: Upgrade |</text>
<text x="440" y="152" text-anchor="start" class="item">Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ== | Sec-WebSocket-Version: 13</text>
<line x1="430" y1="170" x2="430" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="200" width="820" height="100" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="226" text-anchor="middle" class="band-label">Server response: 101 Switching Protocols</text>
<rect x="60" y="240" width="760" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="440" y="264" text-anchor="start" class="item">HTTP/1.1 101 Switching Protocols | Upgrade: websocket | Connection: Upgrade</text>
<text x="440" y="282" text-anchor="start" class="item">Sec-WebSocket-Accept: s3pPLMBiTxaQ9kYGzzhZRbK+xOo= (hash of key + GUID)</text>
<rect x="40" y="316" width="820" height="60" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="430" y="342" text-anchor="middle" class="band-label">After 101, the TCP connection is a WebSocket</text>
<text x="430" y="364" text-anchor="middle" class="item-sub">Server must echo Sec-WebSocket-Accept = base64(SHA1(key + magic GUID))</text>
</svg>
