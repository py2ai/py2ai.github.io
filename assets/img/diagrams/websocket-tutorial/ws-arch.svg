<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">Server Architecture: Rooms, Broadcast, Scaling</text>
<rect x="60" y="80" width="130" height="50" rx="8" fill="#1e40af"/>
<text x="125" y="110" text-anchor="middle" class="node-title-w">Client A</text>
<text x="125" y="128" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">room: chat</text>
<rect x="60" y="150" width="130" height="50" rx="8" fill="#1e40af"/>
<text x="125" y="180" text-anchor="middle" class="node-title-w">Client B</text>
<text x="125" y="198" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">room: chat</text>
<line x1="190" y1="105" x2="250" y2="110" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="190" y1="175" x2="250" y2="160" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="250" y="90" width="160" height="90" rx="8" fill="#2563eb"/>
<text x="330" y="120" text-anchor="middle" class="node-title-w">Load balancer</text>
<text x="330" y="140" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">sticky session</text>
<text x="330" y="158" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">(IP hash / cookie)</text>
<line x1="410" y1="120" x2="470" y2="110" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="410" y1="135" x2="470" y2="160" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="470" y="90" width="140" height="40" rx="8" fill="#1e40af"/>
<text x="540" y="114" text-anchor="middle" class="node-title-w">WS Server 1</text>
<rect x="470" y="150" width="140" height="40" rx="8" fill="#1e40af"/>
<text x="540" y="174" text-anchor="middle" class="node-title-w">WS Server 2</text>
<line x1="540" y1="130" x2="540" y2="150" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="610" y1="110" x2="670" y2="110" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="610" y1="170" x2="670" y2="170" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="670" y="90" width="150" height="90" rx="8" fill="#2563eb"/>
<text x="745" y="120" text-anchor="middle" class="node-title-w">Redis pub/sub</text>
<text x="745" y="140" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">cross-server</text>
<text x="745" y="158" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">broadcast</text>
<rect x="40" y="210" width="820" height="140" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="236" text-anchor="middle" class="band-label">The cross-server problem</text>
<text x="430" y="262" text-anchor="middle" class="item">Client A on WS Server 1 sends a message. Client B is on WS Server 2.</text>
<text x="430" y="282" text-anchor="middle" class="item-sub">Server 1 can't deliver to B directly. Solution: publish to Redis; Server 2 subscribes; delivers to B.</text>
<text x="430" y="302" text-anchor="middle" class="item-sub">Sticky sessions keep a client on one server; Redis shares state across the cluster.</text>
<rect x="40" y="370" width="820" height="30" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="430" y="390" text-anchor="middle" class="note">Backpressure: slow client -&gt; buffer fills -&gt; close or drop. Don't let one slow client block the server.</text>
</svg>
