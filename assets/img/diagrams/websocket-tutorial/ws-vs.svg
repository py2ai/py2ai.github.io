<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">WebSocket vs SSE vs Long-Polling vs HTTP/2 Streams</text>
<rect x="40" y="70" width="780" height="56" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="78" width="170" height="40" rx="8" fill="#1e40af"/>
<text x="139" y="103" text-anchor="middle" class="node-title-w">WebSocket</text>
<rect x="240" y="78" width="300" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="390" y="103" text-anchor="middle" class="item">full-duplex, binary, persistent</text>
<rect x="550" y="78" width="270" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="685" y="103" text-anchor="middle" class="item-sub">chat, games, real-time</text>
<rect x="40" y="134" width="780" height="56" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="142" width="170" height="40" rx="8" fill="#2563eb"/>
<text x="139" y="167" text-anchor="middle" class="node-title-w">SSE</text>
<rect x="240" y="142" width="300" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="390" y="167" text-anchor="middle" class="item">server-&gt;client only, text, auto-reconnect</text>
<rect x="550" y="142" width="270" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="685" y="167" text-anchor="middle" class="item-sub">notifications, live feed</text>
<rect x="40" y="198" width="780" height="56" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="206" width="170" height="40" rx="8" fill="#1e40af"/>
<text x="139" y="231" text-anchor="middle" class="node-title-w">Long-polling</text>
<rect x="240" y="206" width="300" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="390" y="231" text-anchor="middle" class="item">client polls, server holds until data</text>
<rect x="550" y="206" width="270" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="685" y="231" text-anchor="middle" class="item-sub">legacy fallback, compat</text>
<rect x="40" y="262" width="780" height="56" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="270" width="170" height="40" rx="8" fill="#2563eb"/>
<text x="139" y="295" text-anchor="middle" class="node-title-w">HTTP/2 streams</text>
<rect x="240" y="270" width="300" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="390" y="295" text-anchor="middle" class="item">multiplexed, request streaming</text>
<rect x="550" y="270" width="270" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="685" y="295" text-anchor="middle" class="item-sub">progressive JSON, server push</text>
<rect x="40" y="330" width="820" height="80" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="356" text-anchor="middle" class="band-label">Rule of thumb</text>
<text x="430" y="382" text-anchor="middle" class="item">Need server-&gt;client push only? Use SSE (simpler, auto-reconnect, HTTP).</text>
<text x="430" y="402" text-anchor="middle" class="item-sub">Need full-duplex (client also sends)? Use WebSocket. Polling is last resort.</text>
</svg>
