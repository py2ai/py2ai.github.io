<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">Metric Types: Counter, Gauge, Histogram, Summary</text>
<rect x="40" y="70" width="780" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="76" width="150" height="34" rx="8" fill="#1e40af"/>
<text x="129" y="98" text-anchor="middle" class="node-title-w">Counter</text>
<rect x="220" y="76" width="310" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="375" y="98" text-anchor="middle" class="item">monotonic increasing (resets on restart)</text>
<rect x="540" y="76" width="280" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="680" y="98" text-anchor="middle" class="item-sub">requests_total, errors_total</text>
<rect x="40" y="124" width="780" height="46" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="130" width="150" height="34" rx="8" fill="#1e40af"/>
<text x="129" y="152" text-anchor="middle" class="node-title-w">Gauge</text>
<rect x="220" y="130" width="310" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="375" y="152" text-anchor="middle" class="item">arbitrary value, goes up and down</text>
<rect x="540" y="130" width="280" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="680" y="152" text-anchor="middle" class="item-sub">cpu_usage, queue_depth, temperature</text>
<rect x="40" y="178" width="780" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="184" width="150" height="34" rx="8" fill="#1e40af"/>
<text x="129" y="206" text-anchor="middle" class="node-title-w">Histogram</text>
<rect x="220" y="184" width="310" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="375" y="206" text-anchor="middle" class="item">bucketed observations + sum + count</text>
<rect x="540" y="184" width="280" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="680" y="206" text-anchor="middle" class="item-sub">request duration, response size</text>
<rect x="40" y="232" width="780" height="46" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="238" width="150" height="34" rx="8" fill="#1e40af"/>
<text x="129" y="260" text-anchor="middle" class="node-title-w">Summary</text>
<rect x="220" y="238" width="310" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="375" y="260" text-anchor="middle" class="item">quantiles client-side (no aggregation)</text>
<rect x="540" y="238" width="280" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="680" y="260" text-anchor="middle" class="item-sub">precomputed 0.5/0.9/0.99 quantiles</text>
<rect x="40" y="286" width="780" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="292" width="150" height="34" rx="8" fill="#1e40af"/>
<text x="129" y="314" text-anchor="middle" class="node-title-w">Labels</text>
<rect x="220" y="292" width="310" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="375" y="314" text-anchor="middle" class="item">key=value dimensions on a metric</text>
<rect x="540" y="292" width="280" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="680" y="314" text-anchor="middle" class="item-sub">method=GET, status=200, route=/api</text>
<rect x="40" y="340" width="780" height="46" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="346" width="150" height="34" rx="8" fill="#1e40af"/>
<text x="129" y="368" text-anchor="middle" class="node-title-w">Cardinality</text>
<rect x="220" y="346" width="310" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="375" y="368" text-anchor="middle" class="item">unique label-value combinations</text>
<rect x="540" y="346" width="280" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="680" y="368" text-anchor="middle" class="item-sub">HIGH cardinality = explosion -&gt; DON'T</text>
<rect x="40" y="400" width="780" height="26" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="430" y="418" text-anchor="middle" class="note">NEVER put user_id/request_id as a label -&gt; cardinality explosion kills Prometheus.</text>
</svg>
