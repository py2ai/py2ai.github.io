<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">PromQL: Selectors, Rate, Aggregation, Quantile</text>
<rect x="40" y="70" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="74" width="190" height="32" rx="8" fill="#1e40af"/>
<text x="149" y="95" text-anchor="middle" class="node-title-w">Instant vector</text>
<rect x="260" y="74" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="405" y="95" text-anchor="middle" class="item">http_requests_total at this instant</text>
<rect x="560" y="74" width="260" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="690" y="95" text-anchor="middle" class="item-sub">one value per series</text>
<rect x="40" y="114" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="118" width="190" height="32" rx="8" fill="#1e40af"/>
<text x="149" y="139" text-anchor="middle" class="node-title-w">Range vector</text>
<rect x="260" y="118" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="405" y="139" text-anchor="middle" class="item">http_requests_total[5m] over a window</text>
<rect x="560" y="118" width="260" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="690" y="139" text-anchor="middle" class="item-sub">used by rate()</text>
<rect x="40" y="158" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="162" width="190" height="32" rx="8" fill="#1e40af"/>
<text x="149" y="183" text-anchor="middle" class="node-title-w">rate()</text>
<rect x="260" y="162" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="405" y="183" text-anchor="middle" class="item">per-second increase over a window</text>
<rect x="560" y="162" width="260" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="690" y="183" text-anchor="middle" class="item-sub">rate(http_requests_total[5m])</text>
<rect x="40" y="202" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="206" width="190" height="32" rx="8" fill="#1e40af"/>
<text x="149" y="227" text-anchor="middle" class="node-title-w">increase()</text>
<rect x="260" y="206" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="405" y="227" text-anchor="middle" class="item">total increase over a window</text>
<rect x="560" y="206" width="260" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="690" y="227" text-anchor="middle" class="item-sub">increase(...[1h])</text>
<rect x="40" y="246" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="250" width="190" height="32" rx="8" fill="#1e40af"/>
<text x="149" y="271" text-anchor="middle" class="node-title-w">by() / without()</text>
<rect x="260" y="250" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="405" y="271" text-anchor="middle" class="item">group aggregation</text>
<rect x="560" y="250" width="260" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="690" y="271" text-anchor="middle" class="item-sub">sum by (job) (rate(...))</text>
<rect x="40" y="290" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="294" width="190" height="32" rx="8" fill="#1e40af"/>
<text x="149" y="315" text-anchor="middle" class="node-title-w">histogram_quantile()</text>
<rect x="260" y="294" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="405" y="315" text-anchor="middle" class="item">p99 from histogram buckets</text>
<rect x="560" y="294" width="260" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="690" y="315" text-anchor="middle" class="item-sub">histogram_quantile(0.99, rate(..._bucket))</text>
<rect x="40" y="334" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="338" width="190" height="32" rx="8" fill="#1e40af"/>
<text x="149" y="359" text-anchor="middle" class="node-title-w">Recording rules</text>
<rect x="260" y="338" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="405" y="359" text-anchor="middle" class="item">precompute expensive queries</text>
<rect x="560" y="338" width="260" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="690" y="359" text-anchor="middle" class="item-sub">record: job:request_rate:5m</text>
<rect x="40" y="378" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="382" width="190" height="32" rx="8" fill="#1e40af"/>
<text x="149" y="403" text-anchor="middle" class="node-title-w">Offset</text>
<rect x="260" y="382" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="405" y="403" text-anchor="middle" class="item">query at a past time</text>
<rect x="560" y="382" width="260" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="690" y="403" text-anchor="middle" class="item-sub">... offset 1h</text>
<rect x="40" y="432" width="780" height="0" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
</svg>
