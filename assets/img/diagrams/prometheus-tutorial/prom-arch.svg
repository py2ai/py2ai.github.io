<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">Pull Model: Scrape, Service Discovery, Push Gateway</text>
<rect x="330" y="70" width="200" height="40" rx="8" fill="#1e40af"/>
<text x="430" y="96" text-anchor="middle" class="node-title-w">Prometheus</text>
<line x1="380" y1="110" x2="180" y2="150" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="430" y1="110" x2="430" y2="150" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="480" y1="110" x2="680" y2="150" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="80" y="152" width="200" height="40" rx="8" fill="#2563eb"/>
<text x="180" y="178" text-anchor="middle" class="node-title-w">app (exporter)</text>
<text x="180" y="196" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">GET /metrics</text>
<rect x="330" y="152" width="200" height="40" rx="8" fill="#2563eb"/>
<text x="430" y="178" text-anchor="middle" class="node-title-w">Push Gateway</text>
<text x="430" y="196" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">batch jobs push</text>
<rect x="580" y="152" width="200" height="40" rx="8" fill="#2563eb"/>
<text x="680" y="178" text-anchor="middle" class="node-title-w">node_exporter</text>
<text x="680" y="196" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">host metrics</text>
<rect x="40" y="220" width="820" height="100" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="246" text-anchor="middle" class="band-label">Why pull, not push</text>
<text x="430" y="272" text-anchor="middle" class="item-sub">Prometheus scrapes targets (pull). Target exposes /metrics in text exposition format.</text>
<text x="430" y="292" text-anchor="middle" class="item-sub">Service discovery: file_sd, k8s, consul, ec2 -&gt; dynamic target list.</text>
<text x="430" y="312" text-anchor="middle" class="item-sub">Push Gateway: only for batch jobs that exit (cron); never for services.</text>
<rect x="40" y="340" width="820" height="60" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="430" y="366" text-anchor="middle" class="band-label">Scrape config</text>
<text x="430" y="392" text-anchor="middle" class="item-sub">scrape_interval: 15s; relabel configs filter targets; honor_labels for job ownership.</text>
</svg>
