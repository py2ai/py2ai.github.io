<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="280" y="38" text-anchor="middle" class="title">Queries, Mutations, Subscriptions</text>
<rect x="40" y="70" width="780" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="76" width="150" height="34" rx="8" fill="#1e40af"/>
<text x="129" y="98" text-anchor="middle" class="node-title-w">Query</text>
<rect x="220" y="76" width="280" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="360" y="98" text-anchor="middle" class="item">read data; nested selection sets</text>
<rect x="510" y="76" width="310" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="665" y="98" text-anchor="middle" class="item-sub">client picks exact fields -&gt; no over/under-fetch</text>
<rect x="40" y="124" width="780" height="46" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="130" width="150" height="34" rx="8" fill="#1e40af"/>
<text x="129" y="152" text-anchor="middle" class="node-title-w">Mutation</text>
<rect x="220" y="130" width="280" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="360" y="152" text-anchor="middle" class="item">write data; returns the changed data</text>
<rect x="510" y="130" width="310" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="665" y="152" text-anchor="middle" class="item-sub">root mutation type, runs serially</text>
<rect x="40" y="178" width="780" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="184" width="150" height="34" rx="8" fill="#1e40af"/>
<text x="129" y="206" text-anchor="middle" class="node-title-w">Subscription</text>
<rect x="220" y="184" width="280" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="360" y="206" text-anchor="middle" class="item">real-time via WebSocket</text>
<rect x="510" y="184" width="310" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="665" y="206" text-anchor="middle" class="item-sub">stream updates on a query; pub/sub</text>
<rect x="40" y="232" width="780" height="46" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="238" width="150" height="34" rx="8" fill="#1e40af"/>
<text x="129" y="260" text-anchor="middle" class="node-title-w">Variables</text>
<rect x="220" y="238" width="280" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="360" y="260" text-anchor="middle" class="item">parameterize queries ($id: ID!)</text>
<rect x="510" y="238" width="310" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="665" y="260" text-anchor="middle" class="item-sub">separate query from arguments; safe + cacheable</text>
<rect x="40" y="286" width="780" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="292" width="150" height="34" rx="8" fill="#1e40af"/>
<text x="129" y="314" text-anchor="middle" class="node-title-w">Fragments</text>
<rect x="220" y="292" width="280" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="360" y="314" text-anchor="middle" class="item">reusable selection sets</text>
<rect x="510" y="292" width="310" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="665" y="314" text-anchor="middle" class="item-sub">spread {...UserCard} into queries; dedup fields</text>
<rect x="40" y="340" width="780" height="46" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="346" width="150" height="34" rx="8" fill="#1e40af"/>
<text x="129" y="368" text-anchor="middle" class="node-title-w">Aliases</text>
<rect x="220" y="346" width="280" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="360" y="368" text-anchor="middle" class="item">rename fields in response</text>
<rect x="510" y="346" width="310" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="665" y="368" text-anchor="middle" class="item-sub">fetch same field twice with different args</text>
<rect x="40" y="400" width="780" height="26" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="430" y="418" text-anchor="middle" class="note">One endpoint, one query -&gt; exactly the data the client asked for (no over-fetch, no under-fetch).</text>
</svg>
