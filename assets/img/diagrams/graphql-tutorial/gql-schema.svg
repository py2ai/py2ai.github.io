<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="300" y="38" text-anchor="middle" class="title">GraphQL Schema: The Type System</text>
<rect x="330" y="70" width="200" height="40" rx="8" fill="#1e40af"/>
<text x="430" y="96" text-anchor="middle" class="node-title-w">schema</text>
<line x1="380" y1="110" x2="180" y2="140" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="430" y1="110" x2="430" y2="140" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="480" y1="110" x2="680" y2="140" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="80" y="142" width="200" height="50" rx="8" fill="#2563eb"/>
<text x="180" y="170" text-anchor="middle" class="node-title-w">type Query</text>
<text x="180" y="188" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">read entry points</text>
<rect x="330" y="142" width="200" height="50" rx="8" fill="#1e40af"/>
<text x="430" y="170" text-anchor="middle" class="node-title-w">type Mutation</text>
<text x="430" y="188" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">write entry points</text>
<rect x="580" y="142" width="200" height="50" rx="8" fill="#2563eb"/>
<text x="680" y="170" text-anchor="middle" class="node-title-w">scalar / enum</text>
<text x="680" y="188" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">Int, String, ID, custom</text>
<rect x="40" y="210" width="820" height="140" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="236" text-anchor="middle" class="band-label">Example object type</text>
<rect x="160" y="250" width="540" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="430" y="276" text-anchor="start" class="item-sub">type User {</text>
<text x="430" y="276" text-anchor="start" class="item">type User {</text>
<text x="200" y="296" text-anchor="start" class="item">id: ID!</text>
<text x="560" y="296" text-anchor="middle" class="item-sub">non-null</text>
<text x="200" y="316" text-anchor="start" class="item">name: String!</text>
<text x="560" y="316" text-anchor="middle" class="item-sub">required</text>
<text x="200" y="336" text-anchor="start" class="item">posts: [Post!]!</text>
<text x="560" y="336" text-anchor="middle" class="item-sub">list of non-null Post</text>
</svg>
