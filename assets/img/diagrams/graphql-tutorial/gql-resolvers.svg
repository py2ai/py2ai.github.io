<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="300" y="38" text-anchor="middle" class="title">Resolvers + The N+1 Problem + DataLoader</text>
<rect x="330" y="70" width="200" height="40" rx="8" fill="#1e40af"/>
<text x="430" y="96" text-anchor="middle" class="node-title-w">Query.user</text>
<line x1="380" y1="110" x2="180" y2="140" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="480" y1="110" x2="680" y2="140" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="80" y="142" width="200" height="40" rx="8" fill="#2563eb"/>
<text x="180" y="170" text-anchor="middle" class="node-title-w">user.name</text>
<rect x="580" y="142" width="200" height="40" rx="8" fill="#2563eb"/>
<text x="680" y="170" text-anchor="middle" class="node-title-w">user.posts</text>
<line x1="680" y1="182" x2="680" y2="212" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="580" y="214" width="200" height="40" rx="8" fill="#1e40af"/>
<text x="680" y="240" text-anchor="middle" class="node-title-w">posts[].author</text>
<text x="680" y="258" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">per-post resolver</text>
<rect x="40" y="290" width="820" height="80" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="316" text-anchor="middle" class="band-label">N+1 problem + fix</text>
<text x="430" y="342" text-anchor="middle" class="item-sub">N+1: user.posts -&gt; each post fetches its author = N+1 DB queries.</text>
<text x="430" y="362" text-anchor="middle" class="item-sub">DataLoader: batch + cache; coalesces N author fetches into 1 IN-clause query.</text>
</svg>
