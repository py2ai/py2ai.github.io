<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">Reverse Proxy + Upstream + Load Balancing</text>
<rect x="80" y="90" width="130" height="60" rx="8" fill="#1e40af"/>
<text x="145" y="118" text-anchor="middle" class="node-title-w">Client</text>
<text x="145" y="136" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">HTTPS request</text>
<line x1="210" y1="120" x2="340" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-accent)"/>
<text x="275" y="112" text-anchor="middle" class="item-sub">/api</text>
<rect x="340" y="90" width="160" height="60" rx="8" fill="#2563eb"/>
<text x="420" y="118" text-anchor="middle" class="node-title-w">nginx</text>
<text x="420" y="136" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">reverse proxy</text>
<line x1="500" y1="110" x2="560" y2="90" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="500" y1="120" x2="560" y2="120" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="500" y1="130" x2="560" y2="150" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="560" y="70" width="150" height="40" rx="8" fill="#1e40af"/>
<text x="635" y="96" text-anchor="middle" class="node-title-w">app1:3000</text>
<rect x="560" y="110" width="150" height="40" rx="8" fill="#1e40af"/>
<text x="635" y="136" text-anchor="middle" class="node-title-w">app2:3000</text>
<rect x="560" y="150" width="150" height="40" rx="8" fill="#1e40af"/>
<text x="635" y="176" text-anchor="middle" class="node-title-w">app3:3000</text>
<text x="635" y="196" text-anchor="middle" class="item-sub">upstream backend {}</text>
<rect x="40" y="230" width="820" height="80" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="256" text-anchor="middle" class="band-label">Load balancing methods</text>
<rect x="60" y="274" width="170" height="30" rx="8" fill="#2563eb"/>
<text x="145" y="294" text-anchor="middle" class="node-title-w">round_robin: default, even</text>
<rect x="250" y="274" width="170" height="30" rx="8" fill="#1e40af"/>
<text x="335" y="294" text-anchor="middle" class="node-title-w">least_conn: fewest active</text>
<rect x="440" y="274" width="170" height="30" rx="8" fill="#2563eb"/>
<text x="525" y="294" text-anchor="middle" class="node-title-w">ip_hash: sticky by IP</text>
<rect x="630" y="274" width="170" height="30" rx="8" fill="#1e40af"/>
<text x="715" y="294" text-anchor="middle" class="node-title-w">random: random pick</text>
<rect x="40" y="330" width="820" height="80" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="356" text-anchor="middle" class="band-label">proxy_pass settings</text>
<rect x="60" y="374" width="170" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="145" y="393" text-anchor="middle" class="item">proxy_set_header</text>
<text x="145" y="408" text-anchor="middle" class="item-sub">Host, X-Real-IP, X-Forwarded-For</text>
<rect x="250" y="374" width="170" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="335" y="393" text-anchor="middle" class="item">proxy_buffering</text>
<text x="335" y="408" text-anchor="middle" class="item-sub">on/off + buffer sizes</text>
<rect x="440" y="374" width="170" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="525" y="393" text-anchor="middle" class="item">proxy_read_timeout</text>
<text x="525" y="408" text-anchor="middle" class="item-sub">long upstream wait</text>
<rect x="630" y="374" width="170" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="715" y="393" text-anchor="middle" class="item">proxy_next_upstream</text>
<text x="715" y="408" text-anchor="middle" class="item-sub">retry on failure</text>
</svg>
