<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">Nginx Config: Nested Blocks + Directives</text>
<rect x="120" y="70" width="620" height="40" rx="8" fill="#1e40af"/>
<text x="430" y="96" text-anchor="middle" class="node-title-w">http { ... }</text>
<line x1="430" y1="110" x2="260" y2="140" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="430" y1="110" x2="600" y2="140" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="180" y="142" width="160" height="40" rx="8" fill="#2563eb"/>
<text x="260" y="168" text-anchor="middle" class="node-title-w">server { }</text>
<rect x="500" y="142" width="200" height="40" rx="8" fill="#1e40af"/>
<text x="600" y="168" text-anchor="middle" class="node-title-w">upstream { }</text>
<line x1="260" y1="182" x2="260" y2="210" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="180" y="212" width="160" height="40" rx="8" fill="#2563eb"/>
<text x="260" y="238" text-anchor="middle" class="node-title-w">location { }</text>
<rect x="40" y="290" width="820" height="90" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="316" text-anchor="middle" class="band-label">Common directives</text>
<rect x="60" y="330" width="115" height="36" rx="8" fill="#2563eb"/>
<text x="117" y="348" text-anchor="middle" class="node-title-w">listen</text>
<text x="117" y="362" text-anchor="middle" font-size="9" fill="#e0e7ff" font-family="inherit">port/socket</text>
<rect x="185" y="330" width="115" height="36" rx="8" fill="#1e40af"/>
<text x="242" y="348" text-anchor="middle" class="node-title-w">server_name</text>
<text x="242" y="362" text-anchor="middle" font-size="9" fill="#e0e7ff" font-family="inherit">hostnames</text>
<rect x="310" y="330" width="115" height="36" rx="8" fill="#2563eb"/>
<text x="367" y="348" text-anchor="middle" class="node-title-w">root</text>
<text x="367" y="362" text-anchor="middle" font-size="9" fill="#e0e7ff" font-family="inherit">file root</text>
<rect x="435" y="330" width="115" height="36" rx="8" fill="#1e40af"/>
<text x="492" y="348" text-anchor="middle" class="node-title-w">proxy_pass</text>
<text x="492" y="362" text-anchor="middle" font-size="9" fill="#e0e7ff" font-family="inherit">upstream URL</text>
<rect x="560" y="330" width="115" height="36" rx="8" fill="#2563eb"/>
<text x="617" y="348" text-anchor="middle" class="node-title-w">return</text>
<text x="617" y="362" text-anchor="middle" font-size="9" fill="#e0e7ff" font-family="inherit">redirect/status</text>
<rect x="685" y="330" width="115" height="36" rx="8" fill="#1e40af"/>
<text x="742" y="348" text-anchor="middle" class="node-title-w">try_files</text>
<text x="742" y="362" text-anchor="middle" font-size="9" fill="#e0e7ff" font-family="inherit">fallback chain</text>
<rect x="40" y="396" width="820" height="30" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="430" y="416" text-anchor="middle" class="note">Blocks nest: http &gt; server &gt; location. Inner directives override outer.</text>
</svg>
