<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">TLS: HTTPS, Let's Encrypt, HTTP/2</text>
<rect x="40" y="70" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="74" width="230" height="32" rx="8" fill="#1e40af"/>
<text x="169" y="95" text-anchor="middle" class="node-title-w">listen 443 ssl</text>
<rect x="300" y="74" width="520" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="560" y="95" text-anchor="middle" class="item">HTTPS port + cert</text>
<rect x="40" y="114" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="118" width="230" height="32" rx="8" fill="#2563eb"/>
<text x="169" y="139" text-anchor="middle" class="node-title-w">ssl_certificate</text>
<rect x="300" y="118" width="520" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="560" y="139" text-anchor="middle" class="item">cert + chain PEM path</text>
<rect x="40" y="158" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="162" width="230" height="32" rx="8" fill="#1e40af"/>
<text x="169" y="183" text-anchor="middle" class="node-title-w">ssl_protocols</text>
<rect x="300" y="162" width="520" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="560" y="183" text-anchor="middle" class="item">TLSv1.2 TLSv1.3 (drop 1.0/1.1)</text>
<rect x="40" y="202" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="206" width="230" height="32" rx="8" fill="#2563eb"/>
<text x="169" y="227" text-anchor="middle" class="node-title-w">HTTP/2</text>
<rect x="300" y="206" width="520" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="560" y="227" text-anchor="middle" class="item">listen 443 ssl http2;</text>
<rect x="40" y="246" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="250" width="230" height="32" rx="8" fill="#1e40af"/>
<text x="169" y="271" text-anchor="middle" class="node-title-w">HTTP -&gt; HTTPS redirect</text>
<rect x="300" y="250" width="520" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="560" y="271" text-anchor="middle" class="item">return 301 https://$host$request_uri</text>
<rect x="40" y="290" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="294" width="230" height="32" rx="8" fill="#2563eb"/>
<text x="169" y="315" text-anchor="middle" class="node-title-w">Let's Encrypt / certbot</text>
<rect x="300" y="294" width="520" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="560" y="315" text-anchor="middle" class="item">auto-renew via webroot or DNS</text>
<rect x="40" y="334" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="338" width="230" height="32" rx="8" fill="#1e40af"/>
<text x="169" y="359" text-anchor="middle" class="node-title-w">HSTS + headers</text>
<rect x="300" y="338" width="520" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="560" y="359" text-anchor="middle" class="item">Strict-Transport-Security</text>
<rect x="40" y="378" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="382" width="230" height="32" rx="8" fill="#2563eb"/>
<text x="169" y="403" text-anchor="middle" class="node-title-w">ssl_session_cache</text>
<rect x="300" y="382" width="520" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="560" y="403" text-anchor="middle" class="item">resume sessions + speed</text>
</svg>
