<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Helvetica, Arial, sans-serif">
  <rect width="1100" height="720" fill="#0e1726"/>
  <text x="550" y="46" fill="#f5f7fa" font-size="25" text-anchor="middle" font-weight="bold">A Mac mini cluster with EXO: pool unified memory over Thunderbolt 5 RDMA</text>
  <text x="550" y="72" fill="#8fa3bf" font-size="14" text-anchor="middle">macOS 26.2+ adds kernel-level RDMA over Thunderbolt 5; EXO shards one model across nodes and serves an OpenAI-compatible API</text>

  <!-- Mac mini nodes -->
  <g>
    <rect x="60" y="130" width="220" height="120" rx="10" fill="#16283f" stroke="#3d7edb" stroke-width="2"/>
    <text x="170" y="162" fill="#6db3f2" font-size="16" font-weight="bold" text-anchor="middle">Mac mini 1</text>
    <text x="170" y="186" fill="#dbe4f0" font-size="13" text-anchor="middle">M4 Pro - 48 GB</text>
    <text x="170" y="208" fill="#8fa3bf" font-size="12" text-anchor="middle">EXO node + layers 0-7</text>
    <text x="170" y="228" fill="#9fd0a8" font-size="12" text-anchor="middle">uv run exo</text>

    <rect x="330" y="130" width="220" height="120" rx="10" fill="#16283f" stroke="#3d7edb" stroke-width="2"/>
    <text x="440" y="162" fill="#6db3f2" font-size="16" font-weight="bold" text-anchor="middle">Mac mini 2</text>
    <text x="440" y="186" fill="#dbe4f0" font-size="13" text-anchor="middle">M4 Pro - 48 GB</text>
    <text x="440" y="208" fill="#8fa3bf" font-size="12" text-anchor="middle">layers 8-15</text>
    <text x="440" y="228" fill="#9fd0a8" font-size="12" text-anchor="middle">uv run exo</text>

    <rect x="600" y="130" width="220" height="120" rx="10" fill="#16283f" stroke="#3d7edb" stroke-width="2"/>
    <text x="710" y="162" fill="#6db3f2" font-size="16" font-weight="bold" text-anchor="middle">Mac mini 3</text>
    <text x="710" y="186" fill="#dbe4f0" font-size="13" text-anchor="middle">M4 Pro - 48 GB</text>
    <text x="710" y="208" fill="#8fa3bf" font-size="12" text-anchor="middle">layers 16-23</text>
    <text x="710" y="228" fill="#9fd0a8" font-size="12" text-anchor="middle">uv run exo</text>

    <rect x="870" y="130" width="180" height="120" rx="10" fill="#16283f" stroke="#b06ec9" stroke-width="2"/>
    <text x="960" y="162" fill="#d49ae8" font-size="16" font-weight="bold" text-anchor="middle">Mac mini 4</text>
    <text x="960" y="186" fill="#dbe4f0" font-size="13" text-anchor="middle">M4 Pro - 48 GB</text>
    <text x="960" y="208" fill="#8fa3bf" font-size="12" text-anchor="middle">layers 24-31</text>
    <text x="960" y="228" fill="#9fd0a8" font-size="12" text-anchor="middle">192 GB pooled</text>
  </g>

  <!-- TB5 mesh -->
  <g stroke="#c9a13b" stroke-width="3" fill="none">
    <line x1="280" y1="190" x2="330" y2="190"/>
    <line x1="550" y1="190" x2="600" y2="190"/>
    <line x1="820" y1="190" x2="870" y2="190"/>
    <line x1="170" y1="250" x2="440" y2="250"/>
    <line x1="440" y1="250" x2="710" y2="250"/>
    <line x1="710" y1="250" x2="960" y2="250"/>
    <line x1="170" y1="250" x2="710" y2="250"/>
    <line x1="440" y1="250" x2="960" y2="250"/>
  </g>
  <text x="550" y="286" fill="#e8c766" font-size="14" text-anchor="middle">Thunderbolt 5 mesh - TB5 RDMA (80-120 GB/s, ~1-3 us latency) beats 10 GbE beats Wi-Fi</text>

  <!-- EXO runtime -->
  <rect x="230" y="320" width="640" height="120" rx="10" fill="#1b2438" stroke="#59b26b" stroke-width="2"/>
  <text x="550" y="352" fill="#8fd694" font-size="17" font-weight="bold" text-anchor="middle">EXO runtime (github.com/exo-explore/exo)</text>
  <text x="550" y="378" fill="#dbe4f0" font-size="13" text-anchor="middle">Auto device discovery - topology-aware model sharding (pipeline + tensor) - MLX backend</text>
  <text x="550" y="400" fill="#dbe4f0" font-size="13" text-anchor="middle">Dashboard at http://localhost:52415 - offline mode after models are downloaded</text>
  <text x="550" y="422" fill="#9fd0a8" font-size="13" text-anchor="middle">Works heterogeneous: mix Mac mini, Mac Studio, DGX Spark, Linux + NVIDIA boxes</text>

  <!-- API layer -->
  <rect x="230" y="470" width="640" height="86" rx="10" fill="#1b2438" stroke="#3d7edb" stroke-width="2"/>
  <text x="550" y="500" fill="#6db3f2" font-size="16" font-weight="bold" text-anchor="middle">One endpoint for every client</text>
  <text x="550" y="524" fill="#dbe4f0" font-size="13" text-anchor="middle">OpenAI Chat Completions + Claude Messages + Ollama formats on port 52415</text>
  <text x="550" y="544" fill="#8fa3bf" font-size="13" text-anchor="middle">curl http://localhost:52415/v1/chat/completions - any OpenAI SDK works unchanged</text>

  <!-- Clients -->
  <g>
    <rect x="140" y="596" width="240" height="64" rx="10" fill="#16283f" stroke="#59b26b" stroke-width="2"/>
    <text x="260" y="622" fill="#8fd694" font-size="14" font-weight="bold" text-anchor="middle">Coding agents</text>
    <text x="260" y="644" fill="#8fa3bf" font-size="12" text-anchor="middle">Claude Code, OpenCode, Codex CLI</text>

    <rect x="430" y="596" width="240" height="64" rx="10" fill="#16283f" stroke="#c9a13b" stroke-width="2"/>
    <text x="550" y="622" fill="#e8c766" font-size="14" font-weight="bold" text-anchor="middle">Chat + RAG UIs</text>
    <text x="550" y="644" fill="#8fa3bf" font-size="12" text-anchor="middle">Open WebUI, LM Studio, LangChain</text>

    <rect x="720" y="596" width="240" height="64" rx="10" fill="#16283f" stroke="#b06ec9" stroke-width="2"/>
    <text x="840" y="622" fill="#d49ae8" font-size="14" font-weight="bold" text-anchor="middle">Custom apps</text>
    <text x="840" y="644" fill="#8fa3bf" font-size="12" text-anchor="middle">Any OpenAI-compatible client</text>
  </g>
  <g stroke="#5f7391" stroke-width="2" fill="none">
    <line x1="260" y1="596" x2="420" y2="556"/>
    <line x1="550" y1="596" x2="550" y2="556"/>
    <line x1="840" y1="596" x2="680" y2="556"/>
  </g>

  <text x="550" y="696" fill="#5f7391" font-size="12" text-anchor="middle">Enable RDMA once per node: Recovery Mode, run rdma_ctl enable, restart. Install EXO with: brew install --cask exo</text>
</svg>
