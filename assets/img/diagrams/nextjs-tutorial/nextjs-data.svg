<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">Data Fetching, Caching, Server Actions</text>
<rect x="40" y="70" width="780" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="76" width="220" height="34" rx="8" fill="#1e40af"/>
<text x="164" y="98" text-anchor="middle" class="node-title-w">fetch() (cached)</text>
<rect x="290" y="76" width="530" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="555" y="98" text-anchor="middle" class="item">Server Components fetch; cached by default</text>
<rect x="40" y="124" width="780" height="46" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="130" width="220" height="34" rx="8" fill="#2563eb"/>
<text x="164" y="152" text-anchor="middle" class="node-title-w">cache: 'no-store'</text>
<rect x="290" y="130" width="530" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="555" y="152" text-anchor="middle" class="item">opt out of cache -&gt; always fresh</text>
<rect x="40" y="178" width="780" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="184" width="220" height="34" rx="8" fill="#1e40af"/>
<text x="164" y="206" text-anchor="middle" class="node-title-w">next: { revalidate: 60 }</text>
<rect x="290" y="184" width="530" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="555" y="206" text-anchor="middle" class="item">time-based revalidation (ISR)</text>
<rect x="40" y="232" width="780" height="46" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="238" width="220" height="34" rx="8" fill="#2563eb"/>
<text x="164" y="260" text-anchor="middle" class="node-title-w">revalidatePath()/Tag()</text>
<rect x="290" y="238" width="530" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="555" y="260" text-anchor="middle" class="item">on-demand revalidation after mutation</text>
<rect x="40" y="286" width="780" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="292" width="220" height="34" rx="8" fill="#1e40af"/>
<text x="164" y="314" text-anchor="middle" class="node-title-w">Server Actions</text>
<rect x="290" y="292" width="530" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="555" y="314" text-anchor="middle" class="item">'use server' async fns = form mutations</text>
<rect x="40" y="340" width="780" height="46" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="346" width="220" height="34" rx="8" fill="#2563eb"/>
<text x="164" y="368" text-anchor="middle" class="node-title-w">useFormState / useAction</text>
<rect x="290" y="346" width="530" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="555" y="368" text-anchor="middle" class="item">client hooks for Server Actions</text>
<rect x="40" y="400" width="780" height="26" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="430" y="418" text-anchor="middle" class="note">Default: fetch is cached (static). Mutate via Server Actions, then revalidatePath.</text>
</svg>
