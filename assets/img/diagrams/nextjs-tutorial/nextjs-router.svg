<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">File-Based Routing: app/ Directory</text>
<rect x="40" y="70" width="300" height="300" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="190" y="96" text-anchor="middle" class="band-label">File system -&gt; URLs</text>
<text x="70" y="126" text-anchor="start" class="item">app/</text>
<text x="90" y="150" text-anchor="start" class="item">  layout.tsx</text>
<text x="90" y="174" text-anchor="start" class="item">  page.tsx  -&gt; /</text>
<text x="90" y="198" text-anchor="start" class="item">  about/</text>
<text x="110" y="222" text-anchor="start" class="item">    page.tsx -&gt; /about</text>
<text x="90" y="246" text-anchor="start" class="item">  blog/</text>
<text x="110" y="270" text-anchor="start" class="item">    [slug]/</text>
<text x="130" y="294" text-anchor="start" class="item">      page.tsx -&gt; /blog/:slug</text>
<text x="90" y="318" text-anchor="start" class="item">  api/</text>
<text x="110" y="342" text-anchor="start" class="item">    route.ts -&gt; /api/*</text>
<rect x="380" y="70" width="480" height="300" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="620" y="96" text-anchor="middle" class="band-label">Layouts nest</text>
<rect x="420" y="118" width="220" height="40" rx="8" fill="#1e40af"/>
<text x="530" y="142" text-anchor="middle" class="node-title-w">Root layout</text>
<text x="530" y="158" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">&lt;html&gt;&lt;body&gt;</text>
<line x1="530" y1="158" x2="530" y2="178" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="420" y="180" width="220" height="40" rx="8" fill="#2563eb"/>
<text x="530" y="204" text-anchor="middle" class="node-title-w">about/layout.tsx</text>
<line x1="530" y1="220" x2="530" y2="240" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="420" y="242" width="220" height="40" rx="8" fill="#1e40af"/>
<text x="530" y="266" text-anchor="middle" class="node-title-w">about/page.tsx</text>
<text x="530" y="282" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">the content</text>
<rect x="420" y="300" width="220" height="40" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="530" y="326" text-anchor="middle" class="note">children render here</text>
<rect x="40" y="390" width="820" height="30" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="430" y="410" text-anchor="middle" class="note">page.tsx = content; layout.tsx = shared chrome that wraps every child page.</text>
</svg>
