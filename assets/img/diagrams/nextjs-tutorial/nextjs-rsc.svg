<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="280" y="38" text-anchor="middle" class="title">Server Components vs Client Components</text>
<rect x="40" y="70" width="390" height="170" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="235" y="96" text-anchor="middle" class="band-label">Server Component (default)</text>
<rect x="80" y="112" width="310" height="40" rx="8" fill="#1e40af"/>
<text x="235" y="136" text-anchor="middle" class="node-title-w">no 'use client'</text>
<text x="235" y="170" text-anchor="item" class="#2563eb">runs on server, sends HTML + RSC payload</text>
<rect x="80" y="184" width="310" height="18" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="235" y="197" text-anchor="middle" class="item-sub">+ direct DB/FS access</text>
<rect x="80" y="196" width="310" height="18" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="235" y="209" text-anchor="middle" class="item-sub">+ no JS shipped to client</text>
<rect x="80" y="208" width="310" height="18" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="235" y="221" text-anchor="middle" class="item-sub">+ async, can await</text>
<rect x="80" y="220" width="310" height="18" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="235" y="233" text-anchor="middle" class="item-sub">+ can't use hooks/state</text>
<rect x="460" y="70" width="390" height="170" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="655" y="96" text-anchor="middle" class="band-label">Client Component</text>
<rect x="500" y="112" width="310" height="40" rx="8" fill="#2563eb"/>
<text x="655" y="136" text-anchor="middle" class="node-title-w">'use client' at top</text>
<text x="655" y="170" text-anchor="item" class="#1e40af">runs in browser, hydrated from RSC payload</text>
<rect x="500" y="184" width="310" height="18" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="655" y="197" text-anchor="middle" class="item-sub">+ useState, useEffect, refs</text>
<rect x="500" y="196" width="310" height="18" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="655" y="209" text-anchor="middle" class="item-sub">+ event handlers (onClick)</text>
<rect x="500" y="208" width="310" height="18" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="655" y="221" text-anchor="middle" class="item-sub">+ browser APIs</text>
<rect x="500" y="220" width="310" height="18" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="655" y="233" text-anchor="middle" class="item-sub">+ can't access DB/FS</text>
<rect x="40" y="260" width="810" height="120" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="286" text-anchor="middle" class="band-label">The composition rule</text>
<rect x="180" y="300" width="200" height="40" rx="8" fill="#1e40af"/>
<text x="280" y="324" text-anchor="middle" class="node-title-w">Server (parent)</text>
<line x1="380" y1="320" x2="440" y2="320" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-accent)"/>
<text x="410" y="312" text-anchor="middle" class="item-sub">can pass</text>
<rect x="440" y="300" width="200" height="40" rx="8" fill="#2563eb"/>
<text x="540" y="324" text-anchor="middle" class="node-title-w">Client (child)</text>
<text x="430" y="364" text-anchor="middle" class="item-sub">Server can RENDER a client component; Client CANNOT import a Server component.</text>
<text x="430" y="382" text-anchor="middle" class="item-sub">Pass Server components as children props to Client components instead.</text>
</svg>
