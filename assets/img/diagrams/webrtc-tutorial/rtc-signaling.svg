<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">Signaling: Offer/Answer + SDP Exchange</text>
<rect x="60" y="80" width="150" height="50" rx="8" fill="#1e40af"/>
<text x="135" y="110" text-anchor="middle" class="node-title-w">Peer A</text>
<text x="135" y="128" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">caller</text>
<rect x="650" y="80" width="150" height="50" rx="8" fill="#1e40af"/>
<text x="725" y="110" text-anchor="middle" class="node-title-w">Peer B</text>
<text x="725" y="128" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">callee</text>
<rect x="340" y="90" width="180" height="40" rx="8" fill="#2563eb"/>
<text x="430" y="116" text-anchor="middle" class="node-title-w">Signaling Server</text>
<text x="430" y="134" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">WebSocket/HTTP</text>
<line x1="210" y1="100" x2="340" y2="105" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="530" y1="105" x2="650" y2="100" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<text x="275" y="92" text-anchor="middle" class="item-sub">1. offer (SDP)</text>
<text x="590" y="92" text-anchor="middle" class="item-sub">2. offer -&gt; B</text>
<line x1="650" y1="130" x2="530" y2="135" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="135" x2="210" y2="130" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<text x="590" y="150" text-anchor="middle" class="item-sub">3. answer (SDP)</text>
<text x="275" y="150" text-anchor="middle" class="item-sub">4. answer -&gt; A</text>
<rect x="40" y="200" width="820" height="110" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="226" text-anchor="middle" class="band-label">The SDP (Session Description Protocol)</text>
<text x="430" y="252" text-anchor="middle" class="item-sub">SDP describes: codecs (H.264, VP8/VP9, AV1), media formats, ICE candidates,</text>
<text x="430" y="272" text-anchor="middle" class="item-sub">tracks (audio/video), directions (sendrecv/sendonly/recvonly).</text>
<text x="430" y="292" text-anchor="middle" class="item-sub">Offer = A's proposed session; Answer = B's accepted subset. Then ICE connects.</text>
<rect x="40" y="330" width="820" height="70" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="430" y="356" text-anchor="middle" class="band-label">Signaling is NOT part of WebRTC</text>
<text x="430" y="382" text-anchor="middle" class="item-sub">WebRTC has no signaling protocol. You implement it (WebSocket, HTTP, any transport).</text>
<text x="430" y="400" text-anchor="middle" class="item-sub">Signaling only sets up the connection; after that, media flows P2P (or via TURN).</text>
</svg>
