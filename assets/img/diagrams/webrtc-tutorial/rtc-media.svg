<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">Media: Capture, Encode, SRTP, DTLS, Congestion</text>
<rect x="40" y="70" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="74" width="170" height="32" rx="8" fill="#1e40af"/>
<text x="139" y="95" text-anchor="middle" class="node-title-w">getUserMedia</text>
<rect x="240" y="74" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="395" y="95" text-anchor="middle" class="item">capture camera/mic in browser</text>
<rect x="560" y="74" width="260" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="690" y="95" text-anchor="middle" class="item-sub">MediaStream API</text>
<rect x="40" y="114" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="118" width="170" height="32" rx="8" fill="#1e40af"/>
<text x="139" y="139" text-anchor="middle" class="node-title-w">Codec</text>
<rect x="240" y="118" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="395" y="139" text-anchor="middle" class="item">encode video (VP8/VP9/H.264/AV1) + audio (Opus)</text>
<rect x="560" y="118" width="260" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="690" y="139" text-anchor="middle" class="item-sub">negotiated in SDP</text>
<rect x="40" y="158" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="162" width="170" height="32" rx="8" fill="#1e40af"/>
<text x="139" y="183" text-anchor="middle" class="node-title-w">RTP</text>
<rect x="240" y="162" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="395" y="183" text-anchor="middle" class="item">real-time transport of media packets</text>
<rect x="560" y="162" width="260" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="690" y="183" text-anchor="middle" class="item-sub">sequence + timestamp</text>
<rect x="40" y="202" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="206" width="170" height="32" rx="8" fill="#1e40af"/>
<text x="139" y="227" text-anchor="middle" class="node-title-w">SRTP</text>
<rect x="240" y="206" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="395" y="227" text-anchor="middle" class="item">encrypted RTP (AES)</text>
<rect x="560" y="206" width="260" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="690" y="227" text-anchor="middle" class="item-sub">media is encrypted</text>
<rect x="40" y="246" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="250" width="170" height="32" rx="8" fill="#1e40af"/>
<text x="139" y="271" text-anchor="middle" class="node-title-w">DTLS</text>
<rect x="240" y="250" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="395" y="271" text-anchor="middle" class="item">key exchange for SRTP</text>
<rect x="560" y="250" width="260" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="690" y="271" text-anchor="middle" class="item-sub">DTLS-SRTP handshake</text>
<rect x="40" y="290" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="294" width="170" height="32" rx="8" fill="#1e40af"/>
<text x="139" y="315" text-anchor="middle" class="node-title-w">Congestion control</text>
<rect x="240" y="294" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="395" y="315" text-anchor="middle" class="item">GCC, adapt bitrate to network</text>
<rect x="560" y="294" width="260" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="690" y="315" text-anchor="middle" class="item-sub">avoid packet loss</text>
<rect x="40" y="334" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="338" width="170" height="32" rx="8" fill="#1e40af"/>
<text x="139" y="359" text-anchor="middle" class="node-title-w">Simulcast</text>
<rect x="240" y="338" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="395" y="359" text-anchor="middle" class="item">send multiple resolutions/bitrate</text>
<rect x="560" y="338" width="260" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="690" y="359" text-anchor="middle" class="item-sub">viewer picks quality</text>
<rect x="40" y="378" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="382" width="170" height="32" rx="8" fill="#1e40af"/>
<text x="139" y="403" text-anchor="middle" class="node-title-w">Jitter buffer</text>
<rect x="240" y="382" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="395" y="403" text-anchor="middle" class="item">reorder + smooth playback</text>
<rect x="560" y="382" width="260" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="690" y="403" text-anchor="middle" class="item-sub">hide network jitter</text>
<rect x="40" y="432" width="780" height="0" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
</svg>
