<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">ICE: STUN, TURN, Candidates, NAT Traversal</text>
<rect x="40" y="70" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="74" width="200" height="32" rx="8" fill="#1e40af"/>
<text x="154" y="95" text-anchor="middle" class="node-title-w">ICE candidate</text>
<rect x="270" y="74" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="95" text-anchor="middle" class="item">a possible network path to the peer</text>
<rect x="570" y="74" width="250" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="695" y="95" text-anchor="middle" class="item-sub">host / srflx / relay</text>
<rect x="40" y="114" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="118" width="200" height="32" rx="8" fill="#1e40af"/>
<text x="154" y="139" text-anchor="middle" class="node-title-w">Host candidate</text>
<rect x="270" y="118" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="139" text-anchor="middle" class="item">local network interface IP</text>
<rect x="570" y="118" width="250" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="695" y="139" text-anchor="middle" class="item-sub">works on same LAN, no NAT</text>
<rect x="40" y="158" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="162" width="200" height="32" rx="8" fill="#1e40af"/>
<text x="154" y="183" text-anchor="middle" class="node-title-w">Server-reflexive (srflx)</text>
<rect x="270" y="162" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="183" text-anchor="middle" class="item">public IP learned from STUN</text>
<rect x="570" y="162" width="250" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="695" y="183" text-anchor="middle" class="item-sub">works through most NATs</text>
<rect x="40" y="202" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="206" width="200" height="32" rx="8" fill="#1e40af"/>
<text x="154" y="227" text-anchor="middle" class="node-title-w">Relay candidate</text>
<rect x="270" y="206" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="227" text-anchor="middle" class="item">TURN server relays traffic</text>
<rect x="570" y="206" width="250" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="695" y="227" text-anchor="middle" class="item-sub">last resort; costs bandwidth</text>
<rect x="40" y="246" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="250" width="200" height="32" rx="8" fill="#1e40af"/>
<text x="154" y="271" text-anchor="middle" class="node-title-w">STUN</text>
<rect x="270" y="250" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="271" text-anchor="middle" class="item">helps peer discover its public IP</text>
<rect x="570" y="250" width="250" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="695" y="271" text-anchor="middle" class="item-sub">cheap, usually sufficient</text>
<rect x="40" y="290" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="294" width="200" height="32" rx="8" fill="#1e40af"/>
<text x="154" y="315" text-anchor="middle" class="node-title-w">TURN</text>
<rect x="270" y="294" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="315" text-anchor="middle" class="item">relays media when P2P fails</text>
<rect x="570" y="294" width="250" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="695" y="315" text-anchor="middle" class="item-sub">expensive; ~20% of calls need it</text>
<rect x="40" y="334" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="338" width="200" height="32" rx="8" fill="#1e40af"/>
<text x="154" y="359" text-anchor="middle" class="node-title-w">ICE check</text>
<rect x="270" y="338" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="359" text-anchor="middle" class="item">test candidates in pairs</text>
<rect x="570" y="338" width="250" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="695" y="359" text-anchor="middle" class="item-sub">first working pair wins</text>
<rect x="40" y="378" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="382" width="200" height="32" rx="8" fill="#1e40af"/>
<text x="154" y="403" text-anchor="middle" class="node-title-w">Trickle ICE</text>
<rect x="270" y="382" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="403" text-anchor="middle" class="item">send candidates as discovered</text>
<rect x="570" y="382" width="250" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="695" y="403" text-anchor="middle" class="item-sub">faster connection setup</text>
<rect x="40" y="432" width="780" height="0" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
</svg>
