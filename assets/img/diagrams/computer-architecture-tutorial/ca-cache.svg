<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">Cache: Hits, Misses, Associativity, Coherence</text>
<rect x="40" y="70" width="780" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="76" width="170" height="34" rx="8" fill="#1e40af"/>
<text x="139" y="98" text-anchor="middle" class="node-title-w">Cache hit</text>
<rect x="240" y="76" width="280" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="380" y="98" text-anchor="middle" class="item">requested line is in cache</text>
<rect x="530" y="76" width="290" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="675" y="98" text-anchor="middle" class="item-sub">fast; hit rate drives perf</text>
<rect x="40" y="124" width="780" height="46" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="130" width="170" height="34" rx="8" fill="#1e40af"/>
<text x="139" y="152" text-anchor="middle" class="node-title-w">Cache miss</text>
<rect x="240" y="130" width="280" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="380" y="152" text-anchor="middle" class="item">not in cache; fetch from below</text>
<rect x="530" y="130" width="290" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="675" y="152" text-anchor="middle" class="item-sub">compulsory/capacity/conflict/coherence misses</text>
<rect x="40" y="178" width="780" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="184" width="170" height="34" rx="8" fill="#1e40af"/>
<text x="139" y="206" text-anchor="middle" class="node-title-w">Associativity</text>
<rect x="240" y="184" width="280" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="380" y="206" text-anchor="middle" class="item">direct-mapped / set-associative / fully</text>
<rect x="530" y="184" width="290" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="675" y="206" text-anchor="middle" class="item-sub">tradeoff: speed vs conflict misses</text>
<rect x="40" y="232" width="780" height="46" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="238" width="170" height="34" rx="8" fill="#1e40af"/>
<text x="139" y="260" text-anchor="middle" class="node-title-w">Cache line (block)</text>
<rect x="240" y="238" width="280" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="380" y="260" text-anchor="middle" class="item">unit of transfer, ~64 bytes</text>
<rect x="530" y="238" width="290" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="675" y="260" text-anchor="middle" class="item-sub">spatial locality: neighbors come free</text>
<rect x="40" y="286" width="780" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="292" width="170" height="34" rx="8" fill="#1e40af"/>
<text x="139" y="314" text-anchor="middle" class="node-title-w">Cache coherence (SMP)</text>
<rect x="240" y="292" width="280" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="380" y="314" text-anchor="middle" class="item">multiple cores see consistent state</text>
<rect x="530" y="292" width="290" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="675" y="314" text-anchor="middle" class="item-sub">MESI protocol; invalidate/share</text>
<rect x="40" y="340" width="780" height="46" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="346" width="170" height="34" rx="8" fill="#1e40af"/>
<text x="139" y="368" text-anchor="middle" class="node-title-w">False sharing</text>
<rect x="240" y="346" width="280" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="380" y="368" text-anchor="middle" class="item">two vars on one line, two cores</text>
<rect x="530" y="346" width="290" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="675" y="368" text-anchor="middle" class="item-sub">both cores thrash the line -&gt; slowdown</text>
<rect x="40" y="400" width="780" height="26" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="430" y="418" text-anchor="middle" class="note">Cache hit rate is the #1 perf lever: locality + data layout beat micro-optimization.</text>
</svg>
