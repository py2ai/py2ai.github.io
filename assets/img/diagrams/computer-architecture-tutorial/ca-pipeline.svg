<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">CPU Pipeline: Stages, Hazards, Branch Prediction</text>
<rect x="40" y="90" width="150" height="46" rx="8" fill="#1e40af"/>
<text x="115.0" y="118" text-anchor="middle" class="node-title-w">Fetch</text>
<line x1="190" y1="113" x2="58" y2="113" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="200" y="90" width="150" height="46" rx="8" fill="#2563eb"/>
<text x="275.0" y="118" text-anchor="middle" class="node-title-w">Decode</text>
<line x1="350" y1="113" x2="218" y2="113" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="360" y="90" width="150" height="46" rx="8" fill="#1e40af"/>
<text x="435.0" y="118" text-anchor="middle" class="node-title-w">Execute</text>
<line x1="510" y1="113" x2="378" y2="113" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="520" y="90" width="150" height="46" rx="8" fill="#2563eb"/>
<text x="595.0" y="118" text-anchor="middle" class="node-title-w">Memory</text>
<line x1="670" y1="113" x2="538" y2="113" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="90" width="150" height="46" rx="8" fill="#1e40af"/>
<text x="755.0" y="118" text-anchor="middle" class="node-title-w">Writeback</text>
<rect x="40" y="160" width="820" height="90" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="186" text-anchor="middle" class="band-label">Hazards</text>
<rect x="60" y="204" width="240" height="36" rx="8" fill="#2563eb"/>
<text x="180" y="222" text-anchor="middle" class="node-title-w">Structural: same resource, same cycle</text>
<rect x="320" y="204" width="240" height="36" rx="8" fill="#1e40af"/>
<text x="440" y="222" text-anchor="middle" class="node-title-w">Data: RAW/WAR/WAW dependency</text>
<rect x="580" y="204" width="240" height="36" rx="8" fill="#2563eb"/>
<text x="700" y="222" text-anchor="middle" class="node-title-w">Control: branch outcome unknown</text>
<rect x="40" y="270" width="820" height="110" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="296" text-anchor="middle" class="band-label">Solutions</text>
<rect x="60" y="314" width="170" height="56" rx="8" fill="#2563eb"/>
<text x="145" y="338" text-anchor="middle" class="node-title-w">Pipeline stall</text>
<text x="145" y="356" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">insert bubbles (slow)</text>
<rect x="250" y="314" width="170" height="56" rx="8" fill="#1e40af"/>
<text x="335" y="338" text-anchor="middle" class="node-title-w">Forwarding/bypass</text>
<text x="335" y="356" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">result straight to next instr</text>
<rect x="440" y="314" width="170" height="56" rx="8" fill="#2563eb"/>
<text x="525" y="338" text-anchor="middle" class="node-title-w">Branch prediction</text>
<text x="525" y="356" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">guess; flush if wrong</text>
<rect x="630" y="314" width="170" height="56" rx="8" fill="#1e40af"/>
<text x="715" y="338" text-anchor="middle" class="node-title-w">Out-of-order</text>
<text x="715" y="356" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">exec independent instrs early</text>
</svg>
