<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="400" fill="#ffffff"/>
<text x="280" y="38" text-anchor="middle" class="title">Memory Hierarchy: Latency vs Size</text>
<rect x="400.0" y="70" width="60" height="36" rx="8" fill="#1e40af"/>
<text x="430.0" y="94" text-anchor="start" class="node-title-w">Registers</text>
<text x="430.0" y="94" text-anchor="middle" class="item">~1 cycle | &lt; 1 KB</text>
<line x1="430.0" y1="106" x2="430.0" y2="82" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="370.0" y="116" width="120" height="36" rx="8" fill="#2563eb"/>
<text x="400.0" y="140" text-anchor="start" class="node-title-w">L1 Cache</text>
<text x="430.0" y="140" text-anchor="middle" class="item">~4 cycles | ~64 KB</text>
<line x1="430.0" y1="152" x2="430.0" y2="128" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="340.0" y="162" width="180" height="36" rx="8" fill="#1e40af"/>
<text x="370.0" y="186" text-anchor="start" class="node-title-w">L2 Cache</text>
<text x="430.0" y="186" text-anchor="middle" class="item">~10 cycles | ~512 KB</text>
<line x1="430.0" y1="198" x2="430.0" y2="174" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="310.0" y="208" width="240" height="36" rx="8" fill="#2563eb"/>
<text x="340.0" y="232" text-anchor="start" class="node-title-w">L3 Cache</text>
<text x="430.0" y="232" text-anchor="middle" class="item">~40 cycles | ~32 MB</text>
<line x1="430.0" y1="244" x2="430.0" y2="220" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="280.0" y="254" width="300" height="36" rx="8" fill="#475569"/>
<text x="310.0" y="278" text-anchor="start" class="node-title-w">RAM</text>
<text x="430.0" y="278" text-anchor="middle" class="item">~200 cycles | ~32 GB</text>
<line x1="430.0" y1="290" x2="430.0" y2="266" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="250.0" y="300" width="360" height="36" rx="8" fill="#0f172a"/>
<text x="280.0" y="324" text-anchor="start" class="node-title-w">SSD/Disk</text>
<text x="430.0" y="324" text-anchor="middle" class="item">~100k+ cycles | TB</text>
<rect x="40" y="360" width="820" height="30" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="430" y="380" text-anchor="middle" class="note">Faster + smaller at top, slower + larger at bottom. Locality makes the hierarchy work.</text>
</svg>
