<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="700" fill="#0e1726"/>
  <text x="550" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#e6edf3">AMD Ryzen AI Max (Strix Halo) for Local AI - 2026 Picks</text>
  <text x="550" y="72" text-anchor="middle" font-size="14" fill="#8b949e">Decode tok/s from community llama.cpp / LM Studio runs - every number is sourced in the post</text>

  <!-- Tier 1 -->
  <rect x="30" y="95" width="520" height="270" rx="10" fill="#16283f" stroke="#2a4a73" stroke-width="1.5"/>
  <text x="50" y="125" font-size="17" font-weight="bold" fill="#79c0ff">TIER 1 - 64GB STARTER</text>
  <text x="50" y="150" font-size="14" fill="#e6edf3">Framework Desktop 64GB: $1,959 | GMKtec EVO-X2 64GB: $2,199</text>
  <text x="50" y="182" font-size="14" fill="#7ee787">Qwen3-30B-A3B (MoE, 3B active): 86-100 tok/s</text>
  <text x="50" y="207" font-size="14" fill="#7ee787">gpt-oss-20b: 58 tok/s (LM Studio, Framework)</text>
  <text x="50" y="232" font-size="14" fill="#7ee787">LFM2.5-8B dense: 152 tok/s</text>
  <text x="50" y="257" font-size="14" fill="#ffa657">Dense 32B Q4: ~10 tok/s (256 GB/s wall)</text>
  <text x="50" y="282" font-size="13" fill="#8b949e">Best for: fast small MoE chat + coding agents</text>
  <text x="50" y="340" font-size="12" fill="#8b949e">64GB will not hold gpt-oss-120b (63.4 GB of weights)</text>

  <!-- Tier 2 -->
  <rect x="550" y="95" width="520" height="270" rx="10" fill="#16283f" stroke="#2a4a73" stroke-width="1.5"/>
  <text x="570" y="125" font-size="17" font-weight="bold" fill="#7ee787">TIER 2 - 128GB SWEET SPOT</text>
  <text x="570" y="150" font-size="14" fill="#e6edf3">Framework $3,449 | BOSGAME M5 $3,499 | GMKtec $3,649</text>
  <text x="570" y="182" font-size="14" fill="#7ee787">gpt-oss-120b MXFP4 (63.4 GB): 53-56 tok/s</text>
  <text x="570" y="207" font-size="14" fill="#7ee787">Qwen3.8 Flash-Next ~125B MoE: 38-45 tok/s (MTP)</text>
  <text x="570" y="232" font-size="14" fill="#7ee787">Qwen3-Coder-Next 80B-A3B: 42.7 tok/s</text>
  <text x="570" y="257" font-size="14" fill="#ffa657">Llama 4 Scout 109B: 13.8 | GLM-5.3-Flash: 14.6 (ROCm)</text>
  <text x="570" y="282" font-size="14" fill="#ff7b72">Dense 70B Q4_K_M: 5.1 tok/s</text>
  <text x="570" y="340" font-size="12" fill="#8b949e">96 GB VRAM-allocatable on Windows, ~115 GB on Linux</text>

  <!-- Tier 3 -->
  <rect x="30" y="385" width="520" height="270" rx="10" fill="#16283f" stroke="#2a4a73" stroke-width="1.5"/>
  <text x="50" y="415" font-size="17" font-weight="bold" fill="#ffa657">TIER 3 - TWO BOXES VIA USB4 / 10GbE RPC</text>
  <text x="50" y="440" font-size="14" fill="#e6edf3">llama.cpp RPC over USB4: ~9.4 Gbps measured</text>
  <text x="50" y="472" font-size="14" fill="#7ee787">MiniMax M2.5-REAP 228.7B Q3 (2-host): 15.4 tok/s</text>
  <text x="50" y="497" font-size="14" fill="#7ee787">Qwen3.5-397B (2-host): ~12 tok/s</text>
  <text x="50" y="522" font-size="14" fill="#ffa657">Minisforum MS-S1 MAX: dual 10GbE + PCIe x16, $3,799</text>
  <text x="50" y="547" font-size="13" fill="#8b949e">ROCm 7.x wins prompt processing; AMDVLK wins decode</text>
  <text x="50" y="630" font-size="12" fill="#8b949e">Rackmount 2U clusters supported (MS-S1 MAX)</text>

  <!-- Tier 4 -->
  <rect x="550" y="385" width="520" height="270" rx="10" fill="#16283f" stroke="#2a4a73" stroke-width="1.5"/>
  <text x="570" y="415" font-size="17" font-weight="bold" fill="#ff7b72">TIER 4 - HYBRID MAC + AMD CLUSTERS</text>
  <text x="570" y="440" font-size="14" fill="#e6edf3">llama.cpp RPC mixes hosts of any vendor</text>
  <text x="570" y="472" font-size="14" fill="#7ee787">Strix Halo + Mac M5 Max: GLM-5.3 321B @ 24 tok/s</text>
  <text x="570" y="497" font-size="14" fill="#7ee787">6-8 boxes reach 700B-class MoE models</text>
  <text x="570" y="522" font-size="14" fill="#d2a8ff">AMD claim: 1.7x tokens-per-dollar vs DGX Spark</text>
  <text x="570" y="547" font-size="14" fill="#d2a8ff">gpt-oss-120b ~10x faster than Llama 3 70B on Max+ 395</text>
  <text x="570" y="630" font-size="12" fill="#8b949e">See our Mac Studio deep dive for the M5 side of the link</text>

  <text x="550" y="682" text-anchor="middle" font-size="12" fill="#8b949e">Sources: amd.com - frame.work - github.com/visorcraft/strix-halo-llm-perf - llamaperf.com - llmrun.dev (full links in post)</text>
</svg>
