<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="700" fill="#0e1726"/>
  <text x="550" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#e6edf3">Ryzen AI Max Memory Tiers - What Runs Where (2026)</text>
  <text x="550" y="70" text-anchor="middle" font-size="14" fill="#8b949e">256-bit LPDDR5X-8000 = 256 GB/s shared memory - decode speed scales with active params, not total size</text>

  <!-- Row 1: 32GB -->
  <rect x="30" y="95" width="1040" height="100" rx="10" fill="#16283f" stroke="#2a4a73" stroke-width="1.5"/>
  <rect x="45" y="110" width="220" height="70" rx="8" fill="#0e1726" stroke="#79c0ff"/>
  <text x="155" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#79c0ff">32GB</text>
  <text x="155" y="160" text-anchor="middle" font-size="12" fill="#8b949e">Max 385, 32 CU 8050S</text>
  <text x="290" y="130" font-size="14" fill="#7ee787">8B-14B dense models run fast (LFM2.5-8B: 152 tok/s on 128GB sibling)</text>
  <text x="290" y="155" font-size="14" fill="#ffa657">gpt-oss-20b Q4 fits tight (~12 GB of weights)</text>
  <text x="290" y="180" font-size="13" fill="#8b949e">Entry tier $1,269 at Framework (often out of stock)</text>

  <!-- Row 2: 64GB -->
  <rect x="30" y="210" width="1040" height="115" rx="10" fill="#16283f" stroke="#2a4a73" stroke-width="1.5"/>
  <rect x="45" y="225" width="220" height="85" rx="8" fill="#0e1726" stroke="#7ee787"/>
  <text x="155" y="255" text-anchor="middle" font-size="15" font-weight="bold" fill="#7ee787">64GB</text>
  <text x="155" y="277" text-anchor="middle" font-size="12" fill="#8b949e">Max+ 395, 40 CU 8060S</text>
  <text x="290" y="245" font-size="14" fill="#7ee787">Qwen3-30B-A3B: 86-100 tok/s | Qwen3-Coder-30B: ~97 tok/s</text>
  <text x="290" y="270" font-size="14" fill="#ffa657">Dense 32B Q4: ~10 tok/s | gpt-oss-20b: 58 tok/s</text>
  <text x="290" y="295" font-size="14" fill="#ff7b72">gpt-oss-120b DOES NOT FIT (63.4 GB of MXFP4 weights)</text>
  <text x="290" y="317" font-size="13" fill="#8b949e">Framework $1,959 | GMKtec EVO-X2 $2,199</text>

  <!-- Row 3: 128GB -->
  <rect x="30" y="340" width="1040" height="195" rx="10" fill="#16283f" stroke="#2a4a73" stroke-width="1.5"/>
  <rect x="45" y="355" width="220" height="165" rx="8" fill="#0e1726" stroke="#ffa657"/>
  <text x="155" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffa657">128GB</text>
  <text x="155" y="412" text-anchor="middle" font-size="12" fill="#8b949e">Max+ 395 sweet spot</text>
  <text x="155" y="434" text-anchor="middle" font-size="12" fill="#8b949e">96GB VRAM (Win)</text>
  <text x="155" y="454" text-anchor="middle" font-size="12" fill="#8b949e">~115GB GTT (Linux)</text>
  <text x="155" y="474" text-anchor="middle" font-size="12" fill="#8b949e">45-120W cTDP</text>
  <text x="290" y="372" font-size="14" fill="#7ee787">gpt-oss-120b: 53-56 tok/s | Heretic2 92GB IQ4_XS: 24 tok/s</text>
  <text x="290" y="397" font-size="14" fill="#7ee787">Qwen3.8 Flash-Next ~125B: 38-45 tok/s | Qwen3-Coder-Next 80B: 42.7</text>
  <text x="290" y="422" font-size="14" fill="#7ee787">Qwen3.6 35B Q6: 50 tok/s | MiniMax M2.5 228.7B Q3: 32.8 (1 box)</text>
  <text x="290" y="447" font-size="14" fill="#ffa657">Qwen3-235B-A22B Q3: 17.2 | Llama 4 Scout 109B: 13.8</text>
  <text x="290" y="472" font-size="14" fill="#ffa657">GLM-5.3-Flash: 14.6 ROCm / 8.6 Vulkan | MLPerf Atlas NVFP4: 20.6</text>
  <text x="290" y="497" font-size="14" fill="#ff7b72">Dense 70B Q4_K_M: 5.1 | DeepSeek V4.1 Flash Q2: 7.1 (SSD streaming)</text>
  <text x="290" y="522" font-size="13" fill="#8b949e">Framework $3,449 | BOSGAME $3,499 | GMKtec $3,649 | AMD Halo $4,699</text>

  <!-- Row 4: clusters -->
  <rect x="30" y="550" width="1040" height="100" rx="10" fill="#16283f" stroke="#2a4a73" stroke-width="1.5"/>
  <rect x="45" y="565" width="220" height="70" rx="8" fill="#0e1726" stroke="#ff7b72"/>
  <text x="155" y="593" text-anchor="middle" font-size="15" font-weight="bold" fill="#ff7b72">2-8 BOXES</text>
  <text x="155" y="615" text-anchor="middle" font-size="12" fill="#8b949e">llama.cpp RPC clusters</text>
  <text x="290" y="585" font-size="14" fill="#7ee787">MiniMax M2.5-REAP 2-host: 15.4 tok/s | Qwen3.5-397B 2-host: ~12</text>
  <text x="290" y="610" font-size="14" fill="#7ee787">Strix Halo + Mac M5 Max: GLM-5.3 321B @ 24 tok/s</text>
  <text x="290" y="635" font-size="13" fill="#8b949e">USB4 ~9.4 Gbps per link; dual 10GbE on MS-S1 MAX for rack builds</text>

  <text x="550" y="684" text-anchor="middle" font-size="12" fill="#8b949e">Sources: amd.com - frame.work - github.com/visorcraft/strix-halo-llm-perf - llamaperf.com - seehiong.github.io (full links in post)</text>
</svg>
