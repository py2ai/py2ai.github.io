<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .box-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing: 0.4px; }
  .node-title { font-size: 13px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 13px; font-weight: 700; fill: #ffffff; }
  .sub { font-size: 10.5px; font-weight: 400; fill: #475569; }
  .sub-w { font-size: 10px; font-weight: 400; fill: #e0e7ff; }
  .edge { font-size: 10.5px; font-weight: 600; fill: #1e40af; }
  .bad { font-size: 11px; font-weight: 600; fill: #b91c1c; }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; fill: #0f172a; }
</style>
<defs>
  <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow2-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="540" fill="#ffffff"/>
<text x="430" y="34" text-anchor="middle" class="title">The 100 percent local JEV stack</text>

<rect x="30" y="58" width="640" height="460" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/>
<text x="52" y="84" class="box-label">YOUR MACHINE - NOTHING LEAVES THIS BOX</text>

<rect x="60" y="104" width="180" height="66" rx="8" fill="#2563eb"/>
<text x="150" y="128" text-anchor="middle" class="node-title-w">Browser UI</text>
<text x="150" y="145" text-anchor="middle" class="sub-w">local web app or CLI</text>
<text x="150" y="159" text-anchor="middle" class="sub-w">chat, tickets, files in</text>

<rect x="300" y="104" width="180" height="66" rx="8" fill="#2563eb"/>
<text x="390" y="128" text-anchor="middle" class="node-title-w">Scheduled jobs</text>
<text x="390" y="145" text-anchor="middle" class="sub-w">cron, webhooks, folder watch</text>
<text x="390" y="159" text-anchor="middle" class="sub-w">inbox triage every morning</text>

<rect x="540" y="104" width="110" height="66" rx="8" fill="#1e40af"/>
<text x="595" y="128" text-anchor="middle" class="node-title-w">MCP client</text>
<text x="595" y="145" text-anchor="middle" class="sub-w">agents and editors</text>
<text x="595" y="159" text-anchor="middle" class="sub-w">via laya[mcp]</text>

<rect x="170" y="210" width="340" height="62" rx="8" fill="#0f172a"/>
<text x="340" y="234" text-anchor="middle" class="node-title-w">Gateway (FastAPI, one file)</text>
<text x="340" y="252" text-anchor="middle" class="sub-w">asks typed questions, reads probabilities, picks a lane</text>

<rect x="60" y="316" width="230" height="92" rx="8" fill="#1e40af"/>
<text x="175" y="340" text-anchor="middle" class="node-title-w">Laya decision engine</text>
<text x="175" y="357" text-anchor="middle" class="sub-w">421M or 322M params, sub-35 ms</text>
<text x="175" y="372" text-anchor="middle" class="sub-w">guard / route / score / gate</text>
<text x="175" y="388" text-anchor="middle" class="mono">choice - score - noul</text>

<rect x="310" y="316" width="230" height="92" rx="8" fill="#2563eb"/>
<text x="425" y="340" text-anchor="middle" class="node-title-w">Ollama chat model</text>
<text x="425" y="357" text-anchor="middle" class="sub-w">writes the actual reply</text>
<text x="425" y="372" text-anchor="middle" class="sub-w">runs only when a lane needs it</text>
<text x="425" y="388" text-anchor="middle" class="mono">localhost:11434</text>

<rect x="60" y="440" width="150" height="60" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="135" y="461" text-anchor="middle" class="node-title">Your tools</text>
<text x="135" y="477" text-anchor="middle" class="sub">files, search, scripts</text>
<text x="135" y="491" text-anchor="middle" class="sub">gated before running</text>

<rect x="230" y="440" width="150" height="60" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="305" y="461" text-anchor="middle" class="node-title">Decision log</text>
<text x="305" y="477" text-anchor="middle" class="sub">SQLite: every answer,</text>
<text x="305" y="491" text-anchor="middle" class="sub">probability, and lane</text>

<rect x="400" y="440" width="250" height="60" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="525" y="461" text-anchor="middle" class="node-title">Model weights on disk</text>
<text x="525" y="477" text-anchor="middle" class="sub">checkpoints download once,</text>
<text x="525" y="491" text-anchor="middle" class="sub">then work fully offline</text>

<line x1="150" y1="170" x2="260" y2="206" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow2)"/>
<line x1="390" y1="170" x2="360" y2="206" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow2)"/>
<line x1="595" y1="170" x2="430" y2="206" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow2)"/>
<line x1="300" y1="272" x2="185" y2="312" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow2-accent)"/>
<text x="212" y="295" class="edge">typed questions</text>
<line x1="390" y1="272" x2="415" y2="312" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow2)"/>
<text x="402" y="295" class="edge">chat lane</text>
<line x1="175" y1="408" x2="140" y2="436" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow2)"/>
<line x1="175" y1="408" x2="295" y2="436" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow2)"/>

<rect x="690" y="150" width="140" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="6 4"/>
<text x="760" y="180" text-anchor="middle" class="bad">Hosted classifier</text>
<text x="760" y="200" text-anchor="middle" class="sub">your raw state goes</text>
<text x="760" y="215" text-anchor="middle" class="sub">to someone else's</text>
<text x="760" y="230" text-anchor="middle" class="sub">server for judgment</text>
<text x="760" y="252" text-anchor="middle" class="bad">avoided</text>
<line x1="670" y1="241" x2="686" y2="231" stroke="#dc2626" stroke-width="1.6"/>
<text x="760" y="300" text-anchor="middle" class="sub">even a privacy check</text>
<text x="760" y="315" text-anchor="middle" class="sub">leaks if it runs in the cloud</text>
</svg>
