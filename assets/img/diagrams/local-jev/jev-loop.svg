<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .step-num { font-size: 12px; font-weight: 700; fill: #ffffff; }
  .node-title { font-size: 13px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 13px; font-weight: 700; fill: #ffffff; }
  .sub { font-size: 10.5px; font-weight: 400; fill: #475569; }
  .sub-w { font-size: 10px; font-weight: 400; fill: #e0e7ff; }
  .edge { font-size: 10.5px; font-weight: 600; fill: #1e40af; }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; fill: #0f172a; }
</style>
<defs>
  <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow3-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="430" y="34" text-anchor="middle" class="title">Agent loop with typed gates: every branch is a measured decision</text>

<circle cx="70" cy="130" r="17" fill="#1e40af"/>
<text x="70" y="134" text-anchor="middle" class="step-num">1</text>
<rect x="30" y="158" width="170" height="70" rx="8" fill="#2563eb"/>
<text x="115" y="181" text-anchor="middle" class="node-title-w">State arrives</text>
<text x="115" y="198" text-anchor="middle" class="sub-w">message, email, or JSON</text>
<text x="115" y="212" text-anchor="middle" class="sub-w">never leaves the machine</text>

<circle cx="290" cy="130" r="17" fill="#1e40af"/>
<text x="290" y="134" text-anchor="middle" class="step-num">2</text>
<rect x="210" y="158" width="170" height="70" rx="8" fill="#0f172a"/>
<text x="295" y="181" text-anchor="middle" class="node-title-w">Guard gate (noul)</text>
<text x="295" y="198" text-anchor="middle" class="sub-w">private or confidential data?</text>
<text x="295" y="212" text-anchor="middle" class="sub-w">low confidence = stay local</text>

<circle cx="490" cy="130" r="17" fill="#1e40af"/>
<text x="490" y="134" text-anchor="middle" class="step-num">3</text>
<rect x="410" y="158" width="170" height="70" rx="8" fill="#0f172a"/>
<text x="495" y="181" text-anchor="middle" class="node-title-w">Route gate (choice)</text>
<text x="495" y="198" text-anchor="middle" class="sub-w">chat, task, reasoning?</text>
<text x="495" y="212" text-anchor="middle" class="sub-w">one call asks every question</text>

<circle cx="700" cy="130" r="17" fill="#1e40af"/>
<text x="700" y="134" text-anchor="middle" class="step-num">4</text>
<rect x="620" y="158" width="210" height="70" rx="8" fill="#0f172a"/>
<text x="725" y="181" text-anchor="middle" class="node-title-w">Tool gate (choice)</text>
<text x="725" y="198" text-anchor="middle" class="sub-w">allow / approve / block</text>
<text x="725" y="212" text-anchor="middle" class="sub-w">checked before anything runs</text>

<rect x="30" y="272" width="200" height="66" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="130" y="294" text-anchor="middle" class="node-title">Chat lane</text>
<text x="130" y="311" text-anchor="middle" class="sub">small local model answers</text>
<text x="130" y="325" text-anchor="middle" class="sub">cheap questions directly</text>

<rect x="250" y="272" width="200" height="66" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="350" y="294" text-anchor="middle" class="node-title">Reasoning lane</text>
<text x="350" y="311" text-anchor="middle" class="sub">bigger model, more thinking</text>
<text x="350" y="325" text-anchor="middle" class="sub">budgeted by the urgency score</text>

<rect x="470" y="272" width="200" height="66" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="570" y="294" text-anchor="middle" class="node-title">Tool lane</text>
<text x="570" y="311" text-anchor="middle" class="sub">files, search, scripts run</text>
<text x="570" y="325" text-anchor="middle" class="sub">only after gate 4 allows</text>

<rect x="690" y="272" width="140" height="66" rx="8" fill="#1e40af"/>
<text x="760" y="294" text-anchor="middle" class="node-title-w">Answer + log</text>
<text x="760" y="311" text-anchor="middle" class="sub-w">every decision, probability,</text>
<text x="760" y="325" text-anchor="middle" class="sub-w">and lane written to SQLite</text>

<line x1="115" y1="158" x2="115" y2="138" stroke="#475569" stroke-width="1.4"/>
<line x1="200" y1="193" x2="206" y2="193" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow3-accent)"/>
<line x1="380" y1="193" x2="406" y2="193" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow3-accent)"/>
<line x1="580" y1="193" x2="616" y2="193" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow3-accent)"/>
<line x1="725" y1="228" x2="640" y2="268" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow3)"/>
<line x1="660" y1="228" x2="570" y2="268" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow3)"/>
<line x1="540" y1="228" x2="380" y2="268" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow3)"/>
<line x1="480" y1="228" x2="160" y2="268" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow3)"/>
<line x1="115" y1="158" x2="115" y2="140" stroke="#475569" stroke-width="1.4"/>
<line x1="210" y1="180" x2="204" y2="180" stroke="#475569" stroke-width="1.4"/>

<path d="M 760 272 L 760 250 Q 760 242 752 242 L 500 242 Q 492 242 492 234 L 492 232" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow3)"/>
<text x="620" y="238" text-anchor="middle" class="edge">retry or escalate on low confidence</text>

<rect x="30" y="368" width="800" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="430" y="386" text-anchor="middle" class="sub">The LLM is only invoked in a lane, for a lane-shaped task. Everything else - gating, routing, urgency, tool permission -</text>
<text x="430" y="401" text-anchor="middle" class="sub">is answered by the decision engine in a single forward pass, with probabilities your code can act on.</text>
</svg>
