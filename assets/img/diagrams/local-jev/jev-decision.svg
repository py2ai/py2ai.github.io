<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .col-label { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .node-title { font-size: 13px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 13px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 11.5px; font-weight: 400; fill: #0f172a; }
  .sub { font-size: 10.5px; font-weight: 400; fill: #475569; }
  .prim-name { font-size: 13px; font-weight: 700; fill: #ffffff; }
  .prim-sub { font-size: 10.5px; font-weight: 400; fill: #e0e7ff; }
  .edge { font-size: 10.5px; font-weight: 400; fill: #475569; }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; fill: #0f172a; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="430" y="34" text-anchor="middle" class="title">Generation versus decision: where a System One model fits</text>

<rect x="40" y="58" width="380" height="30" rx="6" fill="#1e40af"/>
<text x="230" y="78" text-anchor="middle" class="col-label">System Two: a generative LLM</text>
<rect x="40" y="98" width="380" height="262" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>

<rect x="60" y="116" width="150" height="52" rx="8" fill="#2563eb"/>
<text x="135" y="138" text-anchor="middle" class="node-title-w">Input state</text>
<text x="135" y="155" text-anchor="middle" font-size="10" fill="#e0e7ff" font-family="inherit">ticket, email, JSON</text>
<rect x="250" y="116" width="150" height="52" rx="8" fill="#334155"/>
<text x="325" y="138" text-anchor="middle" class="node-title-w">Token by token</text>
<text x="325" y="155" text-anchor="middle" font-size="10" fill="#cbd5e1" font-family="inherit">one output conditions the next</text>
<line x1="210" y1="142" x2="246" y2="142" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60" y="196" width="340" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="230" y="216" text-anchor="middle" class="node-title">Free-form text output</text>
<text x="230" y="234" text-anchor="middle" class="sub">"Sure! Here is the JSON you asked for..."</text>
<line x1="325" y1="168" x2="280" y2="192" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60" y="276" width="160" height="60" rx="8" fill="#fef2f2" stroke="#dc2626"/>
<text x="140" y="297" text-anchor="middle" class="node-title">Parse and pray</text>
<text x="140" y="313" text-anchor="middle" class="sub">regex / JSON repair</text>
<text x="140" y="327" text-anchor="middle" class="sub">can hallucinate a label</text>
<rect x="240" y="276" width="160" height="60" rx="8" fill="#fef2f2" stroke="#dc2626"/>
<text x="320" y="297" text-anchor="middle" class="node-title">Slow and billed</text>
<text x="320" y="313" text-anchor="middle" class="sub">seconds per decision</text>
<text x="320" y="327" text-anchor="middle" class="sub">output tokens cost money</text>
<line x1="230" y1="248" x2="160" y2="272" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="230" y1="248" x2="300" y2="272" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

<rect x="440" y="58" width="380" height="30" rx="6" fill="#2563eb"/>
<text x="630" y="78" text-anchor="middle" class="col-label">System One: Jev-style decision model</text>
<rect x="440" y="98" width="380" height="262" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>

<rect x="460" y="116" width="150" height="52" rx="8" fill="#2563eb"/>
<text x="535" y="138" text-anchor="middle" class="node-title-w">Input state</text>
<text x="535" y="155" text-anchor="middle" font-size="10" fill="#e0e7ff" font-family="inherit">same ticket, same JSON</text>
<rect x="650" y="116" width="150" height="52" rx="8" fill="#1e40af"/>
<text x="725" y="138" text-anchor="middle" class="node-title-w">One forward pass</text>
<text x="725" y="155" text-anchor="middle" font-size="10" fill="#e0e7ff" font-family="inherit">all questions in parallel</text>
<line x1="610" y1="142" x2="646" y2="142" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
<rect x="460" y="196" width="340" height="52" rx="8" fill="#ffffff" stroke="#2563eb"/>
<text x="630" y="216" text-anchor="middle" class="node-title">Typed answers, no strings</text>
<text x="630" y="234" text-anchor="middle" class="mono">choice + score + noul, with probabilities</text>
<line x1="725" y1="168" x2="680" y2="192" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
<rect x="460" y="276" width="160" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="540" y="297" text-anchor="middle" class="node-title">Code branches</text>
<text x="540" y="313" text-anchor="middle" class="sub">if answer == "billing":</text>
<text x="540" y="327" text-anchor="middle" class="sub">calibrated confidence</text>
<rect x="640" y="276" width="160" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="720" y="297" text-anchor="middle" class="node-title">Fast and tiny</text>
<text x="720" y="313" text-anchor="middle" class="sub">tens of ms per decision</text>
<text x="720" y="327" text-anchor="middle" class="sub">hundreds of MB of weights</text>
<line x1="630" y1="248" x2="560" y2="272" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
<line x1="630" y1="248" x2="700" y2="272" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-accent)"/>

<rect x="40" y="372" width="250" height="44" rx="8" fill="#1e40af"/>
<text x="165" y="390" text-anchor="middle" class="prim-name">choice</text>
<text x="165" y="406" text-anchor="middle" class="prim-sub">pick one label from your named options</text>
<rect x="305" y="372" width="250" height="44" rx="8" fill="#2563eb"/>
<text x="430" y="390" text-anchor="middle" class="prim-name">score</text>
<text x="430" y="406" text-anchor="middle" class="prim-sub">rate against an ordered scale you define</text>
<rect x="570" y="372" width="250" height="44" rx="8" fill="#0f172a"/>
<text x="695" y="390" text-anchor="middle" class="prim-name">noul</text>
<text x="695" y="406" text-anchor="middle" class="prim-sub">probability that a yes/no question holds</text>
</svg>
