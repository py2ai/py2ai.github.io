        <circle cx="240" cy="200" r="60"/>
        <circle cx="140" cy="160" r="75"/>
        <circle cx="220" cy="150" r="65"/>
        <circle cx="80" cy="180" r="50"/>
        <circle cx="180" cy="100" r="70"/>
        <circle cx="260" cy="130" r="45"/>
        <circle cx="40" cy="150" r="40"/>
        <circle cx="280" cy="100" r="35"/>
