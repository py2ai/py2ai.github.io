        <circle cx="200" cy="140" r="50"/>
        <circle cx="140" cy="120" r="45"/>
        <circle cx="260" cy="160" r="30"/>
        <circle cx="60" cy="170" r="30"/>
        <circle cx="220" cy="120" r="35"/>
