      <circle cx="3" cy="-2" r="4" fill="#FFC0D0"/>
      <circle cx="2" cy="3" r="4" fill="#FFB6C1"/>
      <circle cx="-2" cy="3" r="4" fill="#FFC0CB"/>
      <circle cx="-3" cy="-2" r="4" fill="#FFB6C1"/>
