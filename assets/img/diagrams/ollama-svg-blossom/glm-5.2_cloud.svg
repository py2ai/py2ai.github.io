    <use href="#bl" x="684" y="322" width="17" height="17"/>
    <use href="#bl" x="716" y="322" width="18" height="18"/>
    <use href="#bd" x="676" y="326" width="14" height="14"/>
    <use href="#bl" x="690" y="310" width="14" height="14"/>
