  <ellipse cx="600" cy="528" rx="105" ry="12" fill="#1f2a18" opacity="0.4"/>
  <ellipse cx="410" cy="492" rx="55" ry="8" fill="#1f2a18" opacity="0.35"/>

  <!-- Back small tree -->
  <g>
