    <use href="#bl" x="312" y="316" width="20" height="20"/>
    <use href="#bl" x="276" y="306" width="18" height="18"/>
    <use href="#bd" x="296" y="296" width="16" height="16"/>
    <use href="#bl" x="322" y="306" width="18" height="18"/>
