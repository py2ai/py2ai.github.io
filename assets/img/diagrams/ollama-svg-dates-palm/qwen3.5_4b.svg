    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="0%" y2="1%">
      <stop offset="0%" style="stop-color:#e9c478; stop-opacity:1" />
      <stop offset="50%" style="stop-color:cdbf6a; stop-opacity:1" /> /* darker */
    </linearGradient> 
  </defs>
  <!-- Groups for layering -->
