  <!-- Group B: Tree Trunk (Curved Slightly right) -->
 <path id="trunkMainPath" fill="#8B6914" stroke="#F2E6A6" stroke-width="5" />
   <animate attributeName="stroke-opacity"dur="0.2s"/>
 </g>
