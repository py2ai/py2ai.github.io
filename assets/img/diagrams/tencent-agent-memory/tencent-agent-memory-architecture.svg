<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="auto" viewBox="0 0 900 680" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#5568d3"/>
    </linearGradient>
    <linearGradient id="proxyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">TencentDB Agent Memory — Three-Tier Architecture</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#64748b">Team-level memory hub for AI agents</text>

  <!-- Layer 1: Agents (top row) -->
  <g filter="url(#shadow)">
    <rect x="50" y="90" width="220" height="80" rx="12" fill="url(#agentGrad)"/>
    <text x="160" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Claude Code</text>
    <text x="160" y="144" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">Coding Agent</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="340" y="90" width="220" height="80" rx="12" fill="url(#agentGrad)"/>
    <text x="450" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="white">CodeBuddy</text>
    <text x="450" y="144" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">Tencent Coding Agent</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="630" y="90" width="220" height="80" rx="12" fill="url(#agentGrad)"/>
    <text x="740" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Any MCP Agent</text>
    <text x="740" y="144" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">MCP-compatible</text>
  </g>

  <!-- Arrows from agents to proxy -->
  <line x1="160" y1="170" x2="160" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="170" x2="450" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="740" y1="170" x2="740" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Layer 2: memory-proxy -->
  <g filter="url(#shadow)">
    <rect x="50" y="230" width="800" height="90" rx="14" fill="url(#proxyGrad)"/>
    <text x="450" y="266" text-anchor="middle" font-size="18" font-weight="bold" fill="white">memory-proxy</text>
    <text x="450" y="290" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.9)">Integration Bridge / MCP Server — protocol translation, authentication, API gateway</text>
    <text x="450" y="308" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.75)">REST API · MCP Protocol · Context Capture &amp; Recall</text>
  </g>

  <!-- Arrow proxy → hub -->
  <line x1="450" y1="320" x2="450" y2="370" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Layer 3: memory-hub -->
  <g filter="url(#shadow)">
    <rect x="50" y="380" width="800" height="90" rx="14" fill="url(#hubGrad)"/>
    <text x="450" y="416" text-anchor="middle" font-size="18" font-weight="bold" fill="white">memory-hub</text>
    <text x="450" y="440" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.9)">Team Memory Hub / Collaboration Layer — shared memory pool across agents</text>
    <text x="450" y="458" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.75)">Team Namespaces · Permission Management · Real-time Sync</text>
  </g>

  <!-- Arrow hub → core -->
  <line x1="450" y1="470" x2="450" y2="520" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Layer 4: memory-core -->
  <g filter="url(#shadow)">
    <rect x="50" y="530" width="800" height="90" rx="14" fill="url(#coreGrad)"/>
    <text x="450" y="566" text-anchor="middle" font-size="18" font-weight="bold" fill="white">memory-core</text>
    <text x="450" y="590" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.9)">Memory Engine / Storage &amp; Retrieval — persistent, indexed, semantically searchable</text>
    <text x="450" y="608" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.75)">Conversations · Documents · Decisions · Workflows</text>
  </g>

  <!-- Side annotations -->
  <text x="870" y="275" text-anchor="end" font-size="10" fill="#94a3b8" font-style="italic">Protocol</text>
  <text x="870" y="425" text-anchor="end" font-size="10" fill="#94a3b8" font-style="italic">Collaboration</text>
  <text x="870" y="575" text-anchor="end" font-size="10" fill="#94a3b8" font-style="italic">Storage</text>

  <!-- Footer -->
  <text x="450" y="655" text-anchor="middle" font-size="11" fill="#94a3b8">Data flows top-down: agents → proxy (integration) → hub (team sharing) → core (persistent storage)</text>
</svg>
