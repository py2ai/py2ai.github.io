<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1120" font-family="Inter, system-ui, -apple-system, sans-serif">
<style>
  text { fill: #1e293b; }
  .title { font-size:20px; font-weight:700; fill:#1e293b; }
  .section { font-size:15px; font-weight:700; }
  .label { font-size:12px; font-weight:600; fill:#1e293b; }
  .small { font-size:10px; fill:#64748b; }
  .annot { font-size:9px; fill:#94a3b8; }
  .formula { font-size:11px; font-family:JetBrains Mono, Fira Code, monospace; fill:#1e293b; }
  .vram-label { font-size:11px; font-weight:600; }
</style>
<defs>
  <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/></filter>
</defs>
<rect width="1200" height="1120" fill="#ffffff"/>
<text x="600" y="30" text-anchor="middle" class="title">KV-Cache and GPU VRAM: The Memory Anatomy of LLM Decode</text>
<text x="600" y="48" text-anchor="middle" class="small">Why decode is memory-bandwidth-bound: every token requires loading the entire KV cache from VRAM</text>

<text x="40" y="82" class="section" fill="#dc2626">1. GPU VRAM Allocation (NVIDIA A100 40GB)</text>
<rect x="60" y="100" width="160" height="273" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
<text x="140" y="228" text-anchor="middle" class="vram-label" fill="#ffffff">Model Weights</text>
<text x="140" y="244" text-anchor="middle" class="small" fill="#cbd5e1">26 GB (65%)</text>
<text x="140" y="258" text-anchor="middle" class="annot" fill="#94a3b8">13B params x 2 bytes</text>
<rect x="60" y="373" width="160" height="126" fill="#059669" stroke="#047857" stroke-width="1"/>
<text x="140" y="424" text-anchor="middle" class="vram-label" fill="#ffffff">KV Cache</text>
<text x="140" y="440" text-anchor="middle" class="small" fill="#d1fae5">12 GB (30%)</text>
<text x="140" y="454" text-anchor="middle" class="annot" fill="#a7f3d0">Grows with context</text>
<rect x="60" y="499" width="160" height="21" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
<text x="228" y="513" class="small" fill="#92400e">Activations ~2GB (5%)</text>
<rect x="60" y="100" width="160" height="420" rx="4" fill="none" stroke="#0f172a" stroke-width="2"/>
<text x="140" y="540" text-anchor="middle" class="label">40 GB VRAM (HBM2e)</text>
<text x="140" y="554" text-anchor="middle" class="annot">1.55 TB/s bandwidth</text>
<line x1="228" y1="140" x2="246" y2="140" stroke="#94a3b8" stroke-width="1"/>
<text x="252" y="124" class="label" fill="#1e293b">Static (never changes)</text>
<text x="252" y="138" class="small">Loaded once at startup</text>
<text x="252" y="152" class="small">Same for every request</text>
<line x1="228" y1="436" x2="246" y2="436" stroke="#059669" stroke-width="1"/>
<text x="252" y="424" class="label" fill="#059669">Dynamic (grows every token)</text>
<text x="252" y="438" class="small">Allocated per request</text>
<text x="252" y="452" class="small">Freed when request ends</text>
<text x="252" y="466" class="small">= the decode bottleneck</text>

<text x="460" y="82" class="section" fill="#059669">2. KV-Cache Structure (Per Transformer Layer)</text>
<rect x="460" y="100" width="360" height="72" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<text x="640" y="118" text-anchor="middle" class="label" fill="#059669">Transformer Layer i (of N layers)</text>
<rect x="476" y="128" width="60" height="32" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
<text x="506" y="142" text-anchor="middle" class="small" font-weight="600">K heads</text>
<text x="506" y="154" text-anchor="middle" class="annot">[H x D]</text>
<rect x="548" y="128" width="60" height="32" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
<text x="578" y="142" text-anchor="middle" class="small" font-weight="600">V heads</text>
<text x="578" y="154" text-anchor="middle" class="annot">[H x D]</text>
<text x="620" y="134" class="small">x seq_len tokens</text>
<text x="620" y="148" class="annot">(all cached tokens)</text>
<text x="620" y="162" class="annot">grows +1 each step</text>
<line x1="640" y1="172" x2="640" y2="192" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="648" y="188" class="annot">repeat N times</text>
<rect x="460" y="196" width="360" height="72" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<text x="640" y="214" text-anchor="middle" class="label" fill="#059669">Transformer Layer i+1</text>
<rect x="476" y="224" width="60" height="32" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
<text x="506" y="238" text-anchor="middle" class="small" font-weight="600">K heads</text>
<text x="506" y="250" text-anchor="middle" class="annot">[H x D]</text>
<rect x="548" y="224" width="60" height="32" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
<text x="578" y="238" text-anchor="middle" class="small" font-weight="600">V heads</text>
<text x="578" y="250" text-anchor="middle" class="annot">[H x D]</text>
<text x="640" y="290" text-anchor="middle" class="annot">. . . (N layers total)</text>
<rect x="460" y="304" width="360" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="472" y="322" class="label" fill="#92400e">KV Cache Size (bytes):</text>
<text x="472" y="340" class="formula">2 * 2 * L * H * D * S</text>
<text x="472" y="356" class="annot">2(K+V) x 2(FP16) x layers x heads x dim x seq_len</text>
<text x="472" y="370" class="annot">Llama-7B: L=32, H=32, D=128 =&gt; 0.5 MB/token</text>
<rect x="850" y="100" width="310" height="130" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<text x="1005" y="120" text-anchor="middle" class="label" fill="#059669">Why Cache K and V?</text>
<text x="862" y="142" class="small">Attention needs K,V of ALL past</text>
<text x="862" y="156" class="small">tokens to compute scores.</text>
<text x="862" y="176" class="small">Recomputing them every step</text>
<text x="862" y="190" class="small">would be O(n^2) wasted compute.</text>
<text x="862" y="210" class="small" font-weight="600" fill="#059669">Caching trades VRAM for speed.</text>

<text x="40" y="600" class="section" fill="#7c3aed">3. Decode Step: Memory Flow per Token</text>
<rect x="40" y="618" width="200" height="84" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<rect x="40" y="618" width="200" height="22" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
<rect x="40" y="632" width="200" height="8" fill="#d1fae5"/>
<text x="140" y="634" text-anchor="middle" class="label" fill="#059669">1. Load KV Cache</text>
<text x="140" y="656" text-anchor="middle" class="small">Read ALL cached K,V</text>
<text x="140" y="670" text-anchor="middle" class="small">from VRAM (HBM)</text>
<text x="140" y="684" text-anchor="middle" class="small">Gigabytes of data</text>
<text x="140" y="697" text-anchor="middle" class="annot" fill="#059669">Memory-bound</text>
<line x1="240" y1="660" x2="264" y2="660" stroke="#64748b" stroke-width="2" marker-end="url(#arr-blue)"/>
<rect x="264" y="618" width="200" height="84" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<rect x="264" y="618" width="200" height="22" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
<rect x="264" y="632" width="200" height="8" fill="#dbeafe"/>
<text x="364" y="634" text-anchor="middle" class="label" fill="#2563eb">2. Compute Q</text>
<text x="364" y="656" text-anchor="middle" class="small">Single token query</text>
<text x="364" y="670" text-anchor="middle" class="small">vector computation</text>
<text x="364" y="684" text-anchor="middle" class="small">Tiny: 1 vector only</text>
<text x="364" y="697" text-anchor="middle" class="annot" fill="#2563eb">Fast</text>
<line x1="464" y1="660" x2="488" y2="660" stroke="#64748b" stroke-width="2" marker-end="url(#arr-blue)"/>
<rect x="488" y="618" width="200" height="84" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<rect x="488" y="618" width="200" height="22" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<rect x="488" y="632" width="200" height="8" fill="#ede9fe"/>
<text x="588" y="634" text-anchor="middle" class="label" fill="#7c3aed">3. Attention</text>
<text x="588" y="656" text-anchor="middle" class="small">Q x K^T = scores</text>
<text x="588" y="670" text-anchor="middle" class="small">softmax(scores) x V</text>
<text x="588" y="684" text-anchor="middle" class="small">= context vector</text>
<text x="588" y="697" text-anchor="middle" class="annot" fill="#7c3aed">Low arithmetic intensity</text>
<line x1="688" y1="660" x2="712" y2="660" stroke="#64748b" stroke-width="2" marker-end="url(#arr-blue)"/>
<rect x="712" y="618" width="200" height="84" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
<rect x="712" y="618" width="200" height="22" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
<rect x="712" y="632" width="200" height="8" fill="#fed7aa"/>
<text x="812" y="634" text-anchor="middle" class="label" fill="#ea580c">4. Append K,V</text>
<text x="812" y="656" text-anchor="middle" class="small">New token K,V</text>
<text x="812" y="670" text-anchor="middle" class="small">appended to cache</text>
<text x="812" y="684" text-anchor="middle" class="small">Cache grows +1</text>
<text x="812" y="697" text-anchor="middle" class="annot" fill="#ea580c">Write to VRAM</text>
<line x1="912" y1="660" x2="936" y2="660" stroke="#64748b" stroke-width="2" marker-end="url(#arr-blue)"/>
<rect x="936" y="618" width="200" height="84" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
<rect x="936" y="618" width="200" height="22" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<rect x="936" y="632" width="200" height="8" fill="#fee2e2"/>
<text x="1036" y="634" text-anchor="middle" class="label" fill="#dc2626">5. Output Logits</text>
<text x="1036" y="656" text-anchor="middle" class="small">Final layer produces</text>
<text x="1036" y="670" text-anchor="middle" class="small">vocab distribution</text>
<text x="1036" y="684" text-anchor="middle" class="small">Sample next token</text>
<text x="1036" y="697" text-anchor="middle" class="annot" fill="#dc2626">Single token</text>
<path d="M 1036 706 L 1036 736 L 140 736 L 140 710" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arr-purple)"/>
<text x="588" y="726" text-anchor="middle" class="small" fill="#7c3aed" font-weight="600">Autoregressive loop: repeat for each output token</text>

<text x="40" y="786" class="section" fill="#dc2626">4. Why Decode is Memory-Bound: Arithmetic Intensity</text>
<rect x="40" y="802" width="260" height="120" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="170" y="822" text-anchor="middle" class="label" fill="#2563eb">Prefill (Prompt Phase)</text>
<text x="52" y="844" class="small">Computation: Matrix x Matrix</text>
<text x="52" y="860" class="small">FLOPs per byte loaded: HIGH</text>
<text x="52" y="876" class="small">GPU cores: 90%+ utilized</text>
<text x="52" y="892" class="small">Bottleneck: Compute (TFLOPS)</text>
<text x="52" y="910" class="annot">Adding tokens = more parallelism</text>
<rect x="320" y="802" width="260" height="120" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="450" y="822" text-anchor="middle" class="label" fill="#dc2626">Decode (Autoregressive)</text>
<text x="332" y="844" class="small">Computation: Matrix x Vector</text>
<text x="332" y="860" class="small">FLOPs per byte loaded: LOW</text>
<text x="332" y="876" class="small">GPU cores: &lt;5% utilized</text>
<text x="332" y="892" class="small">Bottleneck: Memory BW (GB/s)</text>
<text x="332" y="910" class="annot">Adding tokens = more data to load</text>
<rect x="600" y="802" width="260" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="730" y="822" text-anchor="middle" class="label" fill="#92400e">VRAM Bandwidth Limits</text>
<text x="612" y="844" class="small">A100: 1,555 GB/s HBM2e</text>
<text x="612" y="860" class="small">H100: 3,350 GB/s HBM3</text>
<text x="612" y="876" class="small">RTX 4090: 1,008 GB/s GDDR6X</text>
<text x="612" y="892" class="small">CPU DDR5: ~100 GB/s</text>
<text x="612" y="910" class="annot">KV cache must fit + be read each step</text>
<rect x="880" y="802" width="280" height="120" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="1020" y="822" text-anchor="middle" class="label" fill="#7c3aed">Roofline Model</text>
<text x="892" y="844" class="small">Arithmetic intensity = FLOPs / bytes</text>
<text x="892" y="860" class="small">Prefill: ~100 FLOPs/byte</text>
<text x="892" y="876" class="small">Decode: ~1-2 FLOPs/byte</text>
<text x="892" y="892" class="small">Ridge point: ~50-100 FLOPs/byte</text>
<text x="892" y="910" class="annot">Decode is far left of ridge = memory-bound</text>

<text x="40" y="962" class="section" fill="#059669">5. KV-Cache Growth: Why Longer Context = Slower Decode</text>
<text x="40" y="980" class="small">KV cache size for Llama-7B (FP16, batch=1) at different context lengths</text>
<rect x="60" y="1075" width="80" height="3" rx="1" fill="#a7f3d0" stroke="#059669" stroke-width="1"/>
<text x="100" y="1069" text-anchor="middle" class="annot">0.25 GB</text>
<text x="100" y="1094" text-anchor="middle" class="small">512 tok</text>
<rect x="172" y="1072" width="80" height="6" rx="1" fill="#6ee7b7" stroke="#059669" stroke-width="1"/>
<text x="212" y="1066" text-anchor="middle" class="annot">1 GB</text>
<text x="212" y="1094" text-anchor="middle" class="small">2K tok</text>
<rect x="284" y="1067" width="80" height="11" rx="1" fill="#34d399" stroke="#059669" stroke-width="1"/>
<text x="324" y="1061" text-anchor="middle" class="annot">2 GB</text>
<text x="324" y="1094" text-anchor="middle" class="small">4K tok</text>
<rect x="396" y="1056" width="80" height="22" rx="1" fill="#10b981" stroke="#059669" stroke-width="1"/>
<text x="436" y="1050" text-anchor="middle" class="annot">4 GB</text>
<text x="436" y="1094" text-anchor="middle" class="small">8K tok</text>
<rect x="508" y="1034" width="80" height="44" rx="1" fill="#059669" stroke="#059669" stroke-width="1"/>
<text x="548" y="1028" text-anchor="middle" class="annot">8 GB</text>
<text x="548" y="1094" text-anchor="middle" class="small">16K tok</text>
<rect x="620" y="990" width="80" height="88" rx="1" fill="#047857" stroke="#059669" stroke-width="1"/>
<text x="660" y="984" text-anchor="middle" class="annot">16 GB</text>
<text x="660" y="1094" text-anchor="middle" class="small">32K tok</text>
<line x1="50" y1="1078" x2="700" y2="1078" stroke="#64748b" stroke-width="1"/>
<text x="720" y="1010" class="label" fill="#059669">Linear growth!</text>
<text x="720" y="1026" class="small">Each token adds ~0.5 MB to the</text>
<text x="720" y="1040" class="small">KV cache. Decode step N loads all</text>
<text x="720" y="1054" class="small">N x 0.5 MB from VRAM every step:</text>
<text x="720" y="1068" class="small">longer context = slower decode.</text>
</svg>
