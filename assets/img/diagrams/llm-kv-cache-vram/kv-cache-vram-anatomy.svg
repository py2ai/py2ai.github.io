<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, system-ui, -apple-system, sans-serif">
<style>
  text { fill: #1e293b; }
  .title { font-size:20px; font-weight:700; fill:#1e293b; }
  .section { font-size:15px; font-weight:700; }
  .label { font-size:12px; font-weight:600; fill:#1e293b; }
  .small { font-size:10px; fill:#64748b; }
  .annot { font-size:9px; fill:#94a3b8; }
  .formula { font-size:11px; font-family:JetBrains Mono, Fira Code, monospace; fill:#1e293b; }
  .vram-label { font-size:11px; font-weight:600; }
</style>
<defs>
  <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
  <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#059669"/></marker>
  <marker id="arr-green-d" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#059669"/></marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/></marker>
  <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ea580c"/></marker>
  <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#dc2626"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/></filter>
</defs>
<rect width="1200" height="900" fill="#ffffff"/>
<text x="600" y="30" text-anchor="middle" class="title">KV-Cache and GPU VRAM: The Memory Anatomy of LLM Decode</text>
<text x="600" y="48" text-anchor="middle" class="small">Why decode is memory-bandwidth-bound: every token requires loading the entire KV cache from VRAM</text>
<text x="40" y="78" class="section" fill="#dc2626">1. GPU VRAM Allocation (NVIDIA A100 40GB Example)</text>
<rect x="60" y="95" width="160" height="260" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
<text x="140" y="225" text-anchor="middle" class="vram-label" fill="#ffffff">Model Weights</text>
<text x="140" y="241" text-anchor="middle" class="small" fill="#cbd5e1">26 GB (65%)</text>
<text x="140" y="255" text-anchor="middle" class="annot" fill="#94a3b8">13B params x 2 bytes</text>
<rect x="60" y="355" width="160" height="120" fill="#059669" stroke="#047857" stroke-width="1"/>
<text x="140" y="415" text-anchor="middle" class="vram-label" fill="#ffffff">KV Cache</text>
<text x="140" y="431" text-anchor="middle" class="small" fill="#d1fae5">12 GB (30%)</text>
<text x="140" y="445" text-anchor="middle" class="annot" fill="#a7f3d0">Grows with context</text>
<rect x="60" y="475" width="160" height="20" rx="0" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
<rect x="60" y="475" width="160" height="4" rx="0" fill="#f59e0b"/>
<text x="228" y="487" class="small" fill="#92400e">Activations ~2GB (5%)</text>
<rect x="60" y="95" width="160" height="400" rx="4" fill="none" stroke="#0f172a" stroke-width="2"/>
<text x="140" y="515" text-anchor="middle" class="label">40 GB VRAM (HBM2e)</text>
<text x="140" y="529" text-anchor="middle" class="annot">1.55 TB/s bandwidth</text>
<text x="236" y="115" class="label" fill="#1e293b">Static (never changes)</text>
<text x="236" y="129" class="small">Loaded once at startup</text>
<text x="236" y="143" class="small">Same for every request</text>
<line x1="228" y1="353" x2="234" y2="353" stroke="#059669" stroke-width="1"/>
<text x="236" y="365" class="label" fill="#059669">Dynamic (grows every token)</text>
<text x="236" y="379" class="small">Allocated per request</text>
<text x="236" y="393" class="small">Freed when request ends</text>
<text x="236" y="407" class="small">= the decode bottleneck</text>
<text x="420" y="78" class="section" fill="#059669">2. KV-Cache Structure (Per Transformer Layer)</text>
<rect x="420" y="95" width="340" height="72" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<text x="590" y="113" text-anchor="middle" class="label" fill="#059669">Transformer Layer i (of N layers)</text>
<rect x="436" y="123" width="60" height="32" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
<text x="466" y="137" text-anchor="middle" class="small" font-weight="600">K heads</text>
<text x="466" y="149" text-anchor="middle" class="annot">[H x D]</text>
<rect x="508" y="123" width="60" height="32" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
<text x="538" y="137" text-anchor="middle" class="small" font-weight="600">V heads</text>
<text x="538" y="149" text-anchor="middle" class="annot">[H x D]</text>
<text x="580" y="129" class="small">x seq_len tokens</text>
<text x="580" y="143" class="annot">(all cached tokens)</text>
<text x="580" y="157" class="annot">grows +1 each step</text>
<line x1="590" y1="167" x2="590" y2="183" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="598" y="179" class="annot">repeat N times</text>
<rect x="420" y="187" width="340" height="72" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<text x="590" y="205" text-anchor="middle" class="label" fill="#059669">Transformer Layer i+1</text>
<rect x="436" y="215" width="60" height="32" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
<text x="466" y="229" text-anchor="middle" class="small" font-weight="600">K heads</text>
<text x="466" y="241" text-anchor="middle" class="annot">[H x D]</text>
<rect x="508" y="215" width="60" height="32" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
<text x="538" y="229" text-anchor="middle" class="small" font-weight="600">V heads</text>
<text x="538" y="241" text-anchor="middle" class="annot">[H x D]</text>
<text x="590" y="289" text-anchor="middle" class="annot">. . . (N layers total)</text>
<rect x="420" y="303" width="340" height="76" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="432" y="321" class="label" fill="#92400e">KV Cache Size (bytes):</text>
<text x="432" y="339" class="formula">2 * 2 * L * H * D * S</text>
<text x="432" y="355" class="annot">2(K+V) * 2(FP16) * layers * heads * dim * seq_len</text>
<text x="432" y="369" class="annot">Llama-7B: L=32, H=32, D=128 =&gt; 0.5 MB/token</text>
<text x="40" y="520" class="section" fill="#7c3aed">3. Decode Step: Memory Flow per Token</text>
<rect x="40" y="540" width="200" height="80" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<rect x="40" y="540" width="200" height="22" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
<rect x="40" y="554" width="200" height="8" fill="#d1fae5"/>
<text x="140" y="556" text-anchor="middle" class="label" fill="#059669">1. Load KV Cache</text>
<text x="140" y="578" text-anchor="middle" class="small">Read ALL cached K,V</text>
<text x="140" y="592" text-anchor="middle" class="small">from VRAM (HBM)</text>
<text x="140" y="606" text-anchor="middle" class="small">Gigabytes of data</text>
<text x="140" y="614" text-anchor="middle" class="annot" fill="#059669">Memory-bound</text>
<line x1="240" y1="580" x2="264" y2="580" stroke="#64748b" stroke-width="2" marker-end="url(#arr-blue)"/>
<rect x="264" y="540" width="200" height="80" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<rect x="264" y="540" width="200" height="22" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
<rect x="264" y="554" width="200" height="8" fill="#dbeafe"/>
<text x="364" y="556" text-anchor="middle" class="label" fill="#2563eb">2. Compute Q</text>
<text x="364" y="578" text-anchor="middle" class="small">Single token query</text>
<text x="364" y="592" text-anchor="middle" class="small">vector computation</text>
<text x="364" y="606" text-anchor="middle" class="small">Tiny: 1 vector only</text>
<text x="364" y="614" text-anchor="middle" class="annot" fill="#2563eb">Fast</text>
<line x1="464" y1="580" x2="488" y2="580" stroke="#64748b" stroke-width="2" marker-end="url(#arr-blue)"/>
<rect x="488" y="540" width="200" height="80" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<rect x="488" y="540" width="200" height="22" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<rect x="488" y="554" width="200" height="8" fill="#ede9fe"/>
<text x="588" y="556" text-anchor="middle" class="label" fill="#7c3aed">3. Attention</text>
<text x="588" y="578" text-anchor="middle" class="small">Q x K^T = scores</text>
<text x="588" y="592" text-anchor="middle" class="small">softmax(scores) x V</text>
<text x="588" y="606" text-anchor="middle" class="small">= context vector</text>
<text x="588" y="614" text-anchor="middle" class="annot" fill="#7c3aed">Low arithmetic
intensity</text>
<line x1="688" y1="580" x2="712" y2="580" stroke="#64748b" stroke-width="2" marker-end="url(#arr-blue)"/>
<rect x="712" y="540" width="200" height="80" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
<rect x="712" y="540" width="200" height="22" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
<rect x="712" y="554" width="200" height="8" fill="#fed7aa"/>
<text x="812" y="556" text-anchor="middle" class="label" fill="#ea580c">4. Append K,V</text>
<text x="812" y="578" text-anchor="middle" class="small">New token K,V</text>
<text x="812" y="592" text-anchor="middle" class="small">appended to cache</text>
<text x="812" y="606" text-anchor="middle" class="small">Cache grows +1</text>
<text x="812" y="614" text-anchor="middle" class="annot" fill="#ea580c">Write to VRAM</text>
<line x1="912" y1="580" x2="936" y2="580" stroke="#64748b" stroke-width="2" marker-end="url(#arr-blue)"/>
<rect x="936" y="540" width="200" height="80" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
<rect x="936" y="540" width="200" height="22" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<rect x="936" y="554" width="200" height="8" fill="#fee2e2"/>
<text x="1036" y="556" text-anchor="middle" class="label" fill="#dc2626">5. Output Logits</text>
<text x="1036" y="578" text-anchor="middle" class="small">Final layer produces</text>
<text x="1036" y="592" text-anchor="middle" class="small">vocab distribution</text>
<text x="1036" y="606" text-anchor="middle" class="small">Sample next token</text>
<text x="1036" y="614" text-anchor="middle" class="annot" fill="#dc2626">Single token</text>
<path d="M 1036 620 Q 1036 654 140 654 Q 140 654 140 620" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arr-purple)"/>
<text x="600" y="662" text-anchor="middle" class="small" fill="#7c3aed" font-weight="600">Autoregressive loop: repeat for each output token</text>
<text x="40" y="660" class="section" fill="#dc2626">4. Why Decode is Memory-Bound: Arithmetic Intensity</text>
<rect x="40" y="676" width="260" height="120" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="40+130" y="696" text-anchor="middle" class="label" fill="#2563eb">Prefill (Prompt Phase)</text>
<text x="52" y="718" class="small">Computation: Matrix x Matrix</text>
<text x="52" y="734" class="small">FLOPs per byte loaded: HIGH</text>
<text x="52" y="750" class="small">GPU cores: 90%+ utilized</text>
<text x="52" y="766" class="small">Bottleneck: Compute (TFLOPS)</text>
<text x="52" y="784" class="annot">Adding tokens = more parallelism</text>
<rect x="320" y="676" width="260" height="120" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="450" y="696" text-anchor="middle" class="label" fill="#dc2626">Decode (Autoregressive)</text>
<text x="332" y="718" class="small">Computation: Matrix x Vector</text>
<text x="332" y="734" class="small">FLOPs per byte loaded: LOW</text>
<text x="332" y="750" class="small">GPU cores: &lt;5% utilized</text>
<text x="332" y="766" class="small">Bottleneck: Memory BW (GB/s)</text>
<text x="332" y="784" class="annot">Adding tokens = more data to load</text>
<rect x="600" y="676" width="260" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="730" y="696" text-anchor="middle" class="label" fill="#92400e">VRAM Bandwidth Limits</text>
<text x="612" y="718" class="small">A100: 1,555 GB/s HBM2e</text>
<text x="612" y="734" class="small">H100: 3,350 GB/s HBM3</text>
<text x="612" y="750" class="small">RTX 4090: 1,008 GB/s GDDR6X</text>
<text x="612" y="766" class="small">CPU DDR5: ~100 GB/s</text>
<text x="612" y="784" class="annot">KV cache must fit + be read each step</text>
<rect x="880" y="676" width="280" height="120" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="1020" y="696" text-anchor="middle" class="label" fill="#7c3aed">Roofline Model</text>
<text x="892" y="718" class="small">Arithmetic intensity = FLOPs / bytes</text>
<text x="892" y="734" class="small">Prefill: ~100 FLOPs/byte</text>
<text x="892" y="750" class="small">Decode: ~1-2 FLOPs/byte</text>
<text x="892" y="766" class="small">Ridge point: ~50-100 FLOPs/byte</text>
<text x="892" y="784" class="annot">Decode is far left of ridge = memory-bound</text>
<text x="40" y="810" class="section" fill="#059669">5. KV-Cache Growth: Why Longer Context = Slower Decode</text>
<rect x="60" y="894" width="80" height="2" rx="2" fill="#a7f3d0" stroke="#059669" stroke-width="1"/>
<text x="100" y="888" text-anchor="middle" class="annot">0.25 GB</text>
<text x="100" y="910" text-anchor="middle" class="small">512 tok</text>
<rect x="172" y="890" width="80" height="6" rx="2" fill="#6ee7b7" stroke="#059669" stroke-width="1"/>
<text x="212" y="884" text-anchor="middle" class="annot">1 GB</text>
<text x="212" y="910" text-anchor="middle" class="small">2K tok</text>
<rect x="284" y="884" width="80" height="12" rx="2" fill="#34d399" stroke="#059669" stroke-width="1"/>
<text x="324" y="878" text-anchor="middle" class="annot">2 GB</text>
<text x="324" y="910" text-anchor="middle" class="small">4K tok</text>
<rect x="396" y="872" width="80" height="24" rx="2" fill="#10b981" stroke="#059669" stroke-width="1"/>
<text x="436" y="866" text-anchor="middle" class="annot">4 GB</text>
<text x="436" y="910" text-anchor="middle" class="small">8K tok</text>
<rect x="508" y="848" width="80" height="48" rx="2" fill="#059669" stroke="#059669" stroke-width="1"/>
<text x="548" y="842" text-anchor="middle" class="annot">8 GB</text>
<text x="548" y="910" text-anchor="middle" class="small">16K tok</text>
<rect x="620" y="832" width="80" height="64" rx="2" fill="#047857" stroke="#059669" stroke-width="1"/>
<text x="660" y="826" text-anchor="middle" class="annot">16 GB</text>
<text x="660" y="910" text-anchor="middle" class="small">32K tok</text>
<line x1="50" y1="896" x2="700" y2="896" stroke="#64748b" stroke-width="1"/>
<text x="720" y="866" class="label" fill="#059669">Linear growth!</text>
<text x="720" y="880" class="small">Each token adds ~0.5 MB</text>
<text x="720" y="894" class="small">to the KV cache.</text>
<text x="720" y="910" class="small">Decode step N loads all</text>
<text x="720" y="924" class="small">N x 0.5 MB from VRAM.</text>
<text x="40" y="884" class="small" font-weight="600">Legend:</text>
<rect x="100" y="875" width="12" height="10" rx="2" fill="#059669"/>
<text x="118" y="884" class="small">KV cache (memory)</text>
<rect x="240" y="875" width="12" height="10" rx="2" fill="#2563eb"/>
<text x="258" y="884" class="small">Compute (Q vector)</text>
<rect x="386" y="875" width="12" height="10" rx="2" fill="#7c3aed"/>
<text x="404" y="884" class="small">Attention / loop</text>
<rect x="520" y="875" width="12" height="10" rx="2" fill="#dc2626"/>
<text x="538" y="884" class="small">Output / bottleneck</text>
</svg>