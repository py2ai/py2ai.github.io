<svg
    viewBox="0 0 200 120"
    xmlns="http://www.w3.org/2000/svg"
    width="200"
    height="auto"
    style="background:#e0f7ff"
>
  <!-- Body -->
  <ellipse
      cx="80"
      cy="60"
      rx="70"
      ry="35"
      fill="#a0c4ff"
      stroke="#5a8ac4"
      stroke-width="2"
  />
  <!-- Tail -->
  <polygon
      points="150,45 180,60 150,75"
      fill="#7a7a7a"
      stroke="#5a8ac4"
      stroke-width="2"
  />
  <!-- Dorsal fin -->
  <polygon
      points="70,20 95,20 80,45"
      fill="#7a7a7a"
      stroke="#5a8ac4"
      stroke-width="2"
  />
  <!-- Pectoral fin (left) -->
  <polygon
      points="60,70 45,85 55,73"
      fill="#7a7a7a"
      stroke="#5a8ac4"
      stroke-width="2"
  />
  <!-- Pectoral fin (right) -->
  <polygon
      points="100,70 115,85 105,73"
      fill="#7a7a7a"
      stroke="#5a8ac4"
      stroke-width="2"
  />
  <!-- Eye -->
  <circle
      cx="45"
      cy="55"
      r="5"
      fill="#fff"
      stroke="#5a8ac4"
      stroke-width="1"
  />
  <circle cx="46" cy="54" r="2" fill="#000" />
  <!-- Mouth (smile) -->
  <path
      d="M 40 70 Q 55 80 70 70"
      stroke="#5a8ac4"
      stroke-width="2"
      fill="none"
      stroke-linecap="round"
  />
</svg>