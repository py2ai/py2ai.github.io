<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" font-family="Inter, system-ui, -apple-system, sans-serif">
<style>
  text { fill: #1e293b; }
  .title { font-size:20px; font-weight:700; fill:#1e293b; }
  .section { font-size:15px; font-weight:700; }
  .label { font-size:12px; font-weight:600; fill:#1e293b; }
  .small { font-size:10px; fill:#64748b; }
  .annot { font-size:9px; fill:#94a3b8; }
  .mono { font-size:11px; font-family:JetBrains Mono, Fira Code, monospace; fill:#1e293b; }
</style>
<defs>
  <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
  <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#059669"/></marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/></marker>
  <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ea580c"/></marker>
  <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/></filter>
</defs>
<rect width="1200" height="920" fill="#ffffff"/>
<text x="600" y="30" text-anchor="middle" class="title">LLM Tokenization: How Text Becomes Numbers</text>
<text x="600" y="48" text-anchor="middle" class="small">From raw text to embedding vectors: the Byte-Pair Encoding pipeline that every LLM uses</text>
<text x="40" y="78" class="section" fill="#2563eb">1. Raw Text to Tokens</text>
<rect x="40" y="95" width="500" height="56" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="56" y="113" class="label" fill="#2563eb">Input Text (String)</text>
<text x="56" y="133" class="mono">"The quick brown fox jumps"</text>
<text x="56" y="145" class="annot">Human-readable string | Variable length | Unicode characters</text>
<line x1="290" y1="151" x2="290" y2="175" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="300" y="167" class="annot">tokenizer.encode()</text>
<rect x="56" y="175" width="84" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="98" y="198" text-anchor="middle" class="mono">The</text>
<rect x="152" y="175" width="84" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="194" y="198" text-anchor="middle" class="mono"> quick</text>
<rect x="248" y="175" width="84" height="36" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="290" y="198" text-anchor="middle" class="mono"> brown</text>
<rect x="344" y="175" width="84" height="36" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="386" y="198" text-anchor="middle" class="mono"> fox</text>
<rect x="440" y="175" width="84" height="36" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="482" y="198" text-anchor="middle" class="mono"> jumps</text>
<text x="290" y="231" text-anchor="middle" class="annot">5 tokens | whitespace attached to following word</text>
<text x="640" y="78" class="section" fill="#ea580c">2. Token to Vocabulary ID</text>
<rect x="640" y="95" width="520" height="56" rx="8" fill="#f8fafc" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
<text x="656" y="113" class="label" fill="#ea580c">Vocabulary Lookup (Tokenizer Model)</text>
<text x="656" y="133" class="small">Each token maps to a unique integer ID in the vocabulary</text>
<text x="656" y="145" class="annot">Vocabulary size: 32,000 (Llama) to 128,000 (GPT-4)</text>
<rect x="656" y="175" width="88" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="700" y="191" text-anchor="middle" class="small">The</text>
<text x="700" y="205" text-anchor="middle" class="mono" font-weight="700">ID: 464</text>
<rect x="756" y="175" width="88" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="800" y="191" text-anchor="middle" class="small">quick</text>
<text x="800" y="205" text-anchor="middle" class="mono" font-weight="700">ID: 2068</text>
<rect x="856" y="175" width="88" height="36" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="900" y="191" text-anchor="middle" class="small">brown</text>
<text x="900" y="205" text-anchor="middle" class="mono" font-weight="700">ID: 7511</text>
<rect x="956" y="175" width="88" height="36" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="1000" y="191" text-anchor="middle" class="small">fox</text>
<text x="1000" y="205" text-anchor="middle" class="mono" font-weight="700">ID: 21831</text>
<rect x="1056" y="175" width="88" height="36" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="1100" y="191" text-anchor="middle" class="small">jumps</text>
<text x="1100" y="205" text-anchor="middle" class="mono" font-weight="700">ID: 18045</text>
<text x="900" y="231" text-anchor="middle" class="annot">Integer IDs are what the model actually processes</text>
<text x="40" y="270" class="section" fill="#7c3aed">3. Byte-Pair Encoding (BPE): How Tokens Are Learned</text>
<text x="40" y="286" class="small">BPE starts with individual bytes and iteratively merges the most frequent pairs to build the vocabulary</text>
<rect x="40" y="300" width="250" height="130" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
<rect x="40" y="300" width="250" height="24" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
<rect x="40" y="316" width="250" height="8" fill="#f1f5f9"/>
<text x="165" y="317" text-anchor="middle" class="label" fill="#64748b">Step 0: Bytes</text>
<text x="52" y="344" class="small">T h e _ q u i c k</text>
<text x="52" y="362" class="small">b r o w n _ f o x</text>
<text x="52" y="380" class="small">Each char = 1 token</text>
<text x="52" y="398" class="small">256 possible bytes</text>
<text x="52" y="416" class="small">Very long sequences</text>
<line x1="290" y1="365" x2="310" y2="365" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>
<rect x="310" y="300" width="250" height="130" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<rect x="310" y="300" width="250" height="24" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
<rect x="310" y="316" width="250" height="8" fill="#dbeafe"/>
<text x="435" y="317" text-anchor="middle" class="label" fill="#2563eb">Step 1-1000: Frequent Pairs</text>
<text x="322" y="344" class="small">th + e = the</text>
<text x="322" y="362" class="small">q + u = qu</text>
<text x="322" y="380" class="small">i + ck = ick</text>
<text x="322" y="398" class="small">Merge most frequent</text>
<text x="322" y="416" class="small">pairs iteratively</text>
<line x1="560" y1="365" x2="580" y2="365" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>
<rect x="580" y="300" width="250" height="130" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<rect x="580" y="300" width="250" height="24" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<rect x="580" y="316" width="250" height="8" fill="#ede9fe"/>
<text x="705" y="317" text-anchor="middle" class="label" fill="#7c3aed">Step 1000-32000: Subwords</text>
<text x="592" y="344" class="small">quick = 1 token</text>
<text x="592" y="362" class="small">brown = 1 token</text>
<text x="592" y="380" class="small">jumps = 1 token</text>
<text x="592" y="398" class="small">Rare words split:</text>
<text x="592" y="416" class="small">tokeniz + at + ion</text>
<line x1="830" y1="365" x2="850" y2="365" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>
<rect x="850" y="300" width="250" height="130" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<rect x="850" y="300" width="250" height="24" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
<rect x="850" y="316" width="250" height="8" fill="#d1fae5"/>
<text x="975" y="317" text-anchor="middle" class="label" fill="#059669">Final Vocabulary</text>
<text x="862" y="344" class="small">32,000 tokens</text>
<text x="862" y="362" class="small">(Llama-2)</text>
<text x="862" y="380" class="small">Common words = 1 token</text>
<text x="862" y="398" class="small">Rare words = 2-3 tokens</text>
<text x="862" y="416" class="small">Balance: coverage vs size</text>
<text x="40" y="470" class="section" fill="#059669">4. Token IDs to Embedding Vectors</text>
<rect x="40" y="486" width="280" height="200" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<text x="180" y="504" text-anchor="middle" class="label" fill="#059669">Embedding Lookup Table</text>
<text x="180" y="518" text-anchor="middle" class="annot">Shape: [vocab_size x dim] = [32000 x 4096]</text>
<rect x="56" y="528" width="248" height="16" rx="2" fill="#e2e8f0" stroke="#059669" stroke-width="0.5"/>
<text x="64" y="540" class="mono">0</text>
<text x="120" y="540" class="small">&lt;pad&gt;</text>
<rect x="56" y="546" width="248" height="16" rx="2" fill="#e2e8f0" stroke="#059669" stroke-width="0.5"/>
<text x="64" y="558" class="mono">1</text>
<text x="120" y="558" class="small">&lt;s&gt;</text>
<rect x="56" y="564" width="248" height="16" rx="2" fill="#d1fae5" stroke="#059669" stroke-width="0.5"/>
<text x="64" y="576" class="mono">464</text>
<text x="120" y="576" class="small">The</text>
<text x="200" y="576" class="annot" fill="#059669">--&gt; [d0, d1, ..., d4095]</text>
<rect x="56" y="582" width="248" height="16" rx="2" fill="#d1fae5" stroke="#059669" stroke-width="0.5"/>
<text x="64" y="594" class="mono">2068</text>
<text x="120" y="594" class="small"> quick</text>
<text x="200" y="594" class="annot" fill="#059669">--&gt; [d0, d1, ..., d4095]</text>
<rect x="56" y="600" width="248" height="16" rx="2" fill="#d1fae5" stroke="#059669" stroke-width="0.5"/>
<text x="64" y="612" class="mono">7511</text>
<text x="120" y="612" class="small"> brown</text>
<text x="200" y="612" class="annot" fill="#059669">--&gt; [d0, d1, ..., d4095]</text>
<rect x="56" y="618" width="248" height="16" rx="2" fill="#d1fae5" stroke="#059669" stroke-width="0.5"/>
<text x="64" y="630" class="mono">21831</text>
<text x="120" y="630" class="small"> fox</text>
<text x="200" y="630" class="annot" fill="#059669">--&gt; [d0, d1, ..., d4095]</text>
<rect x="56" y="636" width="248" height="16" rx="2" fill="#e2e8f0" stroke="#059669" stroke-width="0.5"/>
<text x="64" y="648" class="mono">...</text>
<text x="120" y="648" class="small">...</text>
<rect x="56" y="654" width="248" height="16" rx="2" fill="#e2e8f0" stroke="#059669" stroke-width="0.5"/>
<text x="64" y="666" class="mono">31999</text>
<text x="120" y="666" class="small">zstd</text>
<line x1="320" y1="586" x2="380" y2="586" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
<text x="350" y="580" text-anchor="middle" class="annot">lookup</text>
<rect x="380" y="516" width="180" height="140" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<text x="470" y="534" text-anchor="middle" class="label" fill="#059669">Embedding Vectors</text>
<text x="470" y="548" text-anchor="middle" class="annot">Shape: [5 x 4096]</text>
<rect x="396" y="558" width="148" height="16" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="0.5"/>
<text x="404" y="570" class="mono" font-size="9">The</text>
<text x="460" y="570" class="annot">[464] -&gt; [0.12, -0.34, ...]</text>
<rect x="396" y="578" width="148" height="16" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="0.5"/>
<text x="404" y="590" class="mono" font-size="9">quick</text>
<text x="460" y="590" class="annot">[2068] -&gt; [0.12, -0.34, ...]</text>
<rect x="396" y="598" width="148" height="16" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="0.5"/>
<text x="404" y="610" class="mono" font-size="9">brown</text>
<text x="460" y="610" class="annot">[7511] -&gt; [0.12, -0.34, ...]</text>
<rect x="396" y="618" width="148" height="16" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="0.5"/>
<text x="404" y="630" class="mono" font-size="9">fox</text>
<text x="460" y="630" class="annot">[21831] -&gt; [0.12, -0.34, ...]</text>
<rect x="396" y="638" width="148" height="16" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="0.5"/>
<text x="404" y="650" class="mono" font-size="9">jumps</text>
<text x="460" y="650" class="annot">[18045] -&gt; [0.12, -0.34, ...]</text>
<text x="640" y="470" class="section" fill="#dc2626">5. Why Tokenization Matters</text>
<rect x="640" y="486" width="520" height="200" rx="8" fill="#f8fafc" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
<text x="656" y="508" class="label" fill="#059669">English (Efficient: ~1 token/word)</text>
<rect x="656" y="516" width="488" height="28" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
<text x="664" y="534" class="mono">"Hello world" = 2 tokens | "Tokenization is easy" = 4 tokens</text>
<text x="656" y="562" class="label" fill="#ea580c">Chinese (Less Efficient: ~2-3 tokens/char)</text>
<rect x="656" y="570" width="488" height="28" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
<text x="664" y="588" class="mono">&#20320;&#22909;&#19990;&#30028; = 6 tokens | Same meaning, 3x more tokens</text>
<text x="656" y="616" class="label" fill="#7c3aed">Code (Variable: depends on language)</text>
<rect x="656" y="624" width="488" height="28" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<text x="664" y="642" class="mono">def foo(): return 42  =  9 tokens | Whitespace matters</text>
<rect x="656" y="660" width="488" height="18" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
<text x="664" y="673" class="small" fill="#92400e">Cost = $0.01 per 1K tokens | 1M Chinese chars = ~3M tokens = $30 | 1M English words = ~1.3M tokens = $13</text>
<text x="40" y="700" class="section" fill="#7c3aed">6. Special Tokens and Context Window</text>
<rect x="40" y="716" width="560" height="180" rx="8" fill="#f8fafc" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="56" y="734" class="label" fill="#7c3aed">Special Tokens</text>
<rect x="56" y="744" width="528" height="20" rx="3" fill="#dbeafe" stroke="#7c3aed" stroke-width="0.5"/>
<text x="64" y="758" class="mono">&lt;s&gt;</text>
<text x="180" y="758" class="small" font-weight="600">BOS</text>
<text x="240" y="758" class="small">Beginning of sequence</text>
<rect x="56" y="768" width="528" height="20" rx="3" fill="#fee2e2" stroke="#7c3aed" stroke-width="0.5"/>
<text x="64" y="782" class="mono">&lt;/s&gt;</text>
<text x="180" y="782" class="small" font-weight="600">EOS</text>
<text x="240" y="782" class="small">End of sequence (stop generation)</text>
<rect x="56" y="792" width="528" height="20" rx="3" fill="#f1f5f9" stroke="#7c3aed" stroke-width="0.5"/>
<text x="64" y="806" class="mono">&lt;pad&gt;</text>
<text x="180" y="806" class="small" font-weight="600">PAD</text>
<text x="240" y="806" class="small">Padding for batch alignment</text>
<rect x="56" y="816" width="528" height="20" rx="3" fill="#fef3c7" stroke="#7c3aed" stroke-width="0.5"/>
<text x="64" y="830" class="mono">&lt;unk&gt;</text>
<text x="180" y="830" class="small" font-weight="600">UNK</text>
<text x="240" y="830" class="small">Unknown token (not in vocab)</text>
<rect x="56" y="840" width="528" height="20" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.5"/>
<text x="64" y="854" class="mono">[INST]</text>
<text x="180" y="854" class="small" font-weight="600">INST</text>
<text x="240" y="854" class="small">Instruction marker (Llama-2 chat)</text>
<rect x="56" y="864" width="528" height="20" rx="3" fill="#d1fae5" stroke="#7c3aed" stroke-width="0.5"/>
<text x="64" y="878" class="mono">&lt;|im_start|&gt;</text>
<text x="180" y="878" class="small" font-weight="600">SYS</text>
<text x="240" y="878" class="small">System message (GPT-style)</text>
<rect x="620" y="716" width="540" height="180" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="636" y="734" class="label" fill="#2563eb">Context Window: Token Budget</text>
<text x="636" y="752" class="small">The maximum number of tokens the model can process in one request</text>
<rect x="640" y="846" width="72" height="30" rx="3" fill="#93c5fd" stroke="#2563eb" stroke-width="1"/>
<text x="676" y="840" text-anchor="middle" class="annot">2K</text>
<text x="676" y="890" text-anchor="middle" class="annot">GPT-3</text>
<rect x="725" y="826" width="72" height="50" rx="3" fill="#60a5fa" stroke="#2563eb" stroke-width="1"/>
<text x="761" y="820" text-anchor="middle" class="annot">4K</text>
<text x="761" y="890" text-anchor="middle" class="annot">Llama-2</text>
<rect x="810" y="796" width="72" height="80" rx="3" fill="#3b82f6" stroke="#2563eb" stroke-width="1"/>
<text x="846" y="790" text-anchor="middle" class="annot">8K</text>
<text x="846" y="890" text-anchor="middle" class="annot">Llama-3</text>
<rect x="895" y="746" width="72" height="130" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="931" y="740" text-anchor="middle" class="annot">128K</text>
<text x="931" y="890" text-anchor="middle" class="annot">GPT-4</text>
<rect x="980" y="721" width="72" height="155" rx="3" fill="#1d4ed8" stroke="#2563eb" stroke-width="1"/>
<text x="1016" y="715" text-anchor="middle" class="annot">200K</text>
<text x="1016" y="890" text-anchor="middle" class="annot">Claude</text>
<rect x="1065" y="711" width="72" height="165" rx="3" fill="#1e3a8a" stroke="#2563eb" stroke-width="1"/>
<text x="1101" y="705" text-anchor="middle" class="annot">1M</text>
<text x="1101" y="890" text-anchor="middle" class="annot">Gemini</text>
<line x1="630" y1="876" x2="1170" y2="876" stroke="#64748b" stroke-width="1"/>
<text x="900" y="906" text-anchor="middle" class="small">More context = more KV-cache VRAM = higher cost per request</text>
<rect x="40" y="895" width="1120" height="18" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
<text x="56" y="908" class="small" font-weight="600" fill="#92400e">Key: 1 word ~= 1.3 tokens (English) | 1 Chinese char ~= 2.5 tokens | 1 line of code ~= 10-15 tokens | Cost = token_count x price_per_token</text>
</svg>