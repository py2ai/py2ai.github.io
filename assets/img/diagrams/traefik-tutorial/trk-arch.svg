<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">Traefik Architecture: Dynamic Routing</text>
<rect x="40" y="80" width="120" height="50" rx="8" fill="#1e40af"/>
<text x="100" y="110" text-anchor="middle" class="node-title-w">Request</text>
<text x="100" y="128" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">:443 HTTPS</text>
<line x1="160" y1="105" x2="220" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="220" y="80" width="140" height="50" rx="8" fill="#2563eb"/>
<text x="290" y="110" text-anchor="middle" class="node-title-w">Entrypoint</text>
<text x="290" y="128" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">websecure</text>
<line x1="360" y1="105" x2="420" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="420" y="80" width="140" height="50" rx="8" fill="#1e40af"/>
<text x="490" y="110" text-anchor="middle" class="node-title-w">Router</text>
<text x="490" y="128" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">Host() rule</text>
<line x1="560" y1="105" x2="620" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="590" y="97" text-anchor="middle" class="item-sub">middleware</text>
<rect x="620" y="80" width="140" height="50" rx="8" fill="#2563eb"/>
<text x="690" y="110" text-anchor="middle" class="node-title-w">Service</text>
<text x="690" y="128" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">load-balance</text>
<line x1="690" y1="130" x2="690" y2="170" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="560" y="172" width="260" height="36" rx="8" fill="#16a34a"/>
<text x="690" y="196" text-anchor="middle" class="node-title-w">backend containers</text>
<rect x="40" y="230" width="820" height="130" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="256" text-anchor="middle" class="band-label">Dynamic configuration</text>
<text x="430" y="282" text-anchor="middle" class="item-sub">Traefik reads config from providers (Docker, K8s, file) at runtime.</text>
<text x="430" y="302" text-anchor="middle" class="item-sub">No reload needed - routes update as containers start/stop.</text>
<text x="430" y="322" text-anchor="middle" class="item-sub">Labels on containers = router rules (traefik.http.routers...).</text>
<text x="430" y="342" text-anchor="middle" class="item-sub">vs Nginx: Nginx needs a config file + nginx -s reload; Traefik is event-driven.</text>
</svg>
