<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">Middleware: Chain of Processing Before the Service</text>
<rect x="40" y="70" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="74" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="95" text-anchor="middle" class="node-title-w">RateLimit</text>
<rect x="250" y="74" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="395" y="95" text-anchor="middle" class="item">requests/sec per source IP</text>
<rect x="550" y="74" width="270" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="685" y="95" text-anchor="middle" class="item-sub">protect backends from spikes</text>
<rect x="40" y="114" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="118" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="139" text-anchor="middle" class="node-title-w">BasicAuth / ForwardAuth</text>
<rect x="250" y="118" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="395" y="139" text-anchor="middle" class="item">validate credentials / external auth</text>
<rect x="550" y="118" width="270" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="685" y="139" text-anchor="middle" class="item-sub">gate access</text>
<rect x="40" y="158" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="162" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="183" text-anchor="middle" class="node-title-w">Compress</text>
<rect x="250" y="162" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="395" y="183" text-anchor="middle" class="item">gzip/brotli response compression</text>
<rect x="550" y="162" width="270" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="685" y="183" text-anchor="middle" class="item-sub">save bandwidth</text>
<rect x="40" y="202" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="206" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="227" text-anchor="middle" class="node-title-w">Retry</text>
<rect x="250" y="206" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="395" y="227" text-anchor="middle" class="item">retry failed upstream requests</text>
<rect x="550" y="206" width="270" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="685" y="227" text-anchor="middle" class="item-sub">resilience</text>
<rect x="40" y="246" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="250" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="271" text-anchor="middle" class="node-title-w">Headers</text>
<rect x="250" y="250" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="395" y="271" text-anchor="middle" class="item">add/remove/inspect headers</text>
<rect x="550" y="250" width="270" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="685" y="271" text-anchor="middle" class="item-sub">HSTS, CORS, security</text>
<rect x="40" y="290" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="294" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="315" text-anchor="middle" class="node-title-w">CircuitBreaker</text>
<rect x="250" y="294" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="395" y="315" text-anchor="middle" class="item">stop sending to a failing backend</text>
<rect x="550" y="294" width="270" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="685" y="315" text-anchor="middle" class="item-sub">fail fast, recover</text>
<rect x="40" y="334" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="338" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="359" text-anchor="middle" class="node-title-w">RedirectScheme</text>
<rect x="250" y="338" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="395" y="359" text-anchor="middle" class="item">http -&gt; https redirect</text>
<rect x="550" y="338" width="270" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="685" y="359" text-anchor="middle" class="item-sub">force TLS</text>
<rect x="40" y="378" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="382" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="403" text-anchor="middle" class="node-title-w">StripPrefix / ReplacePath</text>
<rect x="250" y="382" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="395" y="403" text-anchor="middle" class="item">rewrite the URL before backend</text>
<rect x="550" y="382" width="270" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="685" y="403" text-anchor="middle" class="item-sub">path-based routing</text>
<rect x="40" y="432" width="780" height="0" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
</svg>
