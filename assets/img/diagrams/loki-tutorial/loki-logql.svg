<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">LogQL: Selectors, Filters, Parsers, Aggregations</text>
<rect x="40" y="70" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="74" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="95" text-anchor="middle" class="node-title-w">Stream selector</text>
<rect x="250" y="74" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="405" y="95" text-anchor="middle" class="item">{app="api",env="prod"}</text>
<rect x="570" y="74" width="250" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="695" y="95" text-anchor="middle" class="item-sub">fast: index lookup</text>
<rect x="40" y="114" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="118" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="139" text-anchor="middle" class="node-title-w">Line filter</text>
<rect x="250" y="118" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="405" y="139" text-anchor="middle" class="item">|= "error" |~ "timeout.*"</text>
<rect x="570" y="118" width="250" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="695" y="139" text-anchor="middle" class="item-sub">grep within stream</text>
<rect x="40" y="158" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="162" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="183" text-anchor="middle" class="node-title-w">Label filter</text>
<rect x="250" y="162" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="405" y="183" text-anchor="middle" class="item">| status="500"</text>
<rect x="570" y="162" width="250" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="695" y="183" text-anchor="middle" class="item-sub">filter by parsed label</text>
<rect x="40" y="202" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="206" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="227" text-anchor="middle" class="node-title-w">Parser</text>
<rect x="250" y="206" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="405" y="227" text-anchor="middle" class="item">| json | logfmt | regexp</text>
<rect x="570" y="206" width="250" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="695" y="227" text-anchor="middle" class="item-sub">extract fields from line</text>
<rect x="40" y="246" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="250" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="271" text-anchor="middle" class="node-title-w">Format</text>
<rect x="250" y="250" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="405" y="271" text-anchor="middle" class="item">| __error__="" drop err</text>
<rect x="570" y="250" width="250" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="695" y="271" text-anchor="middle" class="item-sub">clean up parsed rows</text>
<rect x="40" y="290" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="294" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="315" text-anchor="middle" class="node-title-w">count_over_time</text>
<rect x="250" y="294" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="405" y="315" text-anchor="middle" class="item">count_over_time({app="api"}[5m])</text>
<rect x="570" y="294" width="250" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="695" y="315" text-anchor="middle" class="item-sub">how many logs in window</text>
<rect x="40" y="334" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="338" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="359" text-anchor="middle" class="node-title-w">rate</text>
<rect x="250" y="338" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="405" y="359" text-anchor="middle" class="item">rate({app="api"}[5m])</text>
<rect x="570" y="338" width="250" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="695" y="359" text-anchor="middle" class="item-sub">logs per second</text>
<rect x="40" y="378" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="382" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="403" text-anchor="middle" class="node-title-w">aggregation</text>
<rect x="250" y="382" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="405" y="403" text-anchor="middle" class="item">sum by (status) (count_over_time(...))</text>
<rect x="570" y="382" width="250" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="695" y="403" text-anchor="middle" class="item-sub">group like PromQL</text>
<rect x="40" y="432" width="780" height="0" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
</svg>
