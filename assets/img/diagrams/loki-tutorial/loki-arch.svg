<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">Loki Architecture: Push + Label-Index</text>
<rect x="60" y="80" width="140" height="50" rx="8" fill="#1e40af"/>
<text x="130" y="110" text-anchor="middle" class="node-title-w">Promtail</text>
<text x="130" y="128" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">/ Docker / OTel</text>
<line x1="200" y1="105" x2="280" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="240" y="97" text-anchor="middle" class="item-sub">push</text>
<rect x="280" y="80" width="160" height="50" rx="8" fill="#2563eb"/>
<text x="360" y="110" text-anchor="middle" class="node-title-w">Loki</text>
<text x="360" y="128" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">label-indexed</text>
<line x1="440" y1="105" x2="520" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="480" y="97" text-anchor="middle" class="item-sub">query</text>
<rect x="520" y="80" width="160" height="50" rx="8" fill="#1e40af"/>
<text x="600" y="110" text-anchor="middle" class="node-title-w">Grafana</text>
<text x="600" y="128" text-anchor="middle" font-size="11" fill="#e0e7ff" font-family="inherit">dashboards</text>
<rect x="40" y="170" width="820" height="90" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="196" text-anchor="middle" class="band-label">Loki vs ELK</text>
<text x="430" y="222" text-anchor="middle" class="item-sub">ELK (Elasticsearch): indexes every field -&gt; expensive storage, slow ingest at scale.</text>
<text x="430" y="242" text-anchor="middle" class="item-sub">Loki: indexes only labels (low cardinality) -&gt; 100x less storage, fast ingest.</text>
<text x="430" y="262" text-anchor="middle" class="item-sub">Query = label selector (fast) + grep within stream (brute-force, on the filtered set).</text>
<rect x="40" y="280" width="820" height="90" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="306" text-anchor="middle" class="band-label">The tradeoff</text>
<text x="430" y="332" text-anchor="middle" class="item-sub">ELK: fast full-text search on any field. Loki: fast by-label, then grep.</text>
<text x="430" y="352" text-anchor="middle" class="item-sub">Loki is for log query-by-label (which app, which pod); ELK for free-text search across fields.</text>
</svg>
