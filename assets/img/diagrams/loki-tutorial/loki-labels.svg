<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">Labels: Streams, Not Indexed Fields</text>
<rect x="40" y="70" width="780" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="76" width="180" height="34" rx="8" fill="#1e40af"/>
<text x="144" y="98" text-anchor="middle" class="node-title-w">Stream</text>
<rect x="250" y="76" width="330" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="98" text-anchor="middle" class="item">a unique set of label values = one log stream</text>
<rect x="590" y="76" width="230" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="705" y="98" text-anchor="middle" class="item-sub">{app,env,instance}</text>
<rect x="40" y="124" width="780" height="46" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="130" width="180" height="34" rx="8" fill="#1e40af"/>
<text x="144" y="152" text-anchor="middle" class="node-title-w">Labels indexed</text>
<rect x="250" y="130" width="330" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="152" text-anchor="middle" class="item">only labels are indexed (fast lookup)</text>
<rect x="590" y="130" width="230" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="705" y="152" text-anchor="middle" class="item-sub">app=api, env=prod</text>
<rect x="40" y="178" width="780" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="184" width="180" height="34" rx="8" fill="#1e40af"/>
<text x="144" y="206" text-anchor="middle" class="node-title-w">Log line NOT indexed</text>
<rect x="250" y="184" width="330" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="206" text-anchor="middle" class="item">the message text is stored, not indexed</text>
<rect x="590" y="184" width="230" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="705" y="206" text-anchor="middle" class="item-sub">grep at query time</text>
<rect x="40" y="232" width="780" height="46" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="238" width="180" height="34" rx="8" fill="#1e40af"/>
<text x="144" y="260" text-anchor="middle" class="node-title-w">Low cardinality only</text>
<rect x="250" y="238" width="330" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="260" text-anchor="middle" class="item">like Prometheus: bounded label values</text>
<rect x="590" y="238" width="230" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="705" y="260" text-anchor="middle" class="item-sub">NOT user_id/request_id</text>
<rect x="40" y="286" width="780" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="292" width="180" height="34" rx="8" fill="#1e40af"/>
<text x="144" y="314" text-anchor="middle" class="node-title-w">Best-effort ingest</text>
<rect x="250" y="292" width="330" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="314" text-anchor="middle" class="item">Loki won't reject logs if index is slow</text>
<rect x="590" y="292" width="230" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="705" y="314" text-anchor="middle" class="item-sub">high availability</text>
<rect x="40" y="340" width="780" height="46" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="346" width="180" height="34" rx="8" fill="#1e40af"/>
<text x="144" y="368" text-anchor="middle" class="node-title-w">Relabeling</text>
<rect x="250" y="346" width="330" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="368" text-anchor="middle" class="item">Promtail drops/changes labels before push</text>
<rect x="590" y="346" width="230" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="705" y="368" text-anchor="middle" class="item-sub">filter at source</text>
<rect x="40" y="400" width="780" height="26" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="430" y="418" text-anchor="middle" class="note">High-cardinality labels (user_id) = too many streams -&gt; same OOM as Prometheus. Never.</text>
</svg>
