<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2566eb"/>
  </marker>
</defs>
<rect width="860" height="440" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">OIDC + PKCE + Security Best Practices</text>
<rect x="40" y="70" width="780" height="70" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="84" width="200" height="42" rx="8" fill="#2566eb"/>
<text x="154" y="110" text-anchor="middle" class="node-title-w">OIDC (identity)</text>
<rect x="274" y="84" width="120" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="334" y="103" text-anchor="middle" class="item">ID token</text>
<text x="334" y="118" text-anchor="middle" class="item-sub">JWT with user identity</text>
<rect x="404" y="84" width="120" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="464" y="103" text-anchor="middle" class="item">userinfo endpoint</text>
<text x="464" y="118" text-anchor="middle" class="item-sub">fetch user profile</text>
<rect x="534" y="84" width="120" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="594" y="103" text-anchor="middle" class="item">login vs OAuth</text>
<text x="594" y="118" text-anchor="middle" class="item-sub">OIDC = authn + authz</text>
<rect x="664" y="84" width="120" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="724" y="103" text-anchor="middle" class="item">nonce</text>
<text x="724" y="118" text-anchor="middle" class="item-sub">prevent replay</text>
<rect x="40" y="150" width="780" height="70" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="164" width="200" height="42" rx="8" fill="#1e40af"/>
<text x="154" y="190" text-anchor="middle" class="node-title-w">PKCE (security)</text>
<rect x="274" y="164" width="120" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="334" y="183" text-anchor="middle" class="item">code_verifier</text>
<text x="334" y="198" text-anchor="middle" class="item-sub">random per request</text>
<rect x="404" y="164" width="120" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="464" y="183" text-anchor="middle" class="item">code_challenge</text>
<text x="464" y="198" text-anchor="middle" class="item-sub">SHA256(verifier) sent upfront</text>
<rect x="534" y="164" width="120" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="594" y="183" text-anchor="middle" class="item">prevents code theft</text>
<text x="594" y="198" text-anchor="middle" class="item-sub">intercepted code is useless</text>
<rect x="664" y="164" width="120" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="724" y="183" text-anchor="middle" class="item">required for SPA/mobile</text>
<text x="724" y="198" text-anchor="middle" class="item-sub">no client secret</text>
<rect x="40" y="230" width="780" height="70" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="244" width="200" height="42" rx="8" fill="#2566eb"/>
<text x="154" y="270" text-anchor="middle" class="node-title-w">Best practices</text>
<rect x="274" y="244" width="120" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="334" y="263" text-anchor="middle" class="item">state param</text>
<text x="334" y="278" text-anchor="middle" class="item-sub">CSRF protection on callback</text>
<rect x="404" y="244" width="120" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="464" y="263" text-anchor="middle" class="item">secure storage</text>
<text x="464" y="278" text-anchor="middle" class="item-sub">no localStorage for tokens (SPA)</text>
<rect x="534" y="244" width="120" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="594" y="263" text-anchor="middle" class="item">https cookies</text>
<text x="594" y="278" text-anchor="middle" class="item-sub">for server-side sessions</text>
<rect x="664" y="244" width="120" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="724" y="263" text-anchor="middle" class="item">short+long</text>
<text x="724" y="278" text-anchor="middle" class="item-sub">short access + long refresh</text>
<rect x="40" y="310" width="780" height="70" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="324" width="200" height="42" rx="8" fill="#1e40af"/>
<text x="154" y="350" text-anchor="middle" class="node-title-w">Pitfalls</text>
<rect x="274" y="324" width="120" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="334" y="343" text-anchor="middle" class="item">implicit flow</text>
<text x="334" y="358" text-anchor="middle" class="item-sub">no refresh, token in URL -&gt; deprecated</text>
<rect x="404" y="324" width="120" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="464" y="343" text-anchor="middle" class="item">token in URL</text>
<text x="464" y="358" text-anchor="middle" class="item-sub">logs + referrer leak</text>
<rect x="534" y="324" width="120" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="594" y="343" text-anchor="middle" class="item">no PKCE on SPA</text>
<text x="594" y="358" text-anchor="middle" class="item-sub">auth code can be stolen</text>
<rect x="664" y="324" width="120" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="724" y="343" text-anchor="middle" class="item">storing secret in SPA</text>
<text x="724" y="358" text-anchor="middle" class="item-sub">there is no secret in a browser</text>
</svg>
