<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2566eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">OAuth 2.0 Flows</text>
<rect x="40" y="70" width="780" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="76" width="230" height="34" rx="8" fill="#1e40af"/>
<text x="169" y="98" text-anchor="middle" class="node-title-w">Authorization Code + PKCE</text>
<rect x="300" y="76" width="310" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="455" y="98" text-anchor="middle" class="item">user login in browser, code -&gt; token; PKCE for SPA/mobile</text>
<rect x="620" y="76" width="200" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="720" y="98" text-anchor="middle" class="item-sub">the standard flow</text>
<rect x="40" y="124" width="780" height="46" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="130" width="230" height="34" rx="8" fill="#1e40af"/>
<text x="169" y="152" text-anchor="middle" class="node-title-w">Client Credentials</text>
<rect x="300" y="130" width="310" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="455" y="152" text-anchor="middle" class="item">server-to-server, no user; client_id + secret -&gt; token</text>
<rect x="620" y="130" width="200" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="720" y="152" text-anchor="middle" class="item-sub">service accounts, m2m</text>
<rect x="40" y="178" width="780" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="184" width="230" height="34" rx="8" fill="#1e40af"/>
<text x="169" y="206" text-anchor="middle" class="node-title-w">Device Code</text>
<rect x="300" y="184" width="310" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="455" y="206" text-anchor="middle" class="item">user authorizes on another device; poll for token</text>
<rect x="620" y="184" width="200" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="720" y="206" text-anchor="middle" class="item-sub">TVs, IoT, CLI tools</text>
<rect x="40" y="232" width="780" height="46" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="238" width="230" height="34" rx="8" fill="#1e40af"/>
<text x="169" y="260" text-anchor="middle" class="node-title-w">Implicit (deprecated)</text>
<rect x="300" y="238" width="310" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="455" y="260" text-anchor="middle" class="item">token in URL fragment; no refresh; insecure for SPA</text>
<rect x="620" y="238" width="200" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="720" y="260" text-anchor="middle" class="item-sub">use auth code + PKCE instead</text>
<rect x="40" y="286" width="780" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="292" width="230" height="34" rx="8" fill="#1e40af"/>
<text x="169" y="314" text-anchor="middle" class="node-title-w">Password (deprecated)</text>
<rect x="300" y="292" width="310" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="455" y="314" text-anchor="middle" class="item">user gives password to the client directly</text>
<rect x="620" y="292" width="200" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="720" y="314" text-anchor="middle" class="item-sub">never use; insecure</text>
<rect x="40" y="340" width="780" height="46" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="346" width="230" height="34" rx="8" fill="#1e40af"/>
<text x="169" y="368" text-anchor="middle" class="node-title-w">Refresh Token</text>
<rect x="300" y="346" width="310" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="455" y="368" text-anchor="middle" class="item">exchange expired access token's refresh for a new one</text>
<rect x="620" y="346" width="200" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="720" y="368" text-anchor="middle" class="item-sub">no re-login needed</text>
<rect x="40" y="400" width="780" height="26" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="430" y="418" text-anchor="middle" class="note">Use Auth Code + PKCE for everything user-facing; Client Credentials for machine-to-machine.</text>
</svg>
