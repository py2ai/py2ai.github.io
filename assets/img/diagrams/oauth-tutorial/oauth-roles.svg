<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2566eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">OAuth Roles: Who's Who</text>
<rect x="40" y="70" width="780" height="56" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="78" width="200" height="40" rx="8" fill="#1e40af"/>
<text x="154" y="103" text-anchor="middle" class="node-title-w">Resource Owner</text>
<rect x="270" y="78" width="290" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="103" text-anchor="middle" class="item">the user who owns the data</text>
<rect x="580" y="78" width="240" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="103" text-anchor="middle" class="item-sub">e.g. you, on Google</text>
<rect x="40" y="134" width="780" height="56" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="142" width="200" height="40" rx="8" fill="#1e40af"/>
<text x="154" y="167" text-anchor="middle" class="node-title-w">Client</text>
<rect x="270" y="142" width="290" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="167" text-anchor="middle" class="item">the app that wants access</text>
<rect x="580" y="142" width="240" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="167" text-anchor="middle" class="item-sub">e.g. a photo-printing app</text>
<rect x="40" y="198" width="780" height="56" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="206" width="200" height="40" rx="8" fill="#1e40af"/>
<text x="154" y="231" text-anchor="middle" class="node-title-w">Authorization Server</text>
<rect x="270" y="206" width="290" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="231" text-anchor="middle" class="item">issues tokens after user consents</text>
<rect x="580" y="206" width="240" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="231" text-anchor="middle" class="item-sub">e.g. Google's OAuth endpoint</text>
<rect x="40" y="262" width="780" height="56" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="270" width="200" height="40" rx="8" fill="#1e40af"/>
<text x="154" y="295" text-anchor="middle" class="node-title-w">Resource Server</text>
<rect x="270" y="270" width="290" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="295" text-anchor="middle" class="item">the API that holds the data</text>
<rect x="580" y="270" width="240" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="295" text-anchor="middle" class="item-sub">e.g. Google Photos API</text>
<rect x="40" y="340" width="820" height="50" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="366" text-anchor="middle" class="band-label">The authorization code flow</text>
<text x="430" y="390" text-anchor="middle" class="item-sub">User -&gt; Client -&gt; Auth Server (consent) -&gt; code -&gt; Client -&gt; Auth Server (code for token) -&gt; Client -&gt; Resource Server (token)</text>
</svg>
