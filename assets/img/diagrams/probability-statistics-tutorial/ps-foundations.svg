<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">Foundations: Sample Space, Events, RVs</text>
<rect x="40" y="70" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="74" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="95" text-anchor="middle" class="node-title-w">Sample space</text>
<rect x="250" y="74" width="320" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="410" y="95" text-anchor="middle" class="item">all possible outcomes</text>
<rect x="580" y="74" width="240" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="95" text-anchor="middle" class="item-sub">Ω</text>
<rect x="40" y="114" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="118" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="139" text-anchor="middle" class="node-title-w">Event</text>
<rect x="250" y="118" width="320" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="410" y="139" text-anchor="middle" class="item">subset of outcomes</text>
<rect x="580" y="118" width="240" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="139" text-anchor="middle" class="item-sub">A ⊆ Ω</text>
<rect x="40" y="158" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="162" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="183" text-anchor="middle" class="node-title-w">Probability</text>
<rect x="250" y="162" width="320" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="410" y="183" text-anchor="middle" class="item">P(A) in [0,1]; sums to 1</text>
<rect x="580" y="162" width="240" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="183" text-anchor="middle" class="item-sub">Σ P = 1</text>
<rect x="40" y="202" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="206" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="227" text-anchor="middle" class="node-title-w">Independence</text>
<rect x="250" y="206" width="320" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="410" y="227" text-anchor="middle" class="item">A and B don't affect each other</text>
<rect x="580" y="206" width="240" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="227" text-anchor="middle" class="item-sub">P(A∩B)=P(A)P(B)</text>
<rect x="40" y="246" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="250" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="271" text-anchor="middle" class="node-title-w">Conditional</text>
<rect x="250" y="250" width="320" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="410" y="271" text-anchor="middle" class="item">P(A|B) = P(A∩B)/P(B)</text>
<rect x="580" y="250" width="240" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="271" text-anchor="middle" class="item-sub">updated belief given B</text>
<rect x="40" y="290" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="294" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="315" text-anchor="middle" class="node-title-w">Random variable</text>
<rect x="250" y="294" width="320" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="410" y="315" text-anchor="middle" class="item">function Ω -&gt; numbers</text>
<rect x="580" y="294" width="240" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="315" text-anchor="middle" class="item-sub">X: discrete or continuous</text>
<rect x="40" y="334" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="338" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="359" text-anchor="middle" class="node-title-w">Joint / marginal</text>
<rect x="250" y="338" width="320" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="410" y="359" text-anchor="middle" class="item">P(X,Y), sum out a var</text>
<rect x="580" y="338" width="240" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="359" text-anchor="middle" class="item-sub">P(X) = Σy P(X,y)</text>
<rect x="40" y="378" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="382" width="180" height="32" rx="8" fill="#1e40af"/>
<text x="144" y="403" text-anchor="middle" class="node-title-w">Expectation</text>
<rect x="250" y="382" width="320" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="410" y="403" text-anchor="middle" class="item">weighted average</text>
<rect x="580" y="382" width="240" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="403" text-anchor="middle" class="item-sub">E[X] = Σ x P(x)</text>
</svg>
