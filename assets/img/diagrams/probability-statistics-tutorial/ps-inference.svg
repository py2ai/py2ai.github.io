<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">Statistical Inference: CLT, CI, Hypothesis Tests</text>
<rect x="40" y="70" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="74" width="190" height="32" rx="8" fill="#1e40af"/>
<text x="149" y="95" text-anchor="middle" class="node-title-w">Sampling distribution</text>
<rect x="260" y="74" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="95" text-anchor="middle" class="item">distribution of a statistic over samples</text>
<rect x="580" y="74" width="240" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="95" text-anchor="middle" class="item-sub">sample mean varies</text>
<rect x="40" y="114" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="118" width="190" height="32" rx="8" fill="#1e40af"/>
<text x="149" y="139" text-anchor="middle" class="node-title-w">Central Limit Theorem</text>
<rect x="260" y="118" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="139" text-anchor="middle" class="item">sample mean -&gt; Normal as n grows</text>
<rect x="580" y="118" width="240" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="139" text-anchor="middle" class="item-sub">regardless of population</text>
<rect x="40" y="158" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="162" width="190" height="32" rx="8" fill="#1e40af"/>
<text x="149" y="183" text-anchor="middle" class="node-title-w">Confidence interval</text>
<rect x="260" y="162" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="183" text-anchor="middle" class="item">range that covers true param X% of time</text>
<rect x="580" y="162" width="240" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="183" text-anchor="middle" class="item-sub">95% CI: mean ± 1.96 SE</text>
<rect x="40" y="202" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="206" width="190" height="32" rx="8" fill="#1e40af"/>
<text x="149" y="227" text-anchor="middle" class="node-title-w">Standard error</text>
<rect x="260" y="206" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="227" text-anchor="middle" class="item">SD of the sampling distribution</text>
<rect x="580" y="206" width="240" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="227" text-anchor="middle" class="item-sub">SE = σ/√n</text>
<rect x="40" y="246" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="250" width="190" height="32" rx="8" fill="#1e40af"/>
<text x="149" y="271" text-anchor="middle" class="node-title-w">Hypothesis test</text>
<rect x="260" y="250" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="271" text-anchor="middle" class="item">H0 null vs H1 alternative</text>
<rect x="580" y="250" width="240" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="271" text-anchor="middle" class="item-sub">is effect real?</text>
<rect x="40" y="290" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="294" width="190" height="32" rx="8" fill="#1e40af"/>
<text x="149" y="315" text-anchor="middle" class="node-title-w">p-value</text>
<rect x="260" y="294" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="315" text-anchor="middle" class="item">P(data | H0 true)</text>
<rect x="580" y="294" width="240" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="315" text-anchor="middle" class="item-sub">small -&gt; reject H0</text>
<rect x="40" y="334" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="338" width="190" height="32" rx="8" fill="#1e40af"/>
<text x="149" y="359" text-anchor="middle" class="node-title-w">Type I / II error</text>
<rect x="260" y="338" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="359" text-anchor="middle" class="item">false positive / false negative</text>
<rect x="580" y="338" width="240" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="359" text-anchor="middle" class="item-sub">α, β; power = 1-β</text>
<rect x="40" y="378" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="382" width="190" height="32" rx="8" fill="#1e40af"/>
<text x="149" y="403" text-anchor="middle" class="node-title-w">t-test / chi-square</text>
<rect x="260" y="382" width="310" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="415" y="403" text-anchor="middle" class="item">compare means / categorical</text>
<rect x="580" y="382" width="240" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="700" y="403" text-anchor="middle" class="item-sub">χ² goodness of fit</text>
<rect x="40" y="432" width="780" height="0" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
</svg>
