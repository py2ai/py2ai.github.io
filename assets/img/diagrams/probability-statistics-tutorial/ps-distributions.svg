<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
<style>
  .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .band-label { font-size: 13px; font-weight: 700; fill: #1e40af; letter-spacing:0.3px; }
  .node-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
  .node-title-w { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .item { font-size: 12px; font-weight: 400; fill: #0f172a; }
  .item-sub { font-size: 11px; font-weight: 400; fill: #475569; }
  .stage { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .stage-sub { font-size: 11px; font-weight: 400; fill: #e0e7ff; }
  .note { font-size: 12px; font-weight: 400; fill: #1e40af; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#475569"/>
  </marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="strokeWidth" orient="auto">
    <path d="M0,1 L8,5 L0,9 z" fill="#2563eb"/>
  </marker>
</defs>
<rect width="860" height="430" fill="#ffffff"/>
<text x="290" y="38" text-anchor="middle" class="title">Distributions: Discrete, Continuous, Moments</text>
<rect x="40" y="70" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="74" width="150" height="32" rx="8" fill="#1e40af"/>
<text x="129" y="95" text-anchor="middle" class="node-title-w">Bernoulli</text>
<rect x="220" y="74" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="365" y="95" text-anchor="middle" class="item">1 trial, p=P(success)</text>
<rect x="520" y="74" width="300" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="670" y="95" text-anchor="middle" class="item-sub">coin flip</text>
<rect x="40" y="114" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="118" width="150" height="32" rx="8" fill="#1e40af"/>
<text x="129" y="139" text-anchor="middle" class="node-title-w">Binomial</text>
<rect x="220" y="118" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="365" y="139" text-anchor="middle" class="item">n trials, k successes</text>
<rect x="520" y="118" width="300" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="670" y="139" text-anchor="middle" class="item-sub">n coin flips -&gt; heads count</text>
<rect x="40" y="158" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="162" width="150" height="32" rx="8" fill="#1e40af"/>
<text x="129" y="183" text-anchor="middle" class="node-title-w">Poisson</text>
<rect x="220" y="162" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="365" y="183" text-anchor="middle" class="item">events per interval, rate λ</text>
<rect x="520" y="162" width="300" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="670" y="183" text-anchor="middle" class="item-sub">rare events, fixed rate</text>
<rect x="40" y="202" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="206" width="150" height="32" rx="8" fill="#1e40af"/>
<text x="129" y="227" text-anchor="middle" class="node-title-w">Geometric</text>
<rect x="220" y="206" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="365" y="227" text-anchor="middle" class="item">trials until first success</text>
<rect x="520" y="206" width="300" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="670" y="227" text-anchor="middle" class="item-sub">time to first head</text>
<rect x="40" y="246" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="250" width="150" height="32" rx="8" fill="#1e40af"/>
<text x="129" y="271" text-anchor="middle" class="node-title-w">Uniform</text>
<rect x="220" y="250" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="365" y="271" text-anchor="middle" class="item">equal probability over range</text>
<rect x="520" y="250" width="300" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="670" y="271" text-anchor="middle" class="item-sub">fair die, RNG</text>
<rect x="40" y="290" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="294" width="150" height="32" rx="8" fill="#1e40af"/>
<text x="129" y="315" text-anchor="middle" class="node-title-w">Normal (Gaussian)</text>
<rect x="220" y="294" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="365" y="315" text-anchor="middle" class="item">bell curve, mean μ, var σ²</text>
<rect x="520" y="294" width="300" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="670" y="315" text-anchor="middle" class="item-sub">CLT limit, everywhere</text>
<rect x="40" y="334" width="780" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="338" width="150" height="32" rx="8" fill="#1e40af"/>
<text x="129" y="359" text-anchor="middle" class="node-title-w">Exponential</text>
<rect x="220" y="338" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="365" y="359" text-anchor="middle" class="item">time between Poisson events</text>
<rect x="520" y="338" width="300" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="670" y="359" text-anchor="middle" class="item-sub">inter-arrival time</text>
<rect x="40" y="378" width="780" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="54" y="382" width="150" height="32" rx="8" fill="#1e40af"/>
<text x="129" y="403" text-anchor="middle" class="node-title-w">Beta</text>
<rect x="220" y="382" width="290" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="365" y="403" text-anchor="middle" class="item">probabilities on [0,1]</text>
<rect x="520" y="382" width="300" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="670" y="403" text-anchor="middle" class="item-sub">prior for Bernoulli/Binomial</text>
<rect x="40" y="432" width="780" height="0" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
</svg>
