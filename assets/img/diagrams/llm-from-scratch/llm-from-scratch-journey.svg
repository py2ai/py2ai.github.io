<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" font-family="Inter, system-ui, -apple-system, sans-serif">
<style>
  text { fill: #1e293b; }
  .title { font-size:20px; font-weight:700; fill:#1e293b; }
  .section { font-size:15px; font-weight:700; }
  .label { font-size:12px; font-weight:600; fill:#1e293b; }
  .small { font-size:10px; fill:#64748b; }
  .annot { font-size:9px; fill:#94a3b8; }
  .mono { font-size:11px; font-family:JetBrains Mono, Fira Code, monospace; fill:#1e293b; }
</style>
<defs>
  <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
  <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#059669"/></marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/></marker>
  <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ea580c"/></marker>
  <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#dc2626"/></marker>
  <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/></filter>
</defs>
<rect width="1200" height="1000" fill="#ffffff"/>
<text x="600" y="30" text-anchor="middle" class="title">I Built an LLM From Scratch: 30M Parameters, 4 Hours, 1 GPU</text>
<text x="600" y="48" text-anchor="middle" class="small">What actually happens when you train a GPT from random noise to coherent stories</text>

<!-- ==================== PANEL 1: Build Pipeline ==================== -->
<text x="40" y="78" class="section" fill="#2563eb">1. The Build Pipeline</text>
<text x="40" y="94" class="small">Five stages, each one plain PyTorch with no</text>
<text x="40" y="106" class="small">framework magic - every line of code is yours.</text>

<rect x="58" y="124" width="310" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
<text x="70" y="140" class="label">1. Train a BPE tokenizer</text>
<text x="70" y="154" class="annot">vocab 8,192, learned from the corpus itself</text>
<line x1="213" y1="160" x2="213" y2="178" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<rect x="58" y="178" width="310" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
<text x="70" y="194" class="label">2. Implement GPT blocks</text>
<text x="70" y="208" class="annot">causal attention, MLP, residuals, LayerNorm</text>
<line x1="213" y1="214" x2="213" y2="232" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<rect x="58" y="232" width="310" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
<text x="70" y="248" class="label">3. Build the data pipeline</text>
<text x="70" y="262" class="annot">256-token windows, targets shifted by one</text>
<line x1="213" y1="268" x2="213" y2="286" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<rect x="58" y="286" width="310" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
<text x="70" y="302" class="label">4. Run the training loop</text>
<text x="70" y="316" class="annot">AdamW, cosine LR decay, gradient clipping</text>
<line x1="213" y1="322" x2="213" y2="340" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<rect x="58" y="340" width="310" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
<text x="70" y="356" class="label">5. Generate text</text>
<text x="70" y="370" class="annot">temperature 0.8, top-p 0.95 (see previous post)</text>

<rect x="48" y="392" width="334" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="60" y="410" class="small" fill="#1e293b">Total: roughly 600 lines of PyTorch. No Trainer,</text>
<text x="60" y="426" class="small" fill="#1e293b">no Lightning, no config files.</text>

<rect x="48" y="452" width="334" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="60" y="470" class="small" fill="#1e293b">Result: a 30M-parameter model that writes coherent</text>
<text x="60" y="486" class="small" fill="#1e293b">children's stories after 4 hours on one GPU.</text>

<!-- ==================== PANEL 2: Model Anatomy ==================== -->
<text x="425" y="78" class="section" fill="#059669">2. Model Anatomy: 30M Parameters</text>
<text x="425" y="94" class="small">A GPT-2-style decoder-only transformer, scaled down</text>
<text x="425" y="106" class="small">to train on a single consumer GPU.</text>

<rect x="433" y="124" width="334" height="22" rx="4" fill="#d1fae5"/>
<text x="445" y="139" class="small" font-weight="700" fill="#1e293b">Hyperparameter</text>
<text x="640" y="139" class="small" font-weight="700" fill="#1e293b">Value</text>
<rect x="433" y="146" width="334" height="22" fill="#f0fdf4"/>
<text x="445" y="161" class="small" fill="#1e293b">vocab size</text>
<text x="640" y="161" class="small" fill="#1e293b">8,192</text>
<rect x="433" y="168" width="334" height="22" fill="#ffffff"/>
<text x="445" y="183" class="small" fill="#1e293b">d_model</text>
<text x="640" y="183" class="small" fill="#1e293b">512</text>
<rect x="433" y="190" width="334" height="22" fill="#f0fdf4"/>
<text x="445" y="205" class="small" fill="#1e293b">layers</text>
<text x="640" y="205" class="small" fill="#1e293b">8</text>
<rect x="433" y="212" width="334" height="22" fill="#ffffff"/>
<text x="445" y="227" class="small" fill="#1e293b">attention heads</text>
<text x="640" y="227" class="small" fill="#1e293b">8</text>
<rect x="433" y="234" width="334" height="22" fill="#f0fdf4"/>
<text x="445" y="249" class="small" fill="#1e293b">context length</text>
<text x="640" y="249" class="small" fill="#1e293b">256 tokens</text>
<rect x="433" y="124" width="334" height="132" rx="4" fill="none" stroke="#059669" stroke-width="1.5"/>

<text x="433" y="282" class="label" fill="#059669">Where the parameters live</text>
<text x="441" y="302" class="small" fill="#1e293b">MLP x8</text>
<rect x="500" y="290" width="168" height="16" rx="2" fill="#059669" opacity="0.85"/>
<text x="674" y="302" class="annot" fill="#1e293b">16.8M (57%)</text>
<text x="441" y="328" class="small" fill="#1e293b">Attn x8</text>
<rect x="500" y="316" width="84" height="16" rx="2" fill="#059669" opacity="0.6"/>
<text x="590" y="328" class="annot" fill="#1e293b">8.4M (28%)</text>
<text x="441" y="354" class="small" fill="#1e293b">Embed</text>
<rect x="500" y="342" width="42" height="16" rx="2" fill="#059669" opacity="0.4"/>
<text x="548" y="354" class="annot" fill="#1e293b">4.2M (14%, tied)</text>

<rect x="433" y="372" width="334" height="62" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
<text x="445" y="390" class="small" fill="#1e293b">The MLP blocks hold over half the parameters.</text>
<text x="445" y="406" class="small" fill="#1e293b">Attention gets the glory, but the feed-forward</text>
<text x="445" y="422" class="small" fill="#1e293b">networks store most of the knowledge.</text>

<rect x="433" y="446" width="334" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
<text x="445" y="464" class="small" fill="#1e293b">Tied embeddings: input and output matrices share</text>
<text x="445" y="480" class="small" fill="#1e293b">weights - saves 4.2M params and trains better.</text>

<!-- ==================== PANEL 3: Training Loop ==================== -->
<text x="810" y="78" class="section" fill="#7c3aed">3. The Training Loop</text>
<text x="810" y="94" class="small">Four operations repeated 20,000 times. The loop is</text>
<text x="810" y="106" class="small">15 lines of code - the details decide success.</text>

<rect x="848" y="124" width="270" height="30" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
<text x="983" y="143" text-anchor="middle" class="label">1. Forward pass (batch 64 x 256)</text>
<line x1="983" y1="154" x2="983" y2="170" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
<rect x="848" y="170" width="270" height="30" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
<text x="983" y="189" text-anchor="middle" class="label">2. Cross-entropy loss (next token)</text>
<line x1="983" y1="200" x2="983" y2="216" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
<rect x="848" y="216" width="270" height="30" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
<text x="983" y="235" text-anchor="middle" class="label">3. loss.backward() - autograd</text>
<line x1="983" y1="246" x2="983" y2="262" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
<rect x="848" y="262" width="270" height="30" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="983" y="281" text-anchor="middle" class="label">4. AdamW step + LR schedule</text>
<polyline points="848,277 830,277 830,139 848,139" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
<text x="822" y="208" transform="rotate(-90 822 208)" text-anchor="middle" class="annot" fill="#7c3aed">repeat 20,000x</text>

<rect x="818" y="308" width="334" height="76" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="830" y="326" class="small" fill="#1e293b">AdamW lr 3e-4 to 3e-5 (cosine decay)</text>
<text x="830" y="342" class="small" fill="#1e293b">warmup 500 steps, grad clip 1.0</text>
<text x="830" y="358" class="small" fill="#1e293b">bf16 autocast, weight decay 0.1</text>
<text x="830" y="374" class="small" fill="#1e293b">16,384 tokens per step, ~330M seen total</text>

<rect x="818" y="396" width="334" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
<text x="830" y="414" class="small" fill="#1e293b">The training loop is simple; the hyperparameters</text>
<text x="830" y="430" class="small" fill="#1e293b">around it are where runs live or die.</text>

<!-- ==================== PANEL 4: Loss Curve ==================== -->
<text x="40" y="586" class="section" fill="#ea580c">4. The Loss Curve</text>
<text x="40" y="602" class="small">Training loss over 20,000 steps. The shape tells you</text>
<text x="40" y="614" class="small">what the model is learning at each phase.</text>

<line x1="70" y1="640" x2="70" y2="772" stroke="#64748b" stroke-width="1.5"/>
<line x1="70" y1="772" x2="374" y2="772" stroke="#64748b" stroke-width="1.5"/>
<text x="60" y="644" text-anchor="end" class="annot" fill="#64748b">9</text>
<text x="60" y="692" text-anchor="end" class="annot" fill="#64748b">6</text>
<text x="60" y="740" text-anchor="end" class="annot" fill="#64748b">3</text>
<line x1="70" y1="688" x2="374" y2="688" stroke="#e2e8f0" stroke-width="1"/>
<line x1="70" y1="736" x2="374" y2="736" stroke="#e2e8f0" stroke-width="1"/>
<text x="70" y="786" text-anchor="middle" class="annot" fill="#64748b">0</text>
<text x="222" y="786" text-anchor="middle" class="annot" fill="#64748b">10k</text>
<text x="374" y="786" text-anchor="middle" class="annot" fill="#64748b">20k steps</text>
<text x="46" y="706" text-anchor="middle" class="annot" fill="#64748b" transform="rotate(-90 46 706)">loss</text>

<polyline points="70,640 78,704 85,720 100,733 146,741 222,749 298,753 374,755" fill="none" stroke="#ea580c" stroke-width="2.5"/>
<text x="80" y="634" class="annot" fill="#ea580c">ln(8192) = 9.0</text>

<text x="48" y="814" class="small" fill="#1e293b">step 0 - 1k: vocabulary, loss 9.0 to 4.0</text>
<text x="48" y="832" class="small" fill="#1e293b">step 1k - 10k: grammar, loss 4.0 to 2.2</text>
<text x="48" y="850" class="small" fill="#1e293b">step 10k - 20k: narrative, loss 2.2 to 1.8</text>

<rect x="48" y="876" width="334" height="48" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
<text x="60" y="894" class="small" fill="#1e293b">Sanity check: step-0 loss must equal ln(vocab) = 9.0.</text>
<text x="60" y="910" class="small" fill="#1e293b">If not, a bug is already hiding somewhere.</text>

<rect x="48" y="936" width="334" height="48" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
<text x="60" y="954" class="small" fill="#1e293b">Loss measures surprise: 1.8 means the model narrows</text>
<text x="60" y="970" class="small" fill="#1e293b">the next token to about e^1.8 = 6 likely candidates.</text>

<!-- ==================== PANEL 5: What It Learned ==================== -->
<text x="425" y="586" class="section" fill="#dc2626">5. What It Learned, When</text>
<text x="425" y="602" class="small">Samples from checkpoints at the same prompt -</text>
<text x="425" y="614" class="small">"Once upon a time" - watch structure emerge.</text>

<rect x="433" y="632" width="334" height="56" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="445" y="648" class="small" font-weight="700" fill="#dc2626">step 0: random init</text>
<text x="445" y="665" class="mono" font-size="10">zj qw fjqp zzz kx</text>
<text x="445" y="680" class="annot">pure noise - no structure</text>

<rect x="433" y="696" width="334" height="56" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="445" y="712" class="small" font-weight="700" fill="#dc2626">step 500: words appear</text>
<text x="445" y="729" class="mono" font-size="10">the and of a to was</text>
<text x="445" y="744" class="annot">common words, no syntax yet</text>

<rect x="433" y="760" width="334" height="56" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="445" y="776" class="small" font-weight="700" fill="#dc2626">step 5,000: grammar emerges</text>
<text x="445" y="793" class="mono" font-size="10">the cat sat on the mat and said</text>
<text x="445" y="808" class="annot">valid syntax, weak meaning</text>

<rect x="433" y="824" width="334" height="56" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="445" y="840" class="small" font-weight="700" fill="#dc2626">step 20,000: coherent story</text>
<text x="445" y="857" class="mono" font-size="10">a little fox named Pip found a red</text>
<text x="445" y="872" class="annot">narrative with consistent entities</text>

<rect x="433" y="896" width="334" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="445" y="914" class="small" fill="#1e293b">Capabilities emerge in a fixed order: vocabulary,</text>
<text x="445" y="930" class="small" fill="#1e293b">then syntax, then meaning - never the reverse.</text>

<!-- ==================== PANEL 6: Cost and Lessons ==================== -->
<text x="810" y="586" class="section" fill="#475569">6. Cost and Hard Lessons</text>
<text x="810" y="602" class="small">The full experiment costs less than a pizza.</text>
<text x="810" y="614" class="small">The lessons apply at every scale.</text>

<rect x="818" y="636" width="334" height="22" rx="4" fill="#e2e8f0"/>
<text x="826" y="651" class="small" font-weight="700" fill="#1e293b">Resource</text>
<text x="1010" y="651" class="small" font-weight="700" fill="#1e293b">Used</text>
<rect x="818" y="658" width="334" height="22" fill="#f8fafc"/>
<text x="826" y="673" class="small" fill="#1e293b">GPU</text>
<text x="1010" y="673" class="small" fill="#1e293b">1x RTX 4090</text>
<rect x="818" y="680" width="334" height="22" fill="#ffffff"/>
<text x="826" y="695" class="small" fill="#1e293b">Training time</text>
<text x="1010" y="695" class="small" fill="#1e293b">4.2 hours</text>
<rect x="818" y="702" width="334" height="22" fill="#f8fafc"/>
<text x="826" y="717" class="small" fill="#1e293b">Tokens seen</text>
<text x="1010" y="717" class="small" fill="#1e293b">~330 million</text>
<rect x="818" y="724" width="334" height="22" fill="#ffffff"/>
<text x="826" y="739" class="small" fill="#1e293b">Power and wear</text>
<text x="1010" y="739" class="small" fill="#1e293b">~$2</text>
<rect x="818" y="636" width="334" height="110" rx="4" fill="none" stroke="#475569" stroke-width="1.5"/>

<rect x="818" y="776" width="334" height="44" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="830" y="794" class="small" font-weight="700" fill="#1e293b">The loss curve is the debugger</text>
<text x="830" y="810" class="small" fill="#1e293b">Spikes, plateaus, and NaNs all have causes.</text>

<rect x="818" y="828" width="334" height="44" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="830" y="846" class="small" font-weight="700" fill="#1e293b">Data quality beats model size</text>
<text x="830" y="862" class="small" fill="#1e293b">Clean stories teach more than noisy web text.</text>

<rect x="818" y="880" width="334" height="44" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="830" y="898" class="small" font-weight="700" fill="#1e293b">Gradient clipping saves runs</text>
<text x="830" y="914" class="small" fill="#1e293b">One bad batch can kill an unclipped run.</text>

<rect x="818" y="932" width="334" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="830" y="950" class="small" font-weight="700" fill="#1e293b">Small models teach big mechanics</text>
<text x="830" y="966" class="small" fill="#1e293b">Same code shapes frontier models - only scale differs.</text>

</svg>
