<!-- verilation_note -->
<g id="node12" class="node">
<title>verilation_note</title>
<polygon fill="#fff9c4" stroke="black" points="491.5,-1039 270.75,-1039 270.75,-947 497.5,-947 497.5,-1033 491.5,-1039"/>
<polyline fill="none" stroke="black" points="491.5,-1039 491.5,-1033"/>
<polyline fill="none" stroke="black" points="497.5,-1033 491.5,-1033"/>
<text xml:space="preserve" text-anchor="middle" x="384.12" y="-1025.5" font-family="Arial" font-size="10.00" fill="#1a1a2e">Key insight:</text>
<text xml:space="preserve" text-anchor="middle" x="384.12" y="-1013.5" font-family="Arial" font-size="10.00" fill="#1a1a2e">Verilator does NOT interpret RTL at runtime.</text>
<text xml:space="preserve" text-anchor="middle" x="384.12" y="-1001.5" font-family="Arial" font-size="10.00" fill="#1a1a2e">It COMPILES the RTL into optimized C++ that</text>
<text xml:space="preserve" text-anchor="middle" x="384.12" y="-989.5" font-family="Arial" font-size="10.00" fill="#1a1a2e">runs as native code. This is why it is</text>
<text xml:space="preserve" text-anchor="middle" x="384.12" y="-977.5" font-family="Arial" font-size="10.00" fill="#1a1a2e">10x&#45;100x faster than interpreted simulators:</text>
<text xml:space="preserve" text-anchor="middle" x="384.12" y="-965.5" font-family="Arial" font-size="10.00" fill="#1a1a2e">the simulation cost is paid once at compile time,</text>
<text xml:space="preserve" text-anchor="middle" x="384.12" y="-953.5" font-family="Arial" font-size="10.00" fill="#1a1a2e">not per&#45;cycle at run time.</text>
</g>
